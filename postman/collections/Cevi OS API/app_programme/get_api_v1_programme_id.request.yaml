$kind: http-request
name: "GET /api/v1/programme/:id"
order: 30000
method: GET
url: "{{baseUrl}}/api/v1/programme/{{programmId}}"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
