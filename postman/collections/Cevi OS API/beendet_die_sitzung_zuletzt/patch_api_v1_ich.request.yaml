$kind: http-request
name: "PATCH /api/v1/ich"
order: 28000
method: PATCH
url: "{{baseUrl}}/api/v1/ich"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "pushChat": false
    }
