$kind: http-request
name: "PATCH /api/v1/admin/kinder/:id"
order: 56000
method: PATCH
url: "{{baseUrl}}/api/v1/admin/kinder/{{patchKindId}}"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "vorname": "Matrix",
      "nachname": "Kind",
      "stufeId": "{{stufeAId}}",
      "aktiv": true
    }
