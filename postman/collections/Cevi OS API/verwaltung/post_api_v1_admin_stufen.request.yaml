$kind: http-request
name: "POST /api/v1/admin/stufen"
order: 55000
method: POST
url: "{{baseUrl}}/api/v1/admin/stufen"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "name": "Matrix Stufe",
      "kuerzel": "M"
    }
