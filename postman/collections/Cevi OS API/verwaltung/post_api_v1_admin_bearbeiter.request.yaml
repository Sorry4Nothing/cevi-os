$kind: http-request
name: "POST /api/v1/admin/bearbeiter"
order: 87000
method: POST
url: "{{baseUrl}}/api/v1/admin/bearbeiter"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "objektTyp": "seite",
      "userId": "{{tagPersonId}}"
    }
