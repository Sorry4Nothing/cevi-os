$kind: http-request
name: "PATCH /api/v1/admin/stufen/:id"
order: 56000
method: PATCH
url: "{{baseUrl}}/api/v1/admin/stufen/{{patchStufeId}}"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "name": "Matrix Stufe",
      "kuerzel": "M",
      "reihenfolge": 50
    }
