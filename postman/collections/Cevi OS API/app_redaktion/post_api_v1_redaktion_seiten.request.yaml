$kind: http-request
name: "POST /api/v1/redaktion/seiten"
order: 121000
method: POST
url: "{{baseUrl}}/api/v1/redaktion/seiten"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "titel": "Matrix",
      "adresse": "matrix-neu",
      "sichtbarkeit": {
        "art": "angemeldet"
      }
    }
