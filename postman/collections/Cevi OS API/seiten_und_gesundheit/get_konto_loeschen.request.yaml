$kind: http-request
name: "GET /konto-loeschen"
order: 3000
method: GET
url: "{{baseUrl}}/konto-loeschen"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
