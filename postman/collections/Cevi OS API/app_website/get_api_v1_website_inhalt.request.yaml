$kind: http-request
name: "GET /api/v1/website/inhalt"
order: 151000
method: GET
url: "{{baseUrl}}/api/v1/website/inhalt?pfad=/matrix-unbekannt"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
