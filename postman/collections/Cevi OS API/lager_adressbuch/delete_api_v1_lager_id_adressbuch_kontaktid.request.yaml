$kind: http-request
name: "DELETE /api/v1/lager/:id/adressbuch/:kontaktId"
order: 160000
method: DELETE
url: "{{baseUrl}}{{pfad_L4}}"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
