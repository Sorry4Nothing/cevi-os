$kind: http-request
name: "GET /api/v1/formulare/:id"
order: 414000
method: GET
url: "{{baseUrl}}/api/v1/formulare/{{formularId}}"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
