$kind: http-request
name: "POST /api/auth/change-password"
order: 21000
method: POST
url: "{{baseUrl}}/api/auth/change-password"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "currentPassword": "nur-fuer-tests-falsch",
      "newPassword": "nur-fuer-tests-neu-1"
    }
