$kind: http-request
name: "POST /api/v1/chats/:id/nachrichten"
order: 65000
method: POST
url: "{{baseUrl}}/api/v1/chats/{{gruppenchatAId}}/nachrichten"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "text": "Hallo aus der Matrix"
    }
