$kind: http-request
name: "GET /api/v1/chats/:id/nachrichten"
order: 61000
method: GET
url: "{{baseUrl}}/api/v1/chats/{{gruppenchatAId}}/nachrichten"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
