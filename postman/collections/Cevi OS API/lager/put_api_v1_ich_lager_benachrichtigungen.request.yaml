$kind: http-request
name: "PUT /api/v1/ich/lager-benachrichtigungen"
order: 200000
method: PUT
url: "{{baseUrl}}/api/v1/ich/lager-benachrichtigungen"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "arten": [
        {
          "art": "frist",
          "aktiv": true
        }
      ]
    }
