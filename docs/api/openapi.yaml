  # lager-pfade: ressorts (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
  /api/v1/lager/{id}/ressorts:
    get:
      operationId: holeLagerRessorts
      summary: Ressorts des Lagers auflisten
      description: |
        Braucht das Recht `ressorts.lesen` (Standard: Lagerleitung, Leitung und Lesen; die Rechte lassen sich je Lager einstellen).

        Alle Ressorts des Lagers als flache Liste, sortiert nach `reihenfolge` und ID; den Baum bauen die Apps aus `parentId`. Leitung und Stellvertretung kommen mit dem Namen der Person (beim Lesen aufgelöst, eine Umbenennung bricht nichts). Eine gebündelte Abfrage je Seite, Seitenwechsel über `nach` und `limit`.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID oder Abfrage. 401 ohne Anmeldung. 403 ohne das Recht (Team im Standard). 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
        - name: nach
          in: query
          required: false
          description: Cursor, die Angabe `naechster` der vorigen Seite.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Höchstens so viele Einträge je Seite.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Eine Seite Ressorts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerRessortSeite"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    post:
      operationId: legeLagerRessortAn
      summary: Ressort anlegen
      description: |
        Braucht das Recht `ressorts.bearbeiten` (Standard: nur die Lagerleitung; die Abteilungsleitung gilt als Lagerleitung). Schreibt über den Sync-Kern: Jede Änderung zählt die Version der Zeile hoch, kommt in den Änderungsfeed und braucht die zuletzt gesehene `version` (409 `VERSION_KONFLIKT` sonst).

        Leitung und Stellvertretung müssen Mitglieder dieses Lagers sein (400 `KEIN_MITGLIED`), ein übergeordnetes Ressort muss im Lager existieren (400 `RESSORT_UNBEKANNT`). Das Kürzel ist je Lager eindeutig, ohne Beachtung der Gross- und Kleinschreibung (409 `KUERZEL_VERGEBEN`). Ohne `reihenfolge` kommt das Ressort ans Ende.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 201 bei Erfolg. 400 bei ungültiger Eingabe, `KEIN_MITGLIED` oder `RESSORT_UNBEKANNT`. 401 ohne Anmeldung. 403 ohne das Recht. 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft. 409 bei `LAGER_GESCHLOSSEN` oder `KUERZEL_VERGEBEN`.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LagerRessortAnlegen"
      responses:
        "201":
          description: Das neue Ressort.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerRessort"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: |
            Das Lager ist abgeschlossen (`LAGER_GESCHLOSSEN`), die `version` ist veraltet (`VERSION_KONFLIKT`, mit dem aktuellen Stand und den abweichenden Feldern), das Kürzel ist im Lager schon vergeben (`KUERZEL_VERGEBEN`) oder das Ressort hat Unterressorts (`RESSORT_HAT_UNTERRESSORTS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/lager/{id}/ressorts/reihenfolge:
    put:
      operationId: setzeLagerRessortReihenfolge
      summary: Reihenfolge der Ressorts ändern
      description: |
        Braucht das Recht `ressorts.bearbeiten` (Standard: nur die Lagerleitung; die Abteilungsleitung gilt als Lagerleitung). Schreibt über den Sync-Kern: Jede Änderung zählt die Version der Zeile hoch, kommt in den Änderungsfeed und braucht die zuletzt gesehene `version` (409 `VERSION_KONFLIKT` sonst).

        Die Stelle in der Liste `eintraege` ist die neue `reihenfolge` (0, 1, 2, ...). Jeder Eintrag nennt die zuletzt gesehene `version`; Ressorts, deren Reihenfolge schon stimmt, bleiben unberührt (keine neue Version). Alles oder nichts: Ein Konflikt oder ein unbekanntes Ressort ändert nichts. Höchstens 200 Einträge, jede ID höchstens einmal.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger Eingabe. 401 ohne Anmeldung. 403 ohne das Recht. 404 bei unbekanntem Lager oder unbekanntem Ressort, fremder Abteilung oder ohne Mitgliedschaft. 409 bei `LAGER_GESCHLOSSEN` oder `VERSION_KONFLIKT`.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LagerRessortReihenfolge"
      responses:
        "204":
          description: Reihenfolge gespeichert.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/LagerKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
