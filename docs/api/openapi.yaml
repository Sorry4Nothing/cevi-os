      description: |
        Braucht das Recht `anwesenheit.bearbeiten` (Standard: nur die Lagerleitung; die Abteilungsleitung gilt als Lagerleitung). Bis zur Frist trägt das Team seine eigene Anwesenheit direkt ein; danach nur noch per Anfrage. `null` hebt die Frist auf. Die Änderung steht im Protokoll (`lager_anwesenheit_frist`).

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger Eingabe. 401 ohne Anmeldung. 403 ohne das Recht. 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft. 409 bei abgeschlossenem Lager.
      tags:
