      required:
        - vorname
        - nachname
        - stufeId
      additionalProperties: false
      properties:
        vorname:
          type: string
          minLength: 1
          maxLength: 100
          description: Leerraum am Rand wird entfernt, danach mindestens 1 Zeichen.
        nachname:
          type: string
          minLength: 1
          maxLength: 100
          description: Leerraum am Rand wird entfernt, danach mindestens 1 Zeichen.
        ceviName:
          type: string
          maxLength: 50
          description: Freiwillig. Leerraum am Rand wird entfernt; leer heisst nicht gesetzt.
        stufeId:
          type: string
          format: uuid
          description: Stufe der eigenen Abteilung; sonst 400.
    AdminKindAendern:
      type: object
      description: Alle Felder optional; ein leeres Objekt ist erlaubt (No-op).
      additionalProperties: false
      properties:
        vorname:
          type: string
          minLength: 1
          maxLength: 100
        nachname:
          type: string
          minLength: 1
          maxLength: 100
        ceviName:
          type:
            - string
            - "null"
          maxLength: 50
          description: Leerraum am Rand wird entfernt; leer oder `null` löscht den Cevi-Namen.
        stufeId:
          type: string
          format: uuid
          description: Stufe der eigenen Abteilung; sonst 400. Eine unveränderte Stufe ist ein No-op.
        aktiv:
          type: boolean
          description: "`false` deaktiviert das Kind, `true` aktiviert es wieder. Ein unveränderter Wert ist ein No-op."
        eltern:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Ersetzt die Liste der Elternteile. IDs von Personen der eigenen Abteilung; sonst 400.
          items:
            type: string
            format: uuid
    Medium:
      type: object
      required:
        - id
        - mimeTyp
        - groesse
        - breite
        - hoehe
        - altText
        - dekorativ
        - sichtbarkeit
        - url
        - erstelltAm
      properties:
        id:
          type: string
          format: uuid
        mimeTyp:
          type: string
          description: Bilder sind immer `image/webp`. `application/pdf` kommt nur bei einem alten PDF-Medium vor (vor #428); es lässt sich löschen, wird aber nicht mehr ausgeliefert.
          enum:
            - image/webp
            - application/pdf
        groesse:
          type: integer
          description: Bytes der gespeicherten Datei, nach dem Verkleinern.
        breite:
          type:
            - integer
            - "null"
          description: Pixel, nur bei Bildern.
        hoehe:
          type:
            - integer
            - "null"
          description: Pixel, nur bei Bildern.
        altText:
          type:
            - string
            - "null"
          description: "`null` bei dekorativen Bildern."
        dekorativ:
          type: boolean
        sichtbarkeit:
          type: string
          enum:
            - oeffentlich
            - angemeldet
        url:
          type: string
          description: Pfad zur Datei (`GET /api/v1/medien/{id}`).
        erstelltAm:
          type: string
          format: date-time
    MedienListe:
      type: object
      required:
        - medien
      properties:
        medien:
          type: array
          items:
            $ref: "#/components/schemas/Medium"
    RedaktionSichtbarkeit:
      description: |
        Wer die Seite sieht (Sichtbarkeitsmodul): `oeffentlich` ohne Anmeldung, `angemeldet` jede Person der Abteilung, `tags` nur Personen mit einem der Tags (ODER); die Abteilungsleitung sieht immer alles. Eine leere Tag-Menge sieht nur die Abteilungsleitung. Höchstens 50 Tags ohne Doppelte, alle aus der Abteilung.
      oneOf:
        - type: object
          required:
            - art
          additionalProperties: false
          properties:
            art:
              const: oeffentlich
        - type: object
          required:
            - art
          additionalProperties: false
          properties:
            art:
              const: angemeldet
        - type: object
          required:
            - art
            - tagIds
          additionalProperties: false
          properties:
            art:
              const: tags
            tagIds:
              type: array
              maxItems: 50
              uniqueItems: true
              items:
                type: string
                format: uuid
    RedaktionSeite:
      type: object
      required:
        - id
        - elternId
        - adresse
        - pfad
        - titel
        - reihenfolge
        - sichtbarkeit
        - tagId
        - veroeffentlicht
        - geaendertAm
      properties:
        id:
          type: string
          format: uuid
        elternId:
          type:
            - string
            - "null"
          format: uuid
          description: "`null` heisst: oberste Ebene."
        adresse:
          type: string
          description: Ein Pfadstück, `a-z`, `0-9` und `-`, höchstens 60 Zeichen.
        pfad:
          type: string
          description: Volle Adresse über alle Elternseiten, zum Beispiel `/stufen/biber`.
        titel:
          type: string
        reihenfolge:
          type: integer
        sichtbarkeit:
          $ref: "#/components/schemas/RedaktionSichtbarkeit"
        tagId:
          type:
            - string
            - "null"
          format: uuid
          description: Die Gruppe (Stufe, Team, ...), zu der die Seite gehört; `null` ohne Gruppe.
        veroeffentlicht:
          type: boolean
          description: Ob die Seite eine veröffentlichte Version hat.
        geaendertAm:
          type: string
          format: date-time
          description: Letzte Änderung an Struktur oder Entwurf der Seite.
    RedaktionSeitenListe:
      type: object
      required:
        - seiten
      properties:
        seiten:
          type: array
          items:
            $ref: "#/components/schemas/RedaktionSeite"
    RedaktionSeiteAnlegen:
      type: object
      required:
        - titel
        - adresse
        - sichtbarkeit
      additionalProperties: false
      properties:
        titel:
          type: string
          minLength: 1
          maxLength: 150
        adresse:
          type: string
          pattern: "^[a-z0-9-]{1,60}$"
        elternId:
          type:
            - string
            - "null"
          format: uuid
        sichtbarkeit:
          $ref: "#/components/schemas/RedaktionSichtbarkeit"
        tagId:
          type:
            - string
            - "null"
          format: uuid
        reihenfolge:
          type: integer
          minimum: 0
          maximum: 100000
          description: Ohne Angabe ans Ende der Geschwister.
    RedaktionSeiteAendern:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        titel:
          type: string
          minLength: 1
          maxLength: 150
        adresse:
          type: string
          pattern: "^[a-z0-9-]{1,60}$"
        elternId:
          type:
            - string
            - "null"
          format: uuid
        reihenfolge:
          type: integer
          minimum: 0
          maximum: 100000
        sichtbarkeit:
          $ref: "#/components/schemas/RedaktionSichtbarkeit"
        tagId:
          type:
            - string
            - "null"
          format: uuid
    # lager-schemas: lager (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
    LagerRolle:
      type: string
      description: Rolle in einem Lager. Die Abteilungsleitung (Admin) gilt in Lagern der eigenen Abteilung immer als `lagerleitung`.
      enum:
        - lagerleitung
        - leitung
        - team
        - lesen
    LagerStatus:
      type: string
