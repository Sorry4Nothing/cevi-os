        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: |
            Das Programm hat schon begonnen. Die Anmeldung lässt sich nicht mehr ändern. Der Fehlercode ist
            `PROGRAMM_BEGONNEN`.
          content:
