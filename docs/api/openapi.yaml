  /api/v1/push-token:
    put:
      operationId: pushTokenRegistrieren
      summary: Push-Token des Geräts für die aktuelle Sitzung hinterlegen
      tags:
        - Push
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      description: |
        Hinterlegt das Push-Token des Geräts bei der aktuellen Sitzung. Pro Sitzung gibt es ein Token: Ein neues
        ersetzt das alte derselben Sitzung. Schickt eine andere Sitzung dasselbe Token (geteiltes Handy), zieht es
        zu dieser Sitzung um und gehört nicht mehr der früheren Person. Mit dem Ende der Sitzung (Abmelden,
        Löschen des Kontos) verschwindet auch das Token.

        Der Body ist strikt: Fremde Felder (`userId`, `sessionId`), ein Token in falscher Form, eine andere
        Plattform oder ein leerer Body ergeben 400. Das Token ist ein FCM-Registrierungstoken: 20 bis 512 Zeichen aus Buchstaben, Ziffern
        und `_ : . -`. Die Form `ExponentPushToken[…]` aus der früheren Expo-Anbindung ergibt 400.

        **Rollen.** Alle angemeldeten Personen ausser bei offenem Pflichtwechsel des Passworts (403).
        Statuscodes: 204, 400, 401, 403, 426.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenAnfrage"
      responses:
        "204":
          description: Hinterlegt; kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/programme:
    get:
      operationId: programmeAuflisten
      summary: Programme eines Zeitfensters auflisten
      tags:
        - Programme
      description: |
        Liefert alle für die angemeldete Person sichtbaren Programme der eigenen Abteilung, die das Fenster
        `von` bis `bis` berühren. Das Fenster zählt in Schweizer Kalendertagen und ist beidseitig inklusive:
        Ein mehrtägiges Programm (Lager) erscheint an jedem seiner Tage. Ist `von` nach `bis`, ist die Liste leer
        (kein Fehler). Sortiert nach Beginn (ganztägige Programme ab 00:00 Schweizer Zeit ihres ersten Tages),
        bei Gleichstand nach `id`.

        Wer aufrufen darf: jede angemeldete Person. Sichtbar ist ein Programm so:
        - Administratorinnen und Administratoren sowie Stufenleitungen (SL) sehen jedes Programm der Abteilung,
          auch «intern» und ohne Stufenzuordnung.
        - Leitende sehen Programme mit Sichtbarkeit «leitende» oder «eltern», die einer ihrer Stufen zugeordnet sind.
        - Eltern sehen Programme mit Sichtbarkeit «eltern», die einer Stufe zugeordnet sind, in der ein aktives
          eigenes Kind ist.
        - Wer beides ist, sieht die Vereinigung.

        `googleBeschreibung` ist nur mit Leitungssicht gefüllt (Admin/SL: alle Programme der Abteilung; Leitende:
        Programme ihrer Stufen mit Sichtbarkeit «leitende» oder «eltern»), sonst `null`.

        Statuscodes: 200 Erfolg; 400 `von` oder `bis` fehlt, ist kein gültiges Datum `JJJJ-MM-TT`, beginnt mit Jahr
        0000 oder es gibt unbekannte Query-Parameter; 401 keine gültige Sitzung (auch deaktiviertes Konto);
        403 das Konto muss zuerst das Passwort ändern (gilt für alle Routen ausser `GET /api/v1/ich`);
        426 App-Version zu alt; 429 zu viele Anfragen.
      parameters:
