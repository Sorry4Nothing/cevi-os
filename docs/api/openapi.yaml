        `ProgrammDetail.eigeneAnmeldung`). Es gibt kein Zurücksetzen auf «offen».

        Wer aufrufen darf: Leitende und SL, die in mindestens einer Stufe des Programms diese Rolle haben.
        Administratorinnen und Administratoren ohne solche Stufenrolle, SL und Leitende fremder Stufen sowie
        Eltern bekommen 403.

        Reihenfolge der Prüfung: Eingabe (400); Programm nicht sichtbar (404); Recht (403); Programm schon
        begonnen (409). Anders als bei der Teilnahme eines Kindes gilt hier nur der Beginn, nicht der Status
        «abgesagt».
        Statuscodes: 204 gespeichert, kein Body; 400 ungültige Eingabe; 401 keine gültige Sitzung; 403 keine
        Leitungsrolle in einer Stufe des Programms oder Konto muss zuerst das Passwort ändern; 404 Programm
        unbekannt oder nicht sichtbar; 409 Programm hat schon begonnen (Code `PROGRAMM_BEGONNEN`);
