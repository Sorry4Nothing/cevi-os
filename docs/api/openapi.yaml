  securitySchemes:
    sitzung:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: |
        Die Sitzung hängt an einem signierten Cookie, das `POST /api/auth/sign-in/username` (oder der Abschluss des
        zweiten Faktors) per `Set-Cookie` setzt. Es gibt weder Bearer-Token noch API-Schlüssel: Ein `Authorization`-Header
        wird nicht ausgewertet, und das Feld `token` in Antworten ist nicht als Bearer-Token verwendbar.

        **Name.** Unter HTTPS (Betrieb) heisst das Cookie `__Secure-better-auth.session_token`; ohne HTTPS
        `better-auth.session_token`. Der Name enthält immer `session_token`.

        **Speichern und senden.** Die App speichert die `name=wert`-Paare aus allen `Set-Cookie`-Headern unverändert
        (ohne Attribute wie `Path`, `Max-Age`) im sicheren Speicher des Geräts und schickt sie bei jedem Aufruf als
        `Cookie`-Header (mehrere Paare mit `; ` getrennt). Cookies mit `Max-Age=0` löscht sie aus dem Speicher.
        Ersetzt eine Antwort das Cookie (Verlängerung, Passwortwechsel, Einrichtung des zweiten Faktors), gilt das neue.

        **Lebensdauer.** 90 Tage, verlängert bei Nutzung durch `GET /api/auth/get-session` (einmal pro Tag höchstens).
        Die Routen unter `/api/v1` verlängern nicht. Kein Cookie-Cache: Eine beendete Sitzung (Abmelden, «Überall
        abmelden», Passwortwechsel auf einem anderen Gerät, Löschen oder Deaktivieren des Kontos) endet sofort mit 401.

        **Herkunft.** Jeder POST mit Cookie braucht eine vertraute Herkunft (siehe Parameter `Origin`).
    zweiterFaktorZwischenschritt:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.two_factor
      description: |
        Zwischen-Cookie, das `POST /api/auth/sign-in/username` bei eingerichtetem zweitem Faktor setzt
        (`twoFactorRedirect: true`). Es gilt nur für `POST /api/auth/two-factor/verify-totp` und
        `POST /api/auth/two-factor/verify-backup-code`. Gespeichert und gesendet wird es wie das Session-Cookie.
        Unter HTTPS trägt es den Präfix `__Secure-`, ohne HTTPS heisst es `better-auth.two_factor`; der Name endet
        immer auf `two_factor`.
  responses:
    LagerKonflikt409:
      description: |
        Das Lager ist abgeschlossen oder archiviert und lässt sich nicht ändern (`LAGER_GESCHLOSSEN`), oder ein aktives Lager würde seine letzte Lagerleitung verlieren (`LAGERLEITUNG_FEHLT`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LagerKonflikt"
    UngueltigeEingabe400:
      description: Ungültige Eingabe (code UNGUELTIGE_EINGABE), ohne Details
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    NichtAngemeldet401:
      description: Keine oder ungültige Sitzung (code NICHT_ANGEMELDET)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    KeineBerechtigung403:
      description: Keine Berechtigung (code KEINE_BERECHTIGUNG); bei ändernden Methoden auch, wenn der Origin-Header einer fremden Herkunft angehört
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    NichtGefunden404:
      description: Nicht gefunden (code NICHT_GEFUNDEN); auch für Objekte einer anderen Abteilung
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    AppVeraltet426:
      description: App-Version unter dem Minimum (code APP_VERALTET)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    RedaktionSeite400:
      description: |
        Ungültige Eingabe (code UNGUELTIGE_EINGABE) oder eine Regel des Seitenbaums: `ADRESSE_RESERVIERT` (Adresse auf der obersten Ebene reserviert), `SEITE_ZYKLUS` (Seite unter sich selbst oder einer Unterseite), `SEITE_ZU_TIEF` (mehr als 5 Ebenen).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    RedaktionSeite409:
      description: |
        Konflikt: `ADRESSE_VERGEBEN` (die Adresse gibt es unter dieser Elternseite schon), `TAG_VERGEBEN` (die Gruppe hat schon eine Seite) oder `SEITE_HAT_UNTERSEITEN` (Löschen mit Unterseiten).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    RedaktionDokument400:
      description: |
        Ungültige Eingabe (code UNGUELTIGE_EINGABE, ohne Details) oder ein Dokument, das den Bausteinkatalog verletzt (code `DOKUMENT_UNGUELTIG`, mit `fehler`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Fehler"
              - $ref: "#/components/schemas/RedaktionDokumentFehler"
    RedaktionVerweis422:
      description: |
        Das Dokument ist gültig, verweist aber auf etwas Unzulässiges, oder ein gespeichertes Dokument besteht das Schema nicht mehr (`DOKUMENT_UNGUELTIG`). `code` ist der erste Code, `fehler` nennt alle mit dem Pfad des Bausteins.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RedaktionDokumentFehler"
    AnwesenheitGeschlossen409:
      description: |
        Das Programm hat noch nicht begonnen oder liegt mehr als 14 Tage zurück. Die Anwesenheit lässt sich nicht
        erfassen oder ändern. Der Fehlercode ist `ANWESENHEIT_GESCHLOSSEN`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
          example:
            code: ANWESENHEIT_GESCHLOSSEN
            message: Die Anwesenheit lässt sich erst nach Beginn des Programms und bis 14 Tage danach erfassen.
    ZuVieleAnfragen429:
      description: Zu viele Anfragen (code ZU_VIELE_ANFRAGEN)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    LagerVersionKonflikt409:
      description: |
        Die Anfrage trug nicht die aktuelle `version` der Zeile (`VERSION_KONFLIKT`). Der Body enthält den aktuellen Stand und die abweichenden Felder.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LagerVersionKonflikt"
    RedaktionWeiterleitung409:
      description: |
        Konflikt: `WEITERLEITUNG_SCHLEIFE` (die Weiterleitung führt im Kreis), `WEITERLEITUNG_KETTE` (das Ziel ist selbst eine alte Adresse oder umgekehrt), `WEITERLEITUNG_ADRESSE_VERGEBEN` (die alte Adresse hat schon eine Weiterleitung) oder `WEITERLEITUNG_ZU_VIELE` (mehr als 1000).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    RedaktionEckdaten409:
      description: |
        Konflikt: `ECKDATEN_ZU_VIELE` (mehr als 20 gepflegte kommende Daten je Stufe).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
