          description: Entzogen.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/redaktion/seiten:
    get:
      operationId: listeRedaktionSeiten
      summary: Seiten der Website, die die Person bearbeiten darf
      description: |
        Namensraum `/api/v1/redaktion` für Personen mit Bearbeitungsrecht, nicht nur Admins. Zugang haben die Abteilungsleitung, jede Stufenleitung und Personen mit einem Recht auf Seiten in `bearbeiter` (auf die Person oder einen Tag, den sie trägt); alle anderen bekommen 403. Admins brauchen auch hier den zweiten Faktor (Code `ZWEITER_FAKTOR_FEHLT`).

        Die Liste enthält nur Seiten, die die Person bearbeiten darf: die Abteilungsleitung und die Redaktion (Recht auf alle Seiten) alle Seiten der Abteilung, eine Stufenleitung die Seiten ihrer Stufe (`tagId` = Stufe). `elternId` zeigt auch auf Seiten, die nicht in der Liste stehen. Sortiert nach `reihenfolge`, dann `adresse`; den Baum baut der Client aus `elternId`. Der Inhalt der Seiten gehört nicht zu dieser Route.

        Statuscodes: 200 bei Erfolg. 403 ohne Zugang.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Seiten, nach Reihenfolge sortiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedaktionSeitenListe"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    post:
      operationId: legeRedaktionSeiteAn
      summary: Seite anlegen
      description: |
        Nur Abteilungsleitung und Redaktion. Die neue Seite hat noch keinen Inhalt und keine veröffentlichte Version. Ohne `reihenfolge` kommt sie ans Ende ihrer Geschwister. Adresse, Elternseite, Titel, Reihenfolge und Sichtbarkeit wirken sofort; nur der Inhalt ist später versioniert.

        Regeln: `adresse` besteht aus `a-z`, `0-9` und `-`, höchstens 60 Zeichen. Auf der obersten Ebene sind `api`, `admin`, `health`, `datenschutz`, `konto-loeschen`, `support`, `website`, `anmelden`, `medien`, `ical`, `sitemap.xml`, `robots.txt` und `.well-known` reserviert. Der Baum ist höchstens 5 Ebenen tief. Die Adresse ist unter einer Elternseite eindeutig, und eine Gruppe (`tagId`) hat höchstens eine Seite. Die Tags der Sichtbarkeit müssen zur Abteilung gehören.

        Reihenfolge der Prüfungen: Zugang (403), Body (400), Elternseite in der eigenen Abteilung (404), Recht zum Anlegen (403), Gruppe in der eigenen Abteilung (404), Tags der Sichtbarkeit (400), reservierte Adresse und Tiefe (400), Eindeutigkeit (409). Das Anlegen steht im Audit-Log (`seite_angelegt`; Kennungen und Art der Sichtbarkeit, nie der Titel).

        Statuscodes: 201 bei Erfolg. 400 bei ungültiger Eingabe, mit den Codes `ADRESSE_RESERVIERT` und `SEITE_ZU_TIEF` für die beiden Regeln. 403 ohne Recht. 404 für unbekannte Elternseite oder Gruppe. 409 mit `ADRESSE_VERGEBEN` oder `TAG_VERGEBEN`.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedaktionSeiteAnlegen"
      responses:
        "201":
          description: Seite angelegt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAngelegt"
        "400":
          $ref: "#/components/responses/RedaktionSeite400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/RedaktionSeite409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/redaktion/seiten/{id}:
    get:
      operationId: leseRedaktionSeite
      summary: Eine Seite lesen
      description: |
        Struktur und Sichtbarkeit einer Seite, ohne Inhalt. `pfad` ist die volle Adresse über alle Elternseiten.

        Reihenfolge der Prüfungen: Pfad (400), Seite in der eigenen Abteilung (404, auch für Seiten anderer Abteilungen), dann das Recht an dieser Seite (403): Abteilungsleitung, Redaktion, Stufenleitung der Gruppe der Seite oder ein Recht auf genau diese Seite.

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID. 403 ohne Recht an dieser Seite. 404 für unbekannte Seiten.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/RedaktionSeiteId"
      responses:
        "200":
          description: Die Seite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedaktionSeite"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    patch:
      operationId: aendereRedaktionSeite
      summary: Struktur einer Seite ändern
      description: |
        Ändert Titel, Adresse, Elternseite, Reihenfolge, Sichtbarkeit oder Gruppe; nur die gesendeten Felder. Die Änderung wirkt sofort, auch das Zurückziehen einer Sichtbarkeit. Den Inhalt ändert diese Route nie.

        Wer die Seite bearbeiten darf (siehe `GET`), darf Titel, Adresse, Reihenfolge und Sichtbarkeit ändern. Eine andere Elternseite setzt voraus, dass die Person auch diese bearbeiten darf; auf die oberste Ebene (`elternId: null`) setzt nur die Abteilungsleitung oder die Redaktion. Die Gruppe (`tagId`) ändern ebenfalls nur Abteilungsleitung und Redaktion, weil sie festlegt, welche Stufenleitung die Seite bearbeitet. Die Regeln für Adresse, Tiefe und Tags wie beim Anlegen; zusätzlich lässt sich eine Seite nicht unter sich selbst oder eine ihrer Unterseiten legen (`SEITE_ZYKLUS`). Strukturänderungen einer Abteilung laufen nacheinander.

        Reihenfolge der Prüfungen: Pfad und Body (400), Seite in der eigenen Abteilung (404), Recht an der Seite (403), neue Elternseite (404, 403), Gruppe (403, 404), Tags der Sichtbarkeit (400), Adresse, Zyklus und Tiefe (400), Eindeutigkeit (409). Das Audit-Log (`seite_geaendert`) nennt nur die Namen der geänderten Felder.

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger Eingabe (unbekannte Felder, kein Feld) oder wegen `ADRESSE_RESERVIERT`, `SEITE_ZYKLUS`, `SEITE_ZU_TIEF`. 403 ohne Recht. 404 für unbekannte Seite, Elternseite oder Gruppe. 409 mit `ADRESSE_VERGEBEN` oder `TAG_VERGEBEN`.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/RedaktionSeiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedaktionSeiteAendern"
      responses:
        "204":
          description: Geändert.
        "400":
          $ref: "#/components/responses/RedaktionSeite400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/RedaktionSeite409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: loescheRedaktionSeite
      summary: Seite löschen
      description: |
        Nur Abteilungsleitung und Redaktion. Löscht die Seite samt Entwurf und allen Versionen. Mit Unterseiten antwortet der Server mit 409 `SEITE_HAT_UNTERSEITEN`: Sie sind zuerst zu verschieben oder zu löschen. Ein Recht auf genau diese Seite in `bearbeiter` fällt mit weg. Das Löschen steht im Audit-Log (`seite_geloescht`, ohne Inhalt).

        Reihenfolge der Prüfungen: Pfad (400), Seite in der eigenen Abteilung (404), Recht zum Löschen (403), Unterseiten (409).

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger ID. 403 ohne Recht, auch für die Stufenleitung der Seite. 404 für unbekannte Seiten. 409 `SEITE_HAT_UNTERSEITEN`.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/RedaktionSeiteId"
      responses:
        "204":
          description: Gelöscht.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/RedaktionSeite409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/redaktion/seiten/{id}/entwurf:
    get:
      operationId: leseRedaktionEntwurf
      summary: Entwurf einer Seite lesen
      description: |
        Das Dokument der Bausteine im Entwurf (Form `{ v: 1, titel, bausteine }`, siehe Bausteinkatalog) und der Zähler, den das Speichern mitschicken muss. Eine neue Seite hat `dokument: null` und Zähler 0. `unveroeffentlicht` ist wahr, wenn es einen Entwurf gibt und er von der veröffentlichten Version abweicht (auch ohne veröffentlichte Version).

        Reihenfolge der Prüfungen: Pfad (400), Seite in der eigenen Abteilung (404), Recht an dieser Seite (403): Abteilungsleitung, Redaktion, Stufenleitung der Gruppe der Seite oder ein Recht auf genau diese Seite. Dasselbe gilt für alle Routen unter `/seiten/{id}/…` dieses Abschnitts.

        Statuscodes: 200, 400, 403, 404.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/RedaktionSeiteId"
      responses:
        "200":
          description: Der Entwurf.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedaktionEntwurf"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    put:
      operationId: speichereRedaktionEntwurf
      summary: Entwurf speichern
      description: |
        Ersetzt den Entwurf durch das ganze Dokument. `zaehler` ist der Zähler aus dem letzten Lesen oder Speichern: Nur wer den aktuellen Stand kennt, schreibt (ein atomarer Schritt, keine Sperre). Wer mit einem veralteten Zähler speichert, bekommt 409 `KONFLIKT` mit dem aktuellen Zähler und Dokument und überschreibt nichts. Es gibt keine Sperre auf Bausteine.

        Das Dokument besteht aus Bausteinen des Katalogs (strenge Schemas, kein HTML). Ein ungültiges Dokument antwortet 400 `DOKUMENT_UNGUELTIG` mit `fehler` (je Eintrag der Pfad, zum Beispiel `bausteine.2.daten.ziel`, und der Code der Prüfung, nie Werte der Eingabe, höchstens 20).

        Verweisprüfung beim Speichern (und noch einmal beim Veröffentlichen), je Baustein mit Pfad `bausteine.<n>`. Fehler antworten 422; `code` ist der erste Fehlercode, `fehler` nennt alle. `MEDIUM_UNBEKANNT`: das Medium gibt es nicht oder gehört einer anderen Abteilung (beides gleich). `MEDIUM_FORMAT`: Bild und Galerie brauchen ein Bild (kein altes PDF-Medium). `MEDIUM_NICHT_OEFFENTLICH`: in einem öffentlichen Baustein (eigene Sichtbarkeit «öffentlich» oder «erbt» auf einer öffentlichen Seite) darf nur ein öffentliches Medium stehen. `TAG_UNBEKANNT`, `PERSON_UNBEKANNT`: nicht in der eigenen Abteilung. `SEITE_UNBEKANNT`: ein Link auf eine Seitenadresse, die es in der Abteilung nicht gibt (die Startseite `/` lässt sich nicht prüfen). Den Alt-Text sichert das Medium selbst (Pflicht oder «dekorativ» beim Hochladen).

        Je Person höchstens 120 Speicherungen in der Minute (429). Das Speichern steht nicht im Audit-Log. Die Anfrage darf höchstens 512 KiB gross sein (413 `ZU_GROSS`); das Schema begrenzt Mengen und Längen, nicht die Bytes.

        Reihenfolge der Prüfungen: Pfad und Body-Form (400), Seite (404), Recht (403), Rate-Limit (429), Dokument (400), Verweise (422), Zähler (409).

        Statuscodes: 200 bei Erfolg, mit dem neuen Zähler. 400, 403, 404, 409, 413, 422, 429.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/RedaktionSeiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedaktionEntwurfSpeichern"
      responses:
        "200":
          description: Gespeichert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedaktionZaehler"
        "400":
          $ref: "#/components/responses/RedaktionDokument400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Der Zähler ist veraltet (code `KONFLIKT`). Der Body trägt den aktuellen Zähler und das aktuelle Dokument.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedaktionKonflikt"
        "413":
          description: Die Anfrage ist grösser als 512 KiB (code ZU_GROSS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "422":
          $ref: "#/components/responses/RedaktionVerweis422"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/redaktion/seiten/{id}/veroeffentlichen:
    post:
      operationId: veroeffentlicheRedaktionSeite
      summary: Entwurf veröffentlichen
      description: |
        Prüft das ganze Dokument des Entwurfs und die Verweise noch einmal (Sichtbarkeit der Seite und Medien können sich seit dem Speichern geändert haben), legt eine neue, unveränderliche Version mit der nächsten Nummer an (ab 1) und setzt die veröffentlichte Version der Seite auf sie. Kein Body.

        409 `NICHTS_ZU_VEROEFFENTLICHEN`, wenn es keinen Entwurf gibt oder er gleich der veröffentlichten Version ist (die Seite ist nach dem Zurückziehen nicht veröffentlicht: dann gilt jeder Entwurf als neu). Zwei gleichzeitige Veröffentlichungen laufen nacheinander: Die zweite bekommt 409. 422 `DOKUMENT_UNGUELTIG` oder ein Code der Verweisprüfung (siehe Speichern).

        Meldet das Ereignis `version_veroeffentlicht` an die Auslieferung. Audit-Log: `seite_veroeffentlicht` mit der Versionsnummer, nie Inhalt.

        Statuscodes: 201 bei Erfolg, mit der Nummer. 400, 403, 404, 409, 422.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/RedaktionSeiteId"
      responses:
        "201":
          description: Version angelegt.
          content:
            application/json:
              schema:
                type: object
                required:
                  - nr
                properties:
                  nr:
                    type: integer
                    minimum: 1
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Nichts zu veröffentlichen (code `NICHTS_ZU_VEROEFFENTLICHEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "422":
          $ref: "#/components/responses/RedaktionVerweis422"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/redaktion/seiten/{id}/zurueckziehen:
    post:
      operationId: ziehRedaktionSeiteZurueck
      summary: Veröffentlichung zurückziehen
      description: |
        Setzt nur die veröffentlichte Version der Seite zurück: Die Seite ist danach nicht mehr veröffentlicht. Alle Versionen und der Entwurf bleiben. Kein Body. 409 `NICHT_VEROEFFENTLICHT`, wenn nichts veröffentlicht ist.

        Meldet das Ereignis `version_zurueckgezogen`. Audit-Log: `seite_zurueckgezogen`.

        Statuscodes: 204 bei Erfolg. 400, 403, 404, 409.
      tags:
