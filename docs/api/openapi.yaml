  /api/v1/website/inhalt:
    get:
      operationId: leseWebsiteInhalt
      summary: Geschützte Bausteine einer Seite der Website nachladen
      description: |
        Für das Skript der öffentlichen Website (#354). Liefert für die Seite `pfad` aus der veröffentlichten Version nur die Bausteine, die die Person laut Sichtbarkeit sehen darf, als Knoten: Elemente `{ tag, attr?, kinder? }` und Texte (Zeichenketten). Der Server liefert für geschützte Inhalte nie HTML; das Skript baut aus den Knoten DOM-Knoten ohne `innerHTML`. Telefon, E-Mail und Foto von Personen kommen nie vor.

        Bei einer öffentlichen Seite kommen nur die Bausteine mit engerer Sichtbarkeit (angemeldet oder Tags), bei einer ganz geschützten Seite alle Bausteine, die die Person sehen darf, dazu der Titel. Ein Baustein ohne Inhalt (zum Beispiel ein fehlendes Medium) fehlt in der Liste.

        `pfad` ist `/` (die Startseite, Adresse `start`) oder `/a/b` mit bis zu fünf Adressstücken aus `a-z`, `0-9` und `-`, ohne Schrägstrich am Ende, Anfrage oder Anker. Die Seite wird nur in der Abteilung der Person gesucht.

        Ohne Sitzung 401 mit dem üblichen neutralen Body. Mit Sitzung antworten eine unbekannte Seite, eine Seite ohne veröffentlichte Version, eine Seite einer anderen Abteilung, eine Seite, die die Person nicht sehen darf, und ein ungültiger `pfad` alle gleich mit 404, ohne Hinweis auf den Inhalt. Die Antwort ist `Cache-Control: private, no-store` und `Vary: Cookie`.

        Statuscodes: 200, 401, 403 (Pflichtwechsel des Passworts offen), 404.
      tags:
        - Website
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: pfad
          in: query
          required: true
          description: Adresse der Seite auf der Website, zum Beispiel `/stufen/woelfe`.
          schema:
            type: string
            maxLength: 400
            pattern: "^/([a-z0-9-]{1,60}(/[a-z0-9-]{1,60}){0,4})?$"
      responses:
        "200":
          description: Die Bausteine in der Reihenfolge der Seite.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteInhalt"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/redaktion/weiterleitungen:
    get:
      operationId: listeRedaktionWeiterleitungen
      summary: Weiterleitungen alter Adressen
      description: |
        Alle Weiterleitungen der Abteilung, nach alter Adresse sortiert (höchstens 1000, darum ohne Seitenwechsel). Nur Abteilungsleitung und Redaktion; eine Stufenleitung hat Zugang zum Namensraum, aber nicht zu dieser Route (403). Admins brauchen den zweiten Faktor.

        Zusätzlich zu diesen Zeilen leitet die Website die alte Adresse `/cevistufe-<name>` der Stufenseiten automatisch auf die Stufenseite, sobald sie besteht; diese Zeilen stehen nicht in der Liste.

        Statuscodes: 200 bei Erfolg. 403 ohne Recht.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Weiterleitungen der Abteilung.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedaktionWeiterleitungenListe"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    post:
      operationId: legeRedaktionWeiterleitungAn
      summary: Weiterleitung anlegen
      description: |
        Nur Abteilungsleitung und Redaktion. Eine alte Adresse leitet auf einen internen Pfad der Website. Beide Pfade sind relativ: Stücke aus `a-z`, `0-9` und `-` (dahinter Endungen mit `.`), höchstens 7 Stücke und 200 Zeichen, sie beginnen mit `/`. Ein Host, ein Schema, `//`, `\`, `..`, eine Query oder ein Anker sind 400 (kein offener Redirect). Das Ziel darf `/` sein. Die alte Adresse darf nicht mit einer reservierten obersten Adresse beginnen (siehe Seite anlegen). Ohne `status` gilt 301; erlaubt sind 301 und 302.

        Das Ziel ist nie selbst eine alte Adresse, und eine alte Adresse ist nie das Ziel einer anderen Weiterleitung: Ketten und Schleifen sind 409. Die alte Adresse ist je Abteilung eindeutig. Höchstens 1000 Weiterleitungen je Abteilung.

        Die Auslieferung schreibt daraus `weiterleitungen.caddy` (ein Vorschlag, nichts wird eingebunden) und eine Rückfallseite mit `meta refresh` am alten Pfad. Wo eine Seite der Website liegt, gilt keine Weiterleitung. Audit-Log: `weiterleitung_angelegt` mit dem Status, nie mit den Pfaden.

        Statuscodes: 201 bei Erfolg. 400 bei ungültiger Eingabe. 403 ohne Recht. 409 mit `WEITERLEITUNG_SCHLEIFE`, `WEITERLEITUNG_KETTE`, `WEITERLEITUNG_ADRESSE_VERGEBEN` oder `WEITERLEITUNG_ZU_VIELE`.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedaktionWeiterleitungAnlegen"
      responses:
        "201":
          description: Weiterleitung angelegt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAngelegt"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
        "409":
          $ref: "#/components/responses/RedaktionWeiterleitung409"
  /api/v1/redaktion/weiterleitungen/{id}:
    patch:
      operationId: aendereRedaktionWeiterleitung
      summary: Weiterleitung ändern
      description: |
        Nur Abteilungsleitung und Redaktion. Ohne Schlüssel bleibt der Wert, wie er ist; mindestens ein Feld. Es gelten dieselben Regeln wie beim Anlegen, geprüft gegen den Stand ohne diese Zeile. Audit-Log: `weiterleitung_geaendert` mit den Namen der Felder.

        Reihenfolge der Prüfungen: Zugang (403), Body (400), Weiterleitung in der eigenen Abteilung (404), Recht (403), Kette und Eindeutigkeit (409).

