  /api/v1/admin/system:
    get:
      operationId: holeAdminSystem
      summary: Zustand der API und Bestand der Abteilung
      description: |
        Nur Admins (mit zweitem Faktor). Liefert Zahlen für die Übersicht der Verwaltung: Prozess (Node-Version, Laufzeit, Speicher, Verzögerung der Ereignisschleife), Datenbank (erreichbar, Antwortzeit, Verbindungen), Bestand der eigenen Abteilung, Kalender-Sync und einige Umgebungs-Flags.

        Die Antwort enthält nie Werte aus der Umgebung, Hosts, Adressen, Schlüssel oder Namen. Ist die Datenbank nicht erreichbar, antwortet die Route trotzdem mit 200 und `datenbank.erreichbar: false`.

        Statuscodes: 200 bei Erfolg. 401. 403 für Nicht-Admins (und für Admins ohne zweiten Faktor, Code `ZWEITER_FAKTOR_FEHLT`). 426.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Zustand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSystem"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/system/requests:
    get:
      operationId: holeAdminSystemRequests
      summary: Zahlen zu den Anfragen an die API
      description: |
        Nur Admins (mit zweitem Faktor). Liefert Zähler und Dauern der Anfragen seit dem Start der API (höchstens die letzten 24 Stunden, in Minuten-Eimern im Arbeitsspeicher). Nach einem Neustart ist alles leer.

        Erfasst werden nur Methode, Routenmuster (nie der konkrete Pfad), Statuscode und Dauer; keine Query, kein Body, keine Header, keine IP-Adressen und keine Personen. Die Abrufe dieser beiden System-Routen und die statischen Dateien unter `/admin` zählen nicht mit. Dauern (`p50Ms`, `p95Ms`) sind die obere Grenze der Dauerklasse, in der das Quantil liegt (Klassen bis 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000 ms); `null` ohne Anfragen. Die Zähler je Route gelten seit dem Start.

        Statuscodes: 200 bei Erfolg. 401. 403 für Nicht-Admins (und für Admins ohne zweiten Faktor, Code `ZWEITER_FAKTOR_FEHLT`). 426.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Zähler und Dauern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSystemRequests"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/system/syncs:
    get:
      operationId: holeAdminSyncs
      summary: Stand des Kalender-Abgleichs
      description: |
        Nur Admins (mit zweitem Faktor). Zeigt den Stand des Kalender-Syncs mit der Zahl der Programme der Abteilung. Die Antwort enthält nie Fehlertexte, nur feste Texte. Das Auslesen der alten Stufenwebseiten gibt es nicht mehr (#361); der Teil `eckdaten` ist entfallen.

        Statuscodes: 200 bei Erfolg. 401. 403 für Nicht-Admins (und für Admins ohne zweiten Faktor, Code `ZWEITER_FAKTOR_FEHLT`). 426.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Stand des Kalender-Abgleichs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSyncs"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/system/syncs/kalender:
    post:
      operationId: stosseAdminKalenderAn
      summary: Kalender-Sync anstossen
      description: |
        Nur Admins (mit zweitem Faktor). Gleicht die Programme mit dem Google-Kalender ab. Der Abruf läuft sofort und dieselbe Funktion wie der Takt im Hintergrund; läuft gerade ein anderer Lauf, antwortet die Route mit `gesperrt`. Pro Abteilung und Abruf höchstens einer in 30 Sekunden. Das Audit-Log hält fest, wer ihn angestossen hat.

        Statuscodes: 200 mit `ergebnis` `fertig` oder `gesperrt`. 401. 403 für Nicht-Admins. 426. 429 bei zu kurzem Abstand oder beim Limit. 501, wenn der Server keinen Abruf eingerichtet hat.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Ergebnis des Laufs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSyncErgebnis"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
        "501":
          description: Der Server hat diesen Abruf nicht eingerichtet.
  /api/v1/admin/mitteilungen:
    post:
      operationId: sendeAdminMitteilung
      summary: Mitteilung als Push senden
      description: |
        Nur Admins. Löst einen Push aus mit `typ` `mitteilung`, leerer `id` und dem Android-Kanal `mitteilungen`; der Push trägt den Titel und, wenn angegeben, die Beschreibung als Text. Beide dürfen keine Namen enthalten: Sie laufen über Apple und Google.

        Empfänger `alle`: alle aktiven Konten der Abteilung. Empfänger `stufen`: die Eltern aktiver Kinder und die Leitenden der gewählten Stufen. Voraussetzung ist in beiden Fällen ein aktives Konto mit eingeschalteter Option «Mitteilungen» (`pushProgramme`). Die absendende Person bekommt den Push auch, sofern ihre Option an ist.

        Der Versand steht im Audit-Log (`mitteilung_gesendet`, Ziel ist die Abteilung): wer, wann, Empfängergruppe (`alle` oder die Stufen-IDs) und Zahl der Empfänger, nie der Text.

        Limit: höchstens 10 Mitteilungen pro Abteilung und Stunde.

        Statuscodes: 200 mit der Zahl der Konten, an deren Geräte der Push ging (auch 0). 400 bei ungültiger Eingabe oder wenn eine Stufe unbekannt ist oder zu einer anderen Abteilung gehört. 403 für Nicht-Admins. 429 beim Limit. 503 mit Code `PUSH_NICHT_EINGERICHTET`, wenn der Server keinen Schlüssel für den Push-Dienst hat; dann geht nichts hinaus und nichts ins Audit-Log.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMitteilung"
      responses:
        "200":
          description: Gesendet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMitteilungErgebnis"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
        "503":
          description: Der Server hat keinen Schlüssel für den Push-Dienst (`PUSH_NICHT_EINGERICHTET`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
  /api/v1/admin/stufen:
    post:
      operationId: legeAdminStufeAn
      summary: Stufe anlegen
      description: |
        Nur Admins. Legt eine Stufe in der eigenen Abteilung an und in derselben Transaktion ihren Gruppenchat (`typ` `stufe`); eine Stufe hat genau einen.

        Statuscodes: 201 bei Erfolg. 400 bei ungültiger Eingabe (unbekannte Felder, fehlende Felder, Längen). 403 für Nicht-Admins. 409 mit Code `STUFENNAME_VERGEBEN`, wenn es in der Abteilung schon eine Stufe mit diesem Namen gibt (Gross-/Kleinschreibung zählt nicht).
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStufeAnlegen"
      responses:
        "201":
          description: Stufe angelegt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAngelegt"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "409":
          description: Es gibt in der Abteilung schon eine Stufe mit diesem Namen (`STUFENNAME_VERGEBEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKonflikt"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/stufen/{id}:
    patch:
      operationId: aendereAdminStufe
      summary: Stufe ändern
      description: |
        Nur Admins, nur Stufen der eigenen Abteilung. Alle Felder sind optional; ein leeres Objekt ist ein No-op und liefert 204.

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger ID oder ungültiger Eingabe. 403 für Nicht-Admins. 404, wenn die Stufe unbekannt ist oder zu einer anderen Abteilung gehört. 409 mit Code `STUFENNAME_VERGEBEN`, wenn der neue Name schon vergeben ist.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AdminStufeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStufeAendern"
      responses:
        "204":
          description: Geändert (auch bei einem No-op).
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Es gibt in der Abteilung schon eine Stufe mit diesem Namen (`STUFENNAME_VERGEBEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKonflikt"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: loescheAdminStufe
      summary: Stufe löschen
      description: |
        Nur Admins, nur Stufen der eigenen Abteilung. Löscht die Stufe samt Logo, Gruppenchat mit allen Nachrichten, Einzelchats der Stufe, Eckdaten, Erinnerungsregeln der Stufe und Zuordnungen zu Programmen; die Programme selbst bleiben. Der Vorgang steht im Audit-Log (`stufe_geloescht`).

        Eine Stufe mit zugewiesenen Kindern (auch inaktiven) oder Leitenden lässt sich nicht löschen: Sie müssen zuerst einer anderen Stufe zugewiesen oder entfernt werden.

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger ID. 403 für Nicht-Admins. 404, wenn die Stufe unbekannt ist oder zu einer anderen Abteilung gehört. 409 mit Code `STUFE_BELEGT`, wenn der Stufe noch Kinder oder Leitende zugewiesen sind.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AdminStufeId"
      responses:
        "204":
          description: Gelöscht; kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Der Stufe sind noch Kinder oder Leitende zugewiesen (`STUFE_BELEGT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKonflikt"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/stufen/{id}/stufenleitung:
    put:
      operationId: ordneAdminStufenleitung
      summary: Reihenfolge der Stufenleitung festlegen
      description: |
        Nur Admins, nur Stufen der eigenen Abteilung. `ids` nennt SL der Stufe in der Reihenfolge der Kontakte: die erste
        ist der Hauptkontakt (`prioritaet` 1), dann 2, 3 und so weiter. SL der Stufe, die nicht in `ids` stehen, verlieren
        ihren Rang und folgen danach nach Name; eine leere Liste hebt die Reihenfolge auf. Die Reihenfolge gilt für
        `GET /api/v1/programme/{id}/kontakte`, `GET /api/v1/stufen/{id}/kontakte` und die Liste `stufenleitung` der Chats.
        Der Vorgang steht im Audit-Log (`sl_reihenfolge_geaendert`, mit der Anzahl, ohne Namen).

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger ID, doppelten Einträgen, mehr als 100 Einträgen oder einer Person, die keine SL dieser Stufe ist (auch eine Leitung). 403 für Nicht-Admins. 404, wenn die Stufe unbekannt ist oder zu einer anderen Abteilung gehört.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AdminStufeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              additionalProperties: false
              properties:
                ids:
                  type: array
                  maxItems: 100
                  uniqueItems: true
                  description: IDs der SL, die erste ist der Hauptkontakt.
                  items:
                    type: string
                    format: uuid
      responses:
        "204":
          description: Gespeichert.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/stufen/{id}/logo:
    put:
      operationId: setzeAdminStufeLogo
      summary: Logo einer Stufe hochladen
      description: |
        Nur Admins, nur Stufen der eigenen Abteilung. Ein vorhandenes Logo wird ersetzt.

        **Body.** Das Bild selbst als Bytes, kein JSON und kein Multipart. Erlaubt sind JPEG, PNG und WebP; der Typ
        ergibt sich aus den ersten Bytes, nie aus Dateiendung oder `Content-Type`. Höchstens 5 MiB und höchstens
        16 Millionen Pixel.

        **Verarbeitung.** Der Server dreht das Bild nach der EXIF-Angabe, verkleinert es auf höchstens 512 × 512 Pixel
        (Seitenverhältnis und Transparenz bleiben, kleinere Bilder werden nicht vergrössert) und speichert es als
        WebP. Alle Metadaten gehen verloren; das Original wird nicht gespeichert.

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger ID. 403 für Nicht-Admins. 404, wenn die Stufe unbekannt ist
        oder zu einer anderen Abteilung gehört. 413 über 5 MiB. 415 bei Nicht-Bild (code `BILD_FORMAT`).
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AdminStufeId"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Gespeichert; kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "413":
          description: Das Bild ist grösser als 5 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "415":
          description: Kein JPEG, PNG oder WebP, kein lesbares Bild oder zu viele Pixel (code `BILD_FORMAT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: loescheAdminStufeLogo
      summary: Logo einer Stufe löschen
      description: |
        Nur Admins, nur Stufen der eigenen Abteilung. Danach gilt wieder das Cevi-Logo. Ohne eigenes Logo ebenfalls 204.

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger ID. 403 für Nicht-Admins. 404, wenn die Stufe unbekannt ist oder zu einer anderen Abteilung gehört.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AdminStufeId"
      responses:
        "204":
          description: Gelöscht; kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/medien:
    get:
      operationId: listeAdminMedien
      summary: Medien der Abteilung auflisten
      description: |
        Nur Admins. Die jüngsten 200 Medien der eigenen Abteilung, neueste zuerst; ohne Seitenwechsel.

        Statuscodes: 200, 401, 403, 426.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Die Medien.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedienListe"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
    post:
      operationId: legeAdminMediumAn
      summary: Bild hochladen
      description: |
        Nur Admins (mit zweitem Faktor). Lädt ein Bild in den Medienspeicher der eigenen Abteilung.

        **Body.** Die Datei selbst als Bytes, kein JSON und kein Multipart. Erlaubt sind JPEG, PNG und WebP; der Typ
        ergibt sich aus den ersten Bytes, nie aus Dateiendung, `Content-Type` oder Query. PDF, SVG, GIF und
        alles andere sind 415: Dateien zum Herunterladen liegen im SharePoint und werden im Baustein «Datei» nur verknüpft (#428). Ein Bild darf höchstens 10 MiB gross sein (vor dem Verkleinern) und höchstens 16 Millionen
        Pixel haben. Die Metadaten stehen in der Query; einen Dateinamen gibt es nicht.

        **Alt-Text.** Ein Bild braucht entweder `altText` (1 bis 500 Zeichen) oder `dekorativ=true`, nie beides und nie
        keines (400, code `ALT_TEXT`).

        **Verarbeitung.** Ein Bild dreht der Server nach der EXIF-Angabe, verkleinert es auf höchstens 2048 Pixel je Seite
        (Seitenverhältnis und Transparenz bleiben, kleinere Bilder werden nicht vergrössert) und speichert es als WebP ohne
        Metadaten (kein EXIF, kein Aufnahmeort). Das Original bleibt nicht erhalten.

        **Begrenzung.** Pro Person höchstens 10 Uploads in 10 Minuten (429); auch abgelehnte zählen.

        Statuscodes: 201, 400, 401, 403, 413, 415 (code `MEDIEN_FORMAT`), 426, 429, 500 (Medienspeicher nicht erreichbar;
        es bleibt weder eine Zeile noch ein Objekt zurück), 501 (ohne eingerichteten Medienspeicher).
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: sichtbarkeit
          in: query
          required: true
          description: Wer das Medium sehen darf. Vorerst nur `oeffentlich` (jeder, ohne Anmeldung) und `angemeldet` (die Abteilung); Tags gibt es für Medien noch nicht (das Modul #333 ist noch an kein Objekt angeschlossen).
          schema:
            type: string
            enum:
              - oeffentlich
              - angemeldet
        - name: altText
          in: query
          required: false
          description: Alternativtext, 1 bis 500 Zeichen nach dem Entfernen von Leerraum am Rand. Bei Bildern Pflicht, ausser bei `dekorativ=true`.
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: dekorativ
          in: query
          required: false
          description: Nur bei Bildern, ausdrückliche Markierung «dekorativ»; dann ohne `altText`.
          schema:
            type: string
            enum:
              - "true"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Gespeichert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medium"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "413":
          description: Ein Bild ist grösser als 10 MiB.
        "415":
          description: Kein JPEG, PNG oder WebP (auch kein PDF), kein lesbares Bild oder zu viele Pixel (code `MEDIEN_FORMAT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
        "500":
          description: Der Medienspeicher oder die Datenbank hat versagt; ohne Details (code `INTERNER_FEHLER`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "501":
          description: Der Server hat keinen Medienspeicher eingerichtet.
  /api/v1/admin/medien/{id}:
    delete:
      operationId: loescheAdminMedium
      summary: Medium löschen
      description: |
        Nur Admins, nur Medien der eigenen Abteilung. Löscht erst die Zeile, dann die Datei im Medienspeicher. Scheitert
        der Speicher danach, bleibt die Antwort 204: Die Datei ist nicht mehr abrufbar, und der Server meldet die Waise im Log
        (code `WAISE`). Das Audit-Log hält Hochladen und Löschen fest, ohne Inhalt.

        Steht das Medium noch im Entwurf oder in einer Version einer Seite der Abteilung (auch einer zurückgezogenen), antwortet die Route mit 409 `MEDIUM_VERWENDET` und der Zahl der Seiten in `seiten`; nichts wird gelöscht. Das verhindert tote Bilder. Das Medium ist dafür gesperrt, bis die Zählung entschieden ist.

        Statuscodes: 204, 400, 401, 403, 404 (unbekannt oder andere Abteilung), 409, 426, 501.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/MediumId"
      responses:
        "204":
          description: Gelöscht; kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Das Medium steht noch in Seiten (code `MEDIUM_VERWENDET`, `seiten` zählt sie).
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - seiten
                properties:
                  code:
                    type: string
                    enum:
                      - MEDIUM_VERWENDET
                  message:
                    type: string
                  seiten:
                    type: integer
                    minimum: 1
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "501":
          description: Der Server hat keinen Medienspeicher eingerichtet.
  /api/v1/admin/kinder:
    get:
      operationId: listeAdminKinder
      summary: Kinder der Abteilung mit Elternteilen
      description: |
        Nur Admins. Liefert alle Kinder der eigenen Abteilung (sortiert nach Nachname, Vorname) mit den IDs der verknüpften Elternteile aus derselben Abteilung. Keine Datumsfelder.

        Statuscodes: 200 bei Erfolg. 403 für Nicht-Admins (und für Admins ohne zweiten Faktor, Code `ZWEITER_FAKTOR_FEHLT`).
