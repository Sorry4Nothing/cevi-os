        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    post:
      operationId: legeLagerAnwesenheitAnfragenAn
      summary: Anfrage stellen, ein eingetragenes Feld zu ändern
      description: |
        Braucht das Recht `anwesenheit.eigene` (Standard: Lagerleitung, Leitung und Team) und die Mitgliedschaft im Lager. Die Anfrage gilt immer für die angemeldete Person. Eine Anfrage gibt es nur, wo das Team nicht direkt eintragen kann (das Feld ist mit `A` oder `F` eingetragen oder die Frist ist abgelaufen) und der Wert sich ändert; sonst 409 `KEINE_ANFRAGE_NOETIG` mit den Feldern. Je Person und Feld wartet höchstens eine Anfrage (409 `ANFRAGE_OFFEN`). Ein ganzer Tag sind höchstens 100 Felder in einem Aufruf, je Feld eine Anfrage; alles oder nichts.

        Benachrichtigung: Die Lagerleitung bekommt eine Benachrichtigung je Aufruf (Art `anwesenheit_anfrage`, Push `lager_anwesenheit`); der Push nennt nur den Lagertitel, nie Person, Feld oder Bemerkung.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 201 bei Erfolg. 400 bei ungültiger Eingabe. 401 ohne Anmeldung. 403 ohne das Recht oder ohne Mitgliedschaft (`KEIN_MITGLIED`). 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft. 409 bei abgeschlossenem Lager, `KEINE_ANFRAGE_NOETIG` oder `ANFRAGE_OFFEN`.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
