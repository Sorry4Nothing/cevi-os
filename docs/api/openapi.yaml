    put:
      operationId: setzeAdminLagerDateiHosts
      summary: Erlaubte Hosts für Datei-Links festlegen
      description: |
        Nur Admins. Legt fest, auf welchen Hosts die Links liegen dürfen, zum Beispiel `meineabteilung.sharepoint.com`: der Host selbst oder eine Subdomain davon. `null` hebt die Einschränkung auf (Vorgabe). Höchstens 20 Hosts, ohne Schema, Pfad und Port; Gross- und Kleinschreibung egal, doppelte Einträge fallen weg. Gilt für neue Links; bestehende bleiben. Audit-Log: `lager_datei_hosts_geaendert` (nur die Anzahl).

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger Eingabe. 401 ohne Anmeldung. 403 für Nicht-Admins.
