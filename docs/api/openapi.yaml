  /api/v1/stufen/{id}/anwesenheit:
    get:
      operationId: stufeAnwesenheitLesen
      summary: Anwesenheit einer Stufe lesen
      tags:
        - Stufen
      description: |
        Liefert die Übersicht für den Bildschirm «Anwesenheit»: die letzten `anzahl` begonnenen Programme der Stufe
        (Standard 5, höchstens 20) und das nächste kommende, dazu je Kind und je Leitungsperson der Stufe den Stand
        pro Programm. Der Server rechnet die Zahlen; die App rechnet nichts nach.

        **Anlässe.** `anlaesse` ist nach Beginn aufsteigend sortiert: zuerst die vergangenen, der kommende zuletzt
        (`vergangen: false`). Es zählen nur aktive Programme der Stufe mit Sichtbarkeit `leitende` oder `eltern`.
        `erfassbar` ist `true`, solange das Programm begonnen hat und der Beginn höchstens 14 Tage zurückliegt;
        nur dann nimmt `PUT` einen Stand an.

        **Personen.** `kinder` sind die aktiven Kinder der Stufe, sortiert nach `vorname`, `nachname`, `id`;
        `leitende` alle Leitenden und SL der Stufe mit aktivem Konto, sortiert nach `name`, `id`. Beide Listen
        tragen je Person zwei Reihen mit je einem Eintrag pro Anlass, in der Reihenfolge von `anlaesse`:
        `anwesenheit` (`da`, `nicht_da` oder `null` für «nicht erfasst», bei kommenden Anlässen immer `null`)
        und `zusage` (die Antwort der Eltern bzw. der Leitung: `ja`, `nein` oder `offen`). Die Zusage ändert die
        Leitung nie; sie bleibt getrennt von der Anwesenheit.

        **Zahlen.** `da` und `von` zählen je Person nur erfasste, vergangene Anlässe: «nicht erfasst» zählt weder
        als da noch als nicht da. `prozent` ist `da` von `von`, gerundet, oder `null`, wenn `von` 0 ist.
        `zahlen` fasst die Personen der Stufe zusammen. `naechster` zählt die Zusagen zum kommenden Anlass und ist
        `null`, wenn keiner ansteht.

        Die Antwort trägt `Cache-Control: no-store`.

        **Rollen.** Administratorinnen und Administratoren sowie Leitende und SL der Stufe. Eltern und Leitende
        anderer Stufen bekommen 403; unbekannte Stufen und Stufen anderer Abteilungen 404.
        Statuscodes: 200, 400, 401, 403, 404, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID der Stufe.
          schema:
            type: string
            format: uuid
        - name: anzahl
          in: query
          required: false
          description: Wie viele vergangene Anlässe die Übersicht enthält.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: Die Anwesenheit der Stufe.
          headers:
            Cache-Control:
              description: Immer `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnwesenheitUebersicht"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/stufen/{id}/anwesenheit/{programmId}/kinder/{kindId}:
    put:
      operationId: anwesenheitKindSetzen
      summary: Anwesenheit eines Kindes erfassen, ändern oder zurücknehmen
      tags:
        - Stufen
      description: |
        Hält fest, ob ein Kind bei einem Programm da war (`da: true`) oder nicht (`da: false`); ein bestehender
        Stand wird überschrieben. `da: null` nimmt den Eintrag zurück, danach gilt wieder «nicht erfasst». Der
        Server merkt sich, wer zuletzt erfasst hat. Die Zusage der Eltern bleibt unberührt.

        Das Programm muss aktiv, der Stufe zugeordnet und für Leitende sichtbar sein (`leitende` oder `eltern`),
        das Kind aktiv und in der Stufe. Erfassen lässt sich ab Beginn des Programms und bis 14 Tage danach,
        siehe `erfassbar` in `GET /api/v1/stufen/{id}/anwesenheit`.

        Reihenfolge der Prüfung: Eingabe (400); Stufe unbekannt oder aus anderer Abteilung (404); Recht (403);
        Kind nicht in der Stufe oder inaktiv sowie Programm unbekannt, nicht der Stufe zugeordnet, abgesagt oder
        nicht sichtbar (404); Zeitfenster (409).

        **Rollen.** Administratorinnen und Administratoren sowie Leitende und SL der Stufe.
        Statuscodes: 204, 400, 401, 403, 404, 409, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID der Stufe.
          schema:
            type: string
            format: uuid
