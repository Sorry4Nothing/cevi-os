    # lager-schemas: aenderungen (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
    # lager-schemas: ereignisse (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
    LagerEreignis:
      type: object
      description: Die Daten einer Nachricht des Event-Streams. Nie IDs, Namen oder Inhalte.
      required:
        - bis
      properties:
        bis:
          type: integer
          minimum: 0
          description: Folgenummer, bis zu der es Neues gibt.
        objekttypen:
          type: array
          description: Die Objekttypen, die sich geändert haben und die die Rolle lesen darf (nur bei `aenderung`).
          items:
            type: string
        grund:
          type: string
          description: Nur bei `ende`.
          enum:
            - neu-verbinden
    LagerWarteschlangeAnfrage:
      type: object
      additionalProperties: false
      required:
        - operationen
      properties:
        operationen:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
              - clientOpId
              - typ
              - nutzlast
            properties:
              clientOpId:
                type: string
                format: uuid
                description: Von der App einmal je Operation erzeugt und bei jeder Wiederholung beibehalten.
              typ:
                type: string
                minLength: 1
                maxLength: 64
                description: Name der Operation, zum Beispiel `aufgabe.aendern`.
              nutzlast:
                type: object
                description: Die Felder der Operation; unbekannte Felder lehnt die Operation ab.
                additionalProperties: true
    LagerWarteschlangeAntwort:
      type: object
      required:
        - ergebnisse
      properties:
        ergebnisse:
          type: array
          items:
            $ref: "#/components/schemas/LagerOperationsErgebnis"
    LagerOperationsErgebnis:
      type: object
      required:
        - clientOpId
        - status
      properties:
        clientOpId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ok
            - konflikt
            - abgelehnt
        ergebnis:
          type: object
          description: Nur bei `ok`, enthält IDs und Versionen der geschriebenen Zeilen, keine Inhalte.
          additionalProperties: true
        code:
          type: string
          description: Nur bei `konflikt` (`VERSION_KONFLIKT`) und `abgelehnt`.
        message:
          type: string
        aktuell:
          type: object
          description: Nur bei `konflikt`, der aktuelle Stand der Zeile in der Ansicht der Rolle.
          additionalProperties: true
        abweichend:
          type: array
          description: Nur bei `konflikt`, die Felder der Operation, die jetzt anders stehen.
          items:
            type: string
    # lager-schemas: papierkorb (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
    # lager-schemas: benachrichtigungen (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
    LagerBenachrichtigungsArt:
      type: string
      description: |
        Art einer Benachrichtigung des Lagers. Jedes Modul des Lager-Backends trägt seine Arten ein; der Push-`typ` (und damit der Android-Kanal) folgt aus der Art:
        - `aufgabe_zugeteilt`, `aufgabe_geaendert`, `frist`: `lager_aufgabe`
        - `erwaehnung`: `lager_erwaehnung`
        - `pinnwand_wichtig`: `lager_pinnwand`
        - `eingang_antwort`: `lager_eingang`
        - `diensttausch`: `lager_einteilung`
        - `anwesenheit_anfrage`: `lager_anwesenheit`
      enum:
        - aufgabe_zugeteilt
        - aufgabe_geaendert
        - erwaehnung
        - frist
        - pinnwand_wichtig
        - eingang_antwort
        - diensttausch
        - anwesenheit_anfrage
    LagerPushTyp:
      type: string
      description: |
        Wert von `data.typ` eines Lager-Pushes. `data.id` ist die ID des Objekts; die App löst Lager und Ziel mit `GET /api/v1/lager/aufloesen/{typ}/{id}` auf. Android-Kanäle: `lager_aufgaben` (`lager_aufgabe`), `lager_mitteilungen` (`lager_erwaehnung`, `lager_pinnwand`, `lager_eingang`), `lager_einteilung` (`lager_einteilung`, `lager_anwesenheit`).
      enum:
        - lager_aufgabe
        - lager_erwaehnung
        - lager_pinnwand
        - lager_eingang
        - lager_einteilung
        - lager_anwesenheit
    LagerBenachrichtigung:
      type: object
      required:
        - id
        - art
        - objektTyp
        - objektId
        - gelesen
        - erstelltAm
      properties:
        id:
          type: string
          format: uuid
        art:
          $ref: "#/components/schemas/LagerBenachrichtigungsArt"
        objektTyp:
          type: string
          description: Was die App öffnet, zum Beispiel `aufgabe`. Die Zeile trägt keinen Text und keinen Inhalt.
        objektId:
          type: string
          format: uuid
        gelesen:
          type: boolean
        erstelltAm:
          type: string
          format: date-time
    LagerBenachrichtigungenSeite:
      type: object
      required:
        - eintraege
        - naechster
      properties:
        eintraege:
          type: array
          items:
            $ref: "#/components/schemas/LagerBenachrichtigung"
        naechster:
          type:
            - string
            - "null"
          format: uuid
          description: Cursor für ältere Einträge (Query `nach`); `null` am Ende.
    LagerBenachrichtigungenUngelesen:
      type: object
      required:
        - anzahl
      properties:
        anzahl:
          type: integer
          minimum: 0
    LagerBenachrichtigungenGelesenAnfrage:
      type: object
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
          description: Nur diese Einträge. Ohne `ids` gelten alle ungelesenen Einträge der Person in diesem Lager.
    LagerAufloesung:
      type: object
      required:
        - lagerId
        - objektTyp
        - objektId
      properties:
        lagerId:
          type: string
          format: uuid
        objektTyp:
          type: string
        objektId:
          type: string
          format: uuid
    LagerBenachrichtigungEinstellungen:
      type: object
      required:
        - arten
      properties:
        arten:
          type: array
          items:
            type: object
            required:
              - art
              - aktiv
            properties:
              art:
                $ref: "#/components/schemas/LagerBenachrichtigungsArt"
              aktiv:
                type: boolean
    LagerBenachrichtigungEinstellungenAnfrage:
      type: object
      additionalProperties: false
      required:
        - arten
      properties:
        arten:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - art
              - aktiv
            properties:
              art:
                $ref: "#/components/schemas/LagerBenachrichtigungsArt"
              aktiv:
                type: boolean
    # lager-schemas: dateien (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
    LagerDatei:
      type: object
      additionalProperties: false
      description: Verknüpfung auf eine Datei im SharePoint der Abteilung. Kein Inhalt; der Server ruft den Link nie ab.
      required:
        - id
        - version
        - anzeigename
        - link
        - typ
        - groesse
        - hinzugefuegtVon
        - hinzugefuegtAm
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        anzeigename:
          type: string
        link:
          type: string
          format: uri
          description: https-Adresse am Ablageort; der Ablageort regelt, wer die Datei öffnen darf. Die App legt die Offline-Kopie an, nur wenn die Person die Option in den Einstellungen der App einschaltet.
        typ:
          type: [string, "null"]
          description: MIME-Typ, falls bekannt.
        groesse:
          type: [integer, "null"]
          description: Bytes, falls bekannt.
        hinzugefuegtVon:
          type: [string, "null"]
          format: uuid
          description: ID des Kontos, das den Eintrag hinzugefügt hat; null, wenn das Konto gelöscht ist.
        hinzugefuegtAm:
          type: string
          format: date-time
    LagerDateiAnlegen:
      type: object
      additionalProperties: false
      required:
        - anzeigename
        - link
      properties:
        anzeigename:
          type: string
          minLength: 1
