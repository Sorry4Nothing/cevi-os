        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/import/vorschau:
    post:
      operationId: vorschauAdminImport
      summary: Import prüfen, ohne etwas zu schreiben
      description: |
        Nur Admins. Prüft eine Liste von Personen aus einem Export der Cevi-Datenbank und zeigt je Zeile, was der Import täte. Schreibt nichts. Die Spalten- und Rollenzuordnung hat der Browser schon getroffen: Jede Zeile trägt ihre Art.

        Je Zeile gilt der Status `ungueltig` (leerer oder zu langer Name, ungültiger Cevi-Name), `ausgelassen` (Art `auslassen`), `vorhanden` (die Abteilung hat schon ein Kind bzw. bei Leitenden ein Konto mit gleichem Vor- und Nachnamen), `doppelt` (ab dem zweiten Vorkommen derselben Person in der Datei, getrennt für Kinder und Leitende) oder `neu`. Namen werden ohne Gross-/Kleinschreibung, Akzente und überzählige Leerzeichen verglichen. Für neue Leitende nennt `benutzername` den vorgesehenen Benutzernamen: aus Vor- und Nachname erzeugt, bei Kollision mit einem Konto oder einer früheren Zeile mit 2, 3, … versehen. Der Import vergibt für dieselbe Datei denselben Namen.

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger Eingabe (unbekannte Felder, keine oder mehr als 500 Zeilen, Name über 200 Zeichen) oder wenn die Stufe unbekannt ist oder zu einer anderen Abteilung gehört. Zeilenfehler sind kein 400, sondern der Status `ungueltig`. 403 für Nicht-Admins.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminImportAnfrage"
      responses:
        "200":
          description: Status je Zeile und Summen.
          content:
            application/json:
              schema:
