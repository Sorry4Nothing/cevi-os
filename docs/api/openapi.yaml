              schema:
                $ref: "#/components/schemas/LagerAnwesenheitAnfragen"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: |
            Das Lager ist abgeschlossen (`LAGER_GESCHLOSSEN`), ein Feld braucht keine Anfrage (`KEINE_ANFRAGE_NOETIG`) oder für ein Feld wartet schon eine (`ANFRAGE_OFFEN`); die beiden letzten nennen die `felder`. Dann ist nichts angelegt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/lager/{id}/anwesenheit/anfragen/entscheid:
    post:
      operationId: entscheideLagerAnwesenheitAnfragen
      summary: Anfragen annehmen oder ablehnen
      description: |
        Braucht das Recht `anwesenheit.bearbeiten` (Standard: nur die Lagerleitung; die Abteilungsleitung gilt als Lagerleitung). Entscheidet höchstens 50 offene Anfragen in einem Aufruf (ein ganzer Tag ist eine Anfrage je Abschnitt), alles oder nichts, mit der zuletzt gesehenen `version` je Anfrage (409 `VERSION_KONFLIKT`). Annehmen setzt das Feld der Person auf den angefragten Wert (ohne Frist und ohne Sperre); ablehnen ändert nur die Anfrage. Eine schon entschiedene Anfrage ist 409 `BEREITS_ENTSCHIEDEN`; eine unbekannte oder fremde 404.

        Benachrichtigung: Jede anfragende Person bekommt eine Benachrichtigung je Aufruf (Art `anwesenheit_entscheid`, Push `lager_anwesenheit`); der Push nennt nur den Lagertitel und nie den Entscheid.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 200 bei Erfolg, mit den entschiedenen Anfragen. 400 bei ungültiger Eingabe. 401 ohne Anmeldung. 403 ohne das Recht. 404 bei unbekanntem Lager, fremder Abteilung, ohne Mitgliedschaft oder unbekannter Anfrage. 409 bei abgeschlossenem Lager, `VERSION_KONFLIKT` oder `BEREITS_ENTSCHIEDEN`.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LagerAnwesenheitEntscheiden"
      responses:
        "200":
          description: Die entschiedenen Anfragen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerAnwesenheitAnfragen"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: |
            Das Lager ist abgeschlossen (`LAGER_GESCHLOSSEN`), eine `version` ist veraltet (`VERSION_KONFLIKT`, mit dem aktuellen Stand) oder eine Anfrage ist schon entschieden (`BEREITS_ENTSCHIEDEN`, mit den `ids`). Dann ist nichts geändert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  # lager-pfade: tagesseiten (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
  # lager-pfade: einkauf (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
  /api/v1/lager/{id}/einkauf:
    get:
      operationId: holeLagerEinkauf
      summary: Einkaufsliste des Lagers auflisten
      description: |
        Braucht das Recht `einkauf.lesen` (Standard: Lagerleitung, Leitung und Lesen; das Team nicht; die Rechte lassen sich je Lager einstellen).

        Die Artikel einzeln, sortiert nach ID (neueste zuletzt), ohne gelöschte. Wer einkauft, kommt als ID und mit dem Namen der Person (beim Lesen aufgelöst, eine Umbenennung bricht nichts). Eine Abfrage je Seite, Seitenwechsel über `nach` und `limit`. Die Filter `einkaeufer` (`ich` für die Person der Sitzung, sonst die ID eines Mitglieds) und `erledigt` verbinden sich mit UND. Gleiche Artikel zusammengezählt liefert `GET .../einkauf/zusammen`.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID oder Abfrage. 401 ohne Anmeldung. 403 ohne das Recht (Team im Standard). 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
        - name: nach
          in: query
          required: false
          description: Cursor, die Angabe `naechster` der vorigen Seite.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Höchstens so viele Einträge je Seite.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: einkaeufer
          in: query
          required: false
          description: "Nur Artikel, die diese Person einkauft: `ich` oder die ID eines Mitglieds des Lagers."
          schema:
            oneOf:
              - type: string
                enum: [ich]
              - type: string
                format: uuid
        - name: erledigt
          in: query
          required: false
          description: Nur erledigte (`true`) oder nur offene (`false`) Artikel.
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Eine Seite Artikel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerEinkaufSeite"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    post:
      operationId: legeLagerEinkaufArtikelAn
      summary: Artikel auf die Einkaufsliste setzen
      description: |
        Braucht das Recht `einkauf.bearbeiten` (Standard: Lagerleitung und Leitung; die Abteilungsleitung gilt als Lagerleitung). Schreibt über den Sync-Kern: Die Zeile bekommt Version 1, kommt in den Änderungsfeed.

        Die Warengruppe ist ein gespeichertes Feld. Ohne Angabe bestimmt der Server sie: Hat die Lagerleitung für diesen Namen schon eine Warengruppe gesetzt (Artikelstamm des Lagers), gilt sie; sonst leitet der Server sie aus dem Namen über eine Stichwortliste ab (Gross- und Kleinschreibung und Umlaute zählen nicht; kein Treffer: `diverses`). Mit Angabe gilt die Angabe, und der Artikelstamm merkt sie sich für gleiche Namen in diesem Lager. Der Name zählt in der Vorschlagsliste (`GET .../einkauf/vorschlaege`) eins hoch.

        Die Einheit wird klein gespeichert (`KG` und `kg` sind dieselbe Einheit), eine leere Einheit heisst keine Einheit. Wer einkauft, muss Mitglied dieses Lagers sein (400 `KEIN_MITGLIED`).

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 201 bei Erfolg. 400 bei ungültiger Eingabe oder `KEIN_MITGLIED`. 401 ohne Anmeldung. 403 ohne das Recht. 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft. 409 bei `LAGER_GESCHLOSSEN`.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LagerEinkaufArtikelAnlegen"
      responses:
        "201":
          description: Der neue Artikel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerEinkaufArtikel"
        "400":
          description: Ungültige Eingabe, oder die Person, die einkauft, ist kein Mitglied des Lagers (`KEIN_MITGLIED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Das Lager ist abgeschlossen (`LAGER_GESCHLOSSEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/lager/{id}/einkauf/zusammen:
    get:
      operationId: holeLagerEinkaufZusammen
      summary: Einkaufsliste zusammengezählt
      description: |
        Braucht das Recht `einkauf.lesen` (Standard: Lagerleitung, Leitung und Lesen; das Team nicht).

        Gleiche Artikel in einer Zeile, die Mengen summiert. Gleich heisst: gleicher Name (ohne Beachtung von Gross- und Kleinschreibung und Umlauten: «Käse», «KÄSE» und «Kaese» sind derselbe Artikel), gleiche Einheit, dieselbe Person, die einkauft, und derselbe Stand (offen oder erledigt). Mengen verschiedener Einheiten werden nie addiert («2 kg Reis» und «500 g Reis» sind zwei Zeilen). Artikel ohne Menge zählen in `anzahl` mit, nicht in `menge`; haben alle keine Menge, ist `menge` `null`. Name und Warengruppe nimmt der Server vom neuesten Artikel der Zeile.

        `eintraege` nennt die Artikel hinter der Zeile mit ihrer Version: Abhaken ist je Artikel ein `PATCH` mit `erledigt`. Die Zusammenfassung läuft in einer einzigen Abfrage (GROUP BY), die Seiten über `nach` (ID des ersten Artikels der letzten Zeile) und `limit`. Die Filter `einkaeufer` und `erledigt` wie bei der Liste; mit `erledigt=false` ist es die Liste für den Einkauf.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Eingabe (400).

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID oder Abfrage. 401 ohne Anmeldung. 403 ohne das Recht. 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
        - name: nach
          in: query
          required: false
          description: Cursor, die Angabe `naechster` der vorigen Seite.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
