  /api/v1/lager/{id}/einkauf/{artikelId}:
    get:
      operationId: holeLagerEinkaufArtikel
      summary: Einen Artikel der Einkaufsliste lesen
      description: |
        Braucht das Recht `einkauf.lesen` (Standard: Lagerleitung, Leitung und Lesen; das Team nicht).

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Eingabe (400).

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID. 401 ohne Anmeldung. 403 ohne das Recht. 404 bei unbekanntem Lager oder Artikel (auch einem Artikel eines anderen Lagers oder einem gelöschten), fremder Abteilung oder ohne Mitgliedschaft.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
        - name: artikelId
          in: path
          required: true
          description: ID des Artikels (UUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Der Artikel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerEinkaufArtikel"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    patch:
      operationId: aendereLagerEinkaufArtikel
      summary: Artikel ändern oder abhaken
      description: |
        Braucht das Recht `einkauf.bearbeiten` (Standard: Lagerleitung und Leitung; die Abteilungsleitung gilt als Lagerleitung). Schreibt über den Sync-Kern: Jede Änderung zählt die Version der Zeile hoch, kommt in den Änderungsfeed und braucht die zuletzt gesehene `version` (409 `VERSION_KONFLIKT` sonst, mit dem aktuellen Stand und den abweichenden Feldern).

        Abhaken beim Einkauf ist ein einzelnes Update: `{ "version": 3, "erledigt": true }`. Nur die genannten Felder ändern sich; `null` leert Menge, Einheit oder die Person, die einkauft. Ein neuer `name` ohne eigene `warengruppe` leitet die Warengruppe aus dem neuen Namen neu ab (Artikelstamm, dann Stichwortliste); mit `warengruppe` gilt die Angabe und der Artikelstamm des Lagers merkt sie sich für den Namen. Entspricht die Angabe der Vorgabe der Stichwortliste, entfällt die Zeile im Stamm.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger Eingabe oder `KEIN_MITGLIED`. 401 ohne Anmeldung. 403 ohne das Recht. 404 bei unbekanntem Lager oder Artikel, fremder Abteilung oder ohne Mitgliedschaft. 409 bei `LAGER_GESCHLOSSEN` oder `VERSION_KONFLIKT`.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
        - name: artikelId
          in: path
          required: true
          description: ID des Artikels (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LagerEinkaufArtikelAendern"
      responses:
        "200":
          description: Der geänderte Artikel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerEinkaufArtikel"
        "400":
          description: Ungültige Eingabe, oder die Person, die einkauft, ist kein Mitglied des Lagers (`KEIN_MITGLIED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: |
            Das Lager ist abgeschlossen (`LAGER_GESCHLOSSEN`) oder die `version` ist veraltet (`VERSION_KONFLIKT`, mit dem aktuellen Stand und den abweichenden Feldern).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: loescheLagerEinkaufArtikel
      summary: Artikel von der Einkaufsliste nehmen
      description: |
        Braucht das Recht `einkauf.bearbeiten` (Standard: Lagerleitung und Leitung; die Abteilungsleitung gilt als Lagerleitung). Schreibt über den Sync-Kern: Jede Änderung zählt die Version der Zeile hoch, kommt in den Änderungsfeed und braucht die zuletzt gesehene `version` (409 `VERSION_KONFLIKT` sonst).

        Weiches Löschen: Die Zeile bleibt (Papierkorb), der Feed meldet «geloescht». Die Vorschlagsliste behält den Namen.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger ID oder Abfrage. 401 ohne Anmeldung. 403 ohne das Recht. 404 bei unbekanntem Lager oder Artikel, fremder Abteilung oder ohne Mitgliedschaft. 409 bei `LAGER_GESCHLOSSEN` oder `VERSION_KONFLIKT`.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
        - name: artikelId
          in: path
          required: true
          description: ID des Artikels (UUID).
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: true
          description: Die Version, die die App zuletzt gesehen hat.
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Artikel gelöscht.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: |
            Das Lager ist abgeschlossen (`LAGER_GESCHLOSSEN`) oder die `version` ist veraltet (`VERSION_KONFLIKT`, mit dem aktuellen Stand und den abweichenden Feldern).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
