    WebsiteInhalt:
      type: object
      required:
        - titel
        - bausteine
      properties:
        titel:
          type: string
          description: Titel der Seite (nur für die Person sichtbar, die die Seite sehen darf).
        bausteine:
          type: array
          items:
            type: object
            required:
              - id
              - knoten
            properties:
              id:
                type: string
                format: uuid
                description: ID des Bausteins; bei einer öffentlichen Seite die des Platzhalters `data-geschuetzt` im HTML.
              knoten:
                $ref: "#/components/schemas/WebsiteKnoten"
    WebsiteKnoten:
      description: Ein Text (Zeichenkette) oder ein Element. Das Skript setzt Text als Textknoten und lässt nur bekannte Elemente und Attribute mit geprüften Werten zu.
      oneOf:
        - type: string
        - type: object
          required:
            - tag
          properties:
            tag:
              type: string
            attr:
              type: object
              additionalProperties:
                oneOf:
                  - type: string
                  - type: boolean
            kinder:
              type: array
              items:
                $ref: "#/components/schemas/WebsiteKnoten"
    RedaktionWeiterleitungAnlegen:
      type: object
      additionalProperties: false
      required:
        - alterPfad
        - zielPfad
      properties:
        alterPfad:
          type: string
          maxLength: 200
          pattern: "^/[a-z0-9-]+([.][a-z0-9]+)*(/[a-z0-9-]+([.][a-z0-9]+)*){0,6}$"
          description: Die alte Adresse als relativer Pfad, etwa `/alte-seite`.
        zielPfad:
