  /api/v1/lager/{id}/einkauf/vorschlaege:
    get:
      operationId: holeLagerEinkaufVorschlaege
      summary: Vorschläge für Artikel beim Tippen
      description: |
        Braucht das Recht `einkauf.lesen` (Standard: Lagerleitung, Leitung und Lesen; das Team nicht).

        Die häufigsten Artikelnamen dieses Lagers, häufigste zuerst. Mit `q` nur Namen, die so beginnen (ohne Beachtung von Gross- und Kleinschreibung und Umlauten; `%` und `_` sind gewöhnliche Zeichen). Die Häufigkeit steigt mit jedem Artikel, der angelegt wird; Ändern, Abhaken und Löschen zählen nicht. Die Schreibweise ist die zuletzt getippte. Eine Abfrage, keine Seiten (höchstens 50).

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Eingabe (400).

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID oder Abfrage. 401 ohne Anmeldung. 403 ohne das Recht. 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft.
