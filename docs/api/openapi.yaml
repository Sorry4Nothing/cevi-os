          type: [number, "null"]
          exclusiveMinimum: 0
        einheit:
          description: "Klein geschrieben; `null` ohne Einheit."
          type: [string, "null"]
          maxLength: 20
        warengruppe:
          $ref: "#/components/schemas/LagerEinkaufWarengruppe"
        einkaeuferPersonId:
          description: "Mitglied des Lagers, das einkauft; `null`, wenn es niemand ist oder die Person das Lager verlassen hat."
          type: [string, "null"]
          format: uuid
        einkaeufer:
          oneOf:
            - $ref: "#/components/schemas/LagerEinkaufPerson"
            - type: "null"
        erledigt:
          description: "Abgehakt beim Einkauf."
          type: boolean
    LagerEinkaufSeite:
      description: "Eine Seite Artikel."
      type: object
      additionalProperties: false
      required:
        - artikel
        - naechster
      properties:
        artikel:
          type: array
          items:
            $ref: "#/components/schemas/LagerEinkaufArtikel"
        naechster:
          description: "Cursor für die nächste Seite (`nach`); `null` am Ende."
          type: [string, "null"]
          format: uuid
    LagerEinkaufZusammen:
      description: "Eine zusammengezählte Zeile: gleicher Name, gleiche Einheit, dieselbe Person, die einkauft, gleicher Stand."
      type: object
      additionalProperties: false
      required:
        - name
        - menge
        - einheit
        - warengruppe
        - einkaeuferPersonId
        - einkaeufer
        - erledigt
        - anzahl
        - eintraege
      properties:
        name:
          description: "Schreibweise des neuesten Artikels der Zeile."
          type: string
        menge:
          description: "Summe der Mengen; `null`, wenn kein Artikel der Zeile eine Menge hat."
          type: [number, "null"]
        einheit:
          type: [string, "null"]
        warengruppe:
          $ref: "#/components/schemas/LagerEinkaufWarengruppe"
        einkaeuferPersonId:
          type: [string, "null"]
          format: uuid
        einkaeufer:
          oneOf:
            - $ref: "#/components/schemas/LagerEinkaufPerson"
            - type: "null"
        erledigt:
          type: boolean
        anzahl:
          description: "Wie viele Artikel in der Zeile stecken."
          type: integer
          minimum: 1
        eintraege:
          type: array
          items:
            $ref: "#/components/schemas/LagerEinkaufEintrag"
    LagerEinkaufZusammenSeite:
      description: "Eine Seite zusammengezählter Zeilen."
      type: object
      additionalProperties: false
      required:
        - artikel
        - naechster
      properties:
        artikel:
          type: array
          items:
            $ref: "#/components/schemas/LagerEinkaufZusammen"
        naechster:
          description: "Cursor für die nächste Seite (`nach`); `null` am Ende."
          type: [string, "null"]
          format: uuid
    LagerEinkaufVorschlaege:
      description: "Vorschläge für Artikelnamen, häufigste zuerst."
      type: object
      additionalProperties: false
      required:
        - vorschlaege
      properties:
        vorschlaege:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - haeufigkeit
            properties:
              name:
                type: string
              haeufigkeit:
                description: "Wie oft ein Artikel mit diesem Namen in diesem Lager angelegt wurde."
                type: integer
                minimum: 1
    LagerEinkaufArtikelAnlegen:
      description: "Neuer Artikel. Nur diese Felder; unbekannte lehnt die Route mit 400 ab."
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          description: "Wird getrimmt, Leerraum zusammengezogen."
          type: string
          minLength: 1
          maxLength: 100
        menge:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 1000000
          multipleOf: 0.001
        einheit:
          description: "Wird getrimmt und klein gespeichert; leer heisst keine Einheit."
          type: [string, "null"]
          maxLength: 20
        warengruppe:
          $ref: "#/components/schemas/LagerEinkaufWarengruppe"
        einkaeuferPersonId:
          description: "Muss Mitglied des Lagers sein (400 `KEIN_MITGLIED`)."
          type: [string, "null"]
          format: uuid
    LagerEinkaufArtikelAendern:
      description: "Änderung eines Artikels. Neben `version` mindestens ein Feld; unbekannte lehnt die Route mit 400 ab."
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          description: "Die Version, die die App zuletzt gesehen hat."
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        menge:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 1000000
          multipleOf: 0.001
        einheit:
          type: [string, "null"]
          maxLength: 20
        warengruppe:
          $ref: "#/components/schemas/LagerEinkaufWarengruppe"
        einkaeuferPersonId:
          type: [string, "null"]
          format: uuid
        erledigt:
          type: boolean
