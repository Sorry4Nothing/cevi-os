            rolle:
              $ref: "#/components/schemas/LagerRolle"
            schreibgeschuetzt:
              type: boolean
              description: Wahr bei `abgeschlossen` und `archiviert`; schreibende Anfragen antworten dann mit 409 `LAGER_GESCHLOSSEN`.
    AdminLagerAnlegen:
      type: object
