        - $ref: "#/components/parameters/MediumId"
      description: |
        Liefert die Datei eines Mediums. Der Server liest sie aus dem Medienspeicher und gibt sie selbst aus; es gibt
        keine Adresse des Speichers und keinen öffentlichen Bucket.

        **Sichtbarkeit.** Ein Medium mit Sichtbarkeit `oeffentlich` ist ohne Anmeldung abrufbar (auch ohne Sitzung, für
        gesperrte Konten und andere Abteilungen). Ein Medium mit Sichtbarkeit `angemeldet` liefert der Server nur mit
        Sitzung und nur der Abteilung des Mediums; für andere Abteilungen und unbekannte IDs ist die Antwort 404, nie 403.
        Die Sichtbarkeit nach Tags gibt es für Medien noch nicht; das Modul dafür (#333) steht bereit, ist aber noch an kein Objekt angeschlossen.

        **Kopfzeilen.** `Content-Type` ist `image/webp`; `X-Content-Type-Options: nosniff` und
        `Content-Security-Policy: sandbox; frame-ancestors 'none'` stehen immer, `Content-Disposition` ist `inline`.
        `Cache-Control` ist `public, max-age=300` für öffentliche und `private, no-store` für angemeldete Medien.
        Der Medienspeicher liefert nur Bilder: Ein altes PDF-Medium (vor #428) antwortet 404.

        **Rollen.** Öffentlich: alle. Angemeldet: alle Personen der Abteilung, ausser bei offenem Pflichtwechsel des
        Passworts (403). Statuscodes: 200, 400, 401, 403, 404, 426, 500 (Medienspeicher nicht erreichbar, ohne Details),
        501 (ohne eingerichteten Medienspeicher).
