        vorbereitungAb:
          type: string
          format: date
          description: Nicht nach `von`.
        ort:
          type: string
          minLength: 1
          maxLength: 200
        adresse:
          type: string
          minLength: 1
          maxLength: 500
        farbe:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        logoMediumId:
          type: string
          format: uuid
          description: Ein Bild aus den Medien der eigenen Abteilung.
    AdminLagerAendern:
      type: object
      additionalProperties: false
      description: Ohne Schlüssel bleibt der Wert. `null` leert `vorbereitungAb`, `ort`, `adresse`, `farbe` und `logoMediumId`.
      properties:
        titel:
          type: string
          minLength: 1
          maxLength: 200
        von:
          type: string
          format: date
        bis:
          type: string
          format: date
        vorbereitungAb:
          type:
            - string
            - "null"
          format: date
        ort:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
        adresse:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 500
        farbe:
          type:
            - string
            - "null"
          pattern: ^#[0-9a-fA-F]{6}$
        logoMediumId:
          type:
            - string
            - "null"
          format: uuid
        status:
          $ref: "#/components/schemas/LagerStatus"
    AdminLagerMitglied:
