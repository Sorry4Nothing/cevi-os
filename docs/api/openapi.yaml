        bis:
          type: string
          format: date
        vorbereitungAb:
          type:
            - string
            - "null"
          format: date
        ort:
          type:
            - string
            - "null"
        adresse:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/LagerStatus"
        farbe:
          type:
            - string
            - "null"
