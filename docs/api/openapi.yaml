          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    post:
      operationId: legeAdminKindAn
      summary: Kind anlegen
      description: |
        Nur Admins. Legt ein aktives Kind in einer Stufe der eigenen Abteilung an. Elternteile verknüpft `PATCH /api/v1/admin/kinder/{id}` oder `PATCH /api/v1/admin/personen/{id}`.

        Statuscodes: 201 bei Erfolg. 400 bei ungültiger Eingabe oder wenn die Stufe unbekannt ist oder zu einer anderen Abteilung gehört. 403 für Nicht-Admins.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminKindAnlegen"
      responses:
        "201":
          description: Kind angelegt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAngelegt"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/kinder/{id}:
    patch:
      operationId: aendereAdminKind
      summary: Kind ändern
      description: |
        Nur Admins, nur Kinder der eigenen Abteilung. Alle Felder sind optional; ein leeres Objekt ist ein No-op und liefert 204. Die App darf das ganze Formular schicken: Nur echte Änderungen von `stufeId` und `aktiv` setzen die Zeitpunkte, auf die die Chat-Sicht aufbaut. `eltern` ersetzt die bisherige Liste der Elternteile vollständig.

        Reihenfolge der Prüfungen: Pfad und Body (400), dann Kind in der eigenen Abteilung (404), dann Admin-Recht (403), dann Stufe und Elternteile (400).

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger Eingabe (u. a. mehr als 10 oder doppelte Elternteile) oder wenn Stufe oder Elternteil unbekannt sind oder zu einer anderen Abteilung gehören. 403 für Nicht-Admins. 404, wenn das Kind unbekannt ist oder zu einer anderen Abteilung gehört.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AdminKindId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminKindAendern"
      responses:
        "204":
          description: Geändert (auch bei einem No-op).
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: loescheAdminKind
      summary: Kind löschen
      description: |
        Nur Admins, nur Kinder der eigenen Abteilung. Löscht das Kind samt Verknüpfungen zu Elternteilen.

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger ID. 403 für Nicht-Admins. 404, wenn das Kind unbekannt ist oder zu einer anderen Abteilung gehört.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AdminKindId"
      responses:
        "204":
          description: Gelöscht.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
components:
  schemas:
    Fehler:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          examples:
            - NICHT_ANGEMELDET
        message:
          type: string
          examples:
            - Nicht angemeldet
    AuthAnmeldungAnfrage:
      type: object
      description: Zugangsdaten. Weitere Felder von better-auth (`rememberMe`, `callbackURL`) verwendet die App nicht.
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]+$
          description: |
            Benutzername. Erlaubt sind Buchstaben, Ziffern, Punkt, Unterstrich und Bindestrich (3 bis 64 Zeichen);
            Gross-/Kleinschreibung ist egal, gespeichert wird kleingeschrieben. Ein Wert ausserhalb der Regel
            ergibt wie jeder Fehlschlag 401.
          example: vorname.nachname
        password:
          type: string
          description: Passwort oder Startpasswort. Bei offenem Startpasswort zählen Gross-/Kleinschreibung, Bindestriche und Leerzeichen nicht.
    AuthBenutzer:
      type: object
      description: |
        Person aus better-auth. Die E-Mail-Adresse ist ein Platzhalter (`…@benutzer.invalid`) und nicht für die
        Anzeige gedacht. Weitere Felder (z. B. Bremsfelder, `createdAt`, `emailVerified`) können vorkommen;
        die App ignoriert sie. Das vollständige Profil liefert `GET /api/v1/ich`.
      required:
        - id
        - name
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Anzeigename.
        username:
          type:
            - string
            - "null"
          description: Benutzername, kleingeschrieben.
        role:
          type:
            - string
            - "null"
          description: Rolle der Person bei better-auth; `admin` für Admins.
          example: admin
        twoFactorEnabled:
          type:
            - boolean
            - "null"
          description: Ob der zweite Faktor eingerichtet und bestätigt ist.
        mussPasswortAendern:
          type: boolean
          description: |
            Ob der Pflichtwechsel des Passworts offen ist. Dann antwortet jede Route unter `/api/v1` ausser
            `GET /api/v1/ich` mit 403.
        abteilungId:
          type: string
          format: uuid
    AuthSitzung:
      type: object
      description: Sitzung. Das Sitzungstoken ist kein Bearer-Token und gehört nicht in die App-Logik.
      required:
        - id
        - userId
        - expiresAt
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: Ablauf der Sitzung (90 Tage ab der letzten Verlängerung).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuthAnmeldungErfolg:
      type: object
      description: Angemeldet. Das Session-Cookie steht im `Set-Cookie`-Header.
      required:
        - user
      additionalProperties: true
      properties:
        redirect:
          type: boolean
          description: Immer `false` (die App schickt keine `callbackURL`).
        token:
          type: string
          description: Sitzungstoken; nicht als Bearer-Token verwendbar. Massgeblich ist das Cookie.
        user:
          $ref: "#/components/schemas/AuthBenutzer"
    AuthZweiterFaktorAufforderung:
      type: object
      description: |
        Zweiter Faktor verlangt. Es gibt noch keine Sitzung; das Zwischen-Cookie `two_factor` steht im `Set-Cookie`-Header.
      required:
        - twoFactorRedirect
        - twoFactorMethods
      properties:
        twoFactorRedirect:
          type: boolean
          enum:
            - true
        twoFactorMethods:
          type: array
          description: Verfügbare Methoden; heute nur `totp` (Ersatzcodes gehen immer).
          items:
            type: string
            enum:
              - totp
    AuthSitzungAntwort:
      type: object
      required:
        - session
        - user
      properties:
        session:
          $ref: "#/components/schemas/AuthSitzung"
        user:
          $ref: "#/components/schemas/AuthBenutzer"
    AuthAbmeldenAntwort:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          enum:
            - true
    AuthAlleSitzungenBeendenAntwort:
      type: object
      required:
        - status
      properties:
        status:
          type: boolean
          enum:
            - true
    AuthPasswortAendernAnfrage:
      type: object
      required:
        - currentPassword
        - newPassword
      description: |
        Weitere Felder von better-auth (`revokeOtherSessions`) setzt der Server selbst auf `true`.
      properties:
        currentPassword:
          type: string
          maxLength: 128
          description: Aktuelles Passwort, bei offenem Pflichtwechsel das Startpasswort (Schreibweise egal).
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: Neues Passwort. Muss sich vom bisherigen unterscheiden und darf nicht aus einem bekannten Datenleck stammen.
    AuthPasswortAendernAntwort:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type:
            - string
            - "null"
          description: Token der neuen Sitzung; nicht als Bearer-Token verwendbar. Massgeblich ist das neue Cookie.
        user:
          $ref: "#/components/schemas/AuthBenutzer"
    AuthZweiterFaktorEinrichtenAnfrage:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          description: Aktuelles Passwort der Person (bei offenem Startpasswort Schreibweise egal).
        method:
          type: string
          enum:
            - totp
            - otp
          default: totp
          description: Nur `totp` ist verfügbar; `otp` ergibt 400 `OTP_NOT_CONFIGURED`.
    AuthZweiterFaktorEinrichtenAntwort:
      type: object
      required:
        - method
        - totpURI
        - backupCodes
      properties:
        method:
          type: string
          enum:
            - totp
        totpURI:
          type: string
          description: |
            `otpauth://totp/Cevi%20OS:<benutzername>?secret=<BASE32>&issuer=Cevi%20OS&digits=6&period=30`.
            Enthält das Geheimnis; als QR-Code oder Link an die Authenticator-App übergeben, nie speichern oder loggen.
          example: otpauth://totp/Cevi%20OS:vorname.nachname?secret=JBSWY3DPEHPK3PXP&issuer=Cevi%20OS&digits=6&period=30
        backupCodes:
          type: array
          minItems: 10
          maxItems: 10
          description: Zehn Ersatzcodes; nur jetzt sichtbar. Jeder gilt einmal.
          items:
            type: string
            pattern: ^[a-zA-Z0-9]{5}-[a-zA-Z0-9]{5}$
            example: abc12-xyz34
    AuthCodeAnfrage:
      type: object
      required:
        - code
      description: Das Feld `trustDevice` von better-auth ignoriert der Server.
      properties:
        code:
          type: string
          description: |
            Sechsstelliger TOTP-Code (`verify-totp`, z. B. «012345») oder Ersatzcode im Format `xxxxx-xxxxx`
            (`verify-backup-code`).
          example: "012345"
    AuthZweiterFaktorAnmeldeAntwort:
      type: object
      required:
        - token
        - user
      description: Das neue Session-Cookie steht im `Set-Cookie`-Header.
      properties:
        token:
          type: string
          description: Sitzungstoken; nicht als Bearer-Token verwendbar.
        user:
          $ref: "#/components/schemas/AuthBenutzer"
    IchRolle:
      type: object
      required:
        - stufeId
        - typ
      properties:
        stufeId:
          type: string
          format: uuid
        typ:
          type: string
          enum:
            - leitung
            - stufenleitung
          description: |
            `stufenleitung` (SL) erfüllt auch alle Rechte von `leitung` derselben Stufe. Admin ist keine Stufenrolle,
            sondern das Feld `admin`.
    IchStufe:
      type: object
      required:
        - id
        - name
        - kuerzel
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Stufe A
        kuerzel:
          type: string
          example: A
    IchKind:
      type: object
      required:
        - id
        - vorname
        - nachname
        - stufeId
      properties:
        id:
          type: string
          format: uuid
        vorname:
          type: string
        nachname:
          type: string
        stufeId:
          type: string
          format: uuid
    IchProfil:
      type: object
      required:
        - id
        - name
        - benutzername
        - mussPasswortAendern
        - datenschutzGelesenAm
        - telefon
        - bildUrl
        - pushChat
        - pushProgramme
        - admin
        - zweiterFaktor
        - rollen
        - stufen
        - kinder
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Anzeigename.
        benutzername:
          type:
            - string
            - "null"
          description: Benutzername, kleingeschrieben.
        mussPasswortAendern:
          type: boolean
          description: Pflichtwechsel des Passworts offen; die App führt dann zu `POST /api/auth/change-password`.
        datenschutzGelesenAm:
          type:
            - string
            - "null"
          format: date-time
          description: Zeitpunkt der Kenntnisnahme der Datenschutzerklärung, sonst `null`.
        telefon:
          type:
            - string
            - "null"
          description: Eigene Telefonnummer, wenn hinterlegt (nur SL setzen sie, per `PATCH /api/v1/ich`).
        bildUrl:
          type:
            - string
            - "null"
          description: Pfad zum eigenen Profilbild (`GET /api/v1/personen/{id}/bild`, mit Sitzung), `null` ohne Bild. Hochladen und Löschen geht mit `PUT` und `DELETE /api/v1/ich/bild`.
        pushChat:
          type: boolean
          description: Push-Benachrichtigungen für Chats.
        pushProgramme:
          type: boolean
          description: Push-Benachrichtigungen für Programme.
        admin:
          type: boolean
        zweiterFaktor:
          type: boolean
          description: Ob der zweite Faktor eingerichtet ist. Admins brauchen ihn für `/api/v1/admin`.
        rollen:
          type: array
          description: Stufenrollen der Person (Leitende und Stufenleitung); für Eltern und Admins ohne Stufenrolle leer.
          items:
            $ref: "#/components/schemas/IchRolle"
        stufen:
          type: array
          description: Die Stufen der Rollen und der aktiven Kinder, nach Reihenfolge, ohne Doppelte.
          items:
            $ref: "#/components/schemas/IchStufe"
        kinder:
          type: array
          description: Die aktiven Kinder der Person (nur Eltern), nach `id` sortiert.
          items:
            $ref: "#/components/schemas/IchKind"
    IchEinstellungen:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Mindestens ein Feld. Fremde Felder ergeben 400.
      properties:
        pushChat:
          type: boolean
        pushProgramme:
          type: boolean
        telefon:
          type:
            - string
            - "null"
          maxLength: 30
          description: Eigene Telefonnummer, nur für SL; leerer Text oder `null` entfernt sie.
    HilfeAntwort:
      type: object
      required:
        - vertrauenspersonen
      properties:
        vertrauenspersonen:
          type:
            - string
            - "null"
          description: |
            Freier Text der Abteilung zu den Vertrauenspersonen (Funktion, Erreichbarkeit); `null`, wenn die Admins
            nichts eingetragen haben. Die Admins speichern höchstens 2000 Zeichen.
    StufenAntwortEintrag:
      type: object
      required:
        - id
        - name
        - kuerzel
        - reihenfolge
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Stufe A
        kuerzel:
          type: string
          example: A
        reihenfolge:
          type: integer
          description: Sortierung der Stufen, aufsteigend.
    StufenAntwort:
      type: object
      required:
        - stufen
      properties:
        stufen:
          type: array
          items:
            $ref: "#/components/schemas/StufenAntwortEintrag"
    KontakteAntwort:
      type: object
      required:
        - kontakte
      properties:
        kontakte:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - bildUrl
              - telefon
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              bildUrl:
                type:
                  - string
                  - "null"
                description: Pfad zum Profilbild der SL (`GET /api/v1/personen/{id}/bild`, mit Sitzung), `null` ohne Bild. Unabhängig von `telefon`, denn das Bild sieht, wer den Namen sieht.
              telefon:
                type:
                  - string
                  - "null"
                description: Nur für Eltern mit einem aktiven Kind in der Stufe der SL, sonst `null`.
    TeilnahmenZahlen:
      type: object
      required:
        - ja
        - nein
        - offen
      properties:
        ja:
          type: integer
          minimum: 0
        nein:
          type: integer
          minimum: 0
        offen:
          type: integer
          minimum: 0
    TeilnahmenUebersicht:
      type: object
      required:
        - zahlen
        - kinder
        - leitende
      properties:
        zahlen:
          type: object
          required:
            - kinder
            - leitende
          properties:
            kinder:
              $ref: "#/components/schemas/TeilnahmenZahlen"
            leitende:
              $ref: "#/components/schemas/TeilnahmenZahlen"
        kinder:
          type: array
          items:
            type: object
            required:
              - id
              - vorname
              - nachname
              - stufeId
              - status
            properties:
              id:
                type: string
                format: uuid
              vorname:
                type: string
              nachname:
                type: string
              stufeId:
                type: string
                format: uuid
              status:
                type: string
                enum:
                  - ja
                  - nein
                  - offen
        leitende:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - stufeId
              - rolle
              - status
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              stufeId:
                type: string
                format: uuid
              rolle:
                type: string
                enum:
                  - leitung
                  - stufenleitung
              status:
                type: string
                enum:
                  - ja
                  - nein
                  - offen
    PushTokenAnfrage:
      type: object
      additionalProperties: false
      required:
        - token
        - plattform
      properties:
        token:
          type: string
          pattern: ^[\w:.-]{20,512}$
          description: FCM-Registrierungstoken des Geräts.
          example: cX1y2Z3a4B5c6D7e8F9g:APA91bxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        plattform:
          type: string
          enum:
            - ios
            - android
    ProgrammStufeRef:
      type: object
      description: Eine dem Programm zugeordnete Stufe der eigenen Abteilung.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Stufe A
    ProgrammListeneintrag:
      type: object
      description: |
        Programm, wie es Liste und Detail liefern, mit `kinder` (derselben Regel in beiden). Alle Schlüssel sind immer vorhanden. Entweder ist `ganztaegig`
        wahr, dann sind `tagVon` und `tagBis` gesetzt und `beginn` und `ende` `null`, oder `ganztaegig` ist falsch,
        dann sind `beginn` und `ende` gesetzt und `tagVon` und `tagBis` `null`.
      required:
        - id
        - titel
        - status
        - sichtbarkeit
        - ganztaegig
        - beginn
        - ende
        - tagVon
        - tagBis
        - googleOrt
        - stufen
        - googleBeschreibung
        - kinder
      properties:
        id:
          type: string
          format: uuid
        titel:
          type: string
        status:
          type: string
          enum:
            - aktiv
            - abgesagt
            - pruefen
          description: Zustand des Programms. Teilnahmen lassen sich nur bei «aktiv» und vor dem Beginn ändern.
        sichtbarkeit:
          type: string
          enum:
            - intern
            - leitende
            - eltern
          description: Wer das Programm ausser Admin und SL sieht; «intern» nur Admin und SL, «leitende» zusätzlich die Leitenden der zugeordneten Stufen, «eltern» zusätzlich deren Eltern.
        ganztaegig:
          type: boolean
        beginn:
          type:
            - string
            - "null"
          format: date-time
          description: Beginn als Zeitpunkt (UTC, ISO 8601). `null` bei ganztägigen Programmen.
        ende:
          type:
            - string
            - "null"
          format: date-time
          description: Ende als Zeitpunkt (UTC, ISO 8601). `null` bei ganztägigen Programmen.
        tagVon:
          type:
            - string
            - "null"
          format: date
          description: Erster Programmtag (Schweizer Kalendertag). `null` bei Programmen mit Uhrzeit.
        tagBis:
          type:
            - string
            - "null"
          format: date
          description: Letzter Programmtag, inklusive (Schweizer Kalendertag). `null` bei Programmen mit Uhrzeit.
        googleOrt:
          type:
            - string
            - "null"
          description: Ort aus dem Google-Kalender.
        stufen:
          type: array
          description: Zugeordnete Stufen der eigenen Abteilung, aufsteigend nach `id` sortiert. Leer, wenn keine zugeordnet ist.
          items:
            $ref: "#/components/schemas/ProgrammStufeRef"
        googleBeschreibung:
          type:
            - string
            - "null"
          description: Beschreibung aus Google; gilt als intern. Nur mit Leitungssicht gefüllt, sonst `null`.
        kinder:
          type: array
          description: Eigene aktive Kinder der Person in zugeordneten Stufen, sortiert nach Vorname, dann `id`. Leer für alle ohne eigene Kinder dort, auch für Admins und Leitende.
          items:
            $ref: "#/components/schemas/ProgrammKind"
    ProgrammListe:
      type: object
      required:
        - programme
      properties:
        programme:
          type: array
          items:
            $ref: "#/components/schemas/ProgrammListeneintrag"
    ProgrammKind:
      type: object
      description: Ein eigenes, aktives Kind der angemeldeten Person in einer dem Programm zugeordneten Stufe.
      required:
        - id
        - vorname
        - status
      properties:
        id:
          type: string
          format: uuid
        vorname:
          type: string
        status:
          type:
            - string
            - "null"
          enum:
            - ja
            - nein
            - null
          description: Gemeldete Teilnahme; `null` heisst «offen» (noch keine Antwort).
    ProgrammDetail:
      description: Listeneintrag mit Zusatzangaben für die angemeldete Person.
      allOf:
        - $ref: "#/components/schemas/ProgrammListeneintrag"
        - type: object
          required:
            - teilnahmeOffen
            - treffpunkt
            - schlussOrt
            - schlussZeit
            - mitnehmen
          properties:
            treffpunkt:
              type:
                - string
                - "null"
              description: Treffpunkt mit Zeit (mehrere Zeilen möglich, etwa «14:00 Uhr» und der Ort). Von der Webseite der Stufe, wenn deren «Cevi-Programm» auf den Tag dieses Programms fällt, sonst `null`. Die App liest nur; es gibt keinen Schreibzugriff.
            schlussOrt:
              type:
                - string
                - "null"
              description: Ort des Schlusses; `null`, wenn die Webseite keinen nennt oder nicht zum Tag passt.
            schlussZeit:
              type:
                - string
                - "null"
              pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
              description: Zeit des Schlusses als `HH:mm`; `null`, wenn die Webseite keine nennt oder nicht zum Tag passt.
            mitnehmen:
              type:
                - string
                - "null"
              description: Was die Kinder mitnehmen, eine Zeile pro Eintrag; `null`, wenn die Webseite nichts nennt oder nicht zum Tag passt.
            teilnahmeOffen:
              type: boolean
              description: Wahr, wenn das Programm «aktiv» ist und noch nicht begonnen hat; nur dann lässt sich die Teilnahme melden oder ändern.
            eigeneAnmeldung:
              type: string
              enum:
                - ja
                - nein
                - offen
              description: Eigene Anmeldung als Leitung. Der Schlüssel fehlt, wenn die Person nicht Leitung oder SL einer zugeordneten Stufe ist.
    ProgrammZuordnung:
      type: object
      required:
        - stufen
        - sichtbarkeit
      additionalProperties: false
      properties:
        stufen:
          type: array
          maxItems: 50
          uniqueItems: true
          description: Vollständiger neuer Stand der zugeordneten Stufen (nur Stufen der eigenen Abteilung, keine Doppelten). Leer ist nur mit Sichtbarkeit «intern» erlaubt.
          items:
            type: string
            format: uuid
        sichtbarkeit:
          type: string
          enum:
            - intern
            - leitende
            - eltern
    ProgrammAntwort:
      type: object
      description: Antwort «ja» oder «nein» für eine Teilnahme oder eine Leitungsanmeldung.
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ja
            - nein
    ChatTyp:
      type: string
      enum:
        - stufe
        - direkt
      description: «stufe» ist der Gruppenchat einer Stufe, «direkt» der Einzelchat eines Elternteils mit der Stufenleitung.
    ChatStufe:
      type: object
      required:
        - id
        - name
        - kuerzel
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kuerzel:
          type: string
      example:
        id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        name: Pfadi
        kuerzel: PF
    ChatPerson:
      type: object
      description: Person mit ID und Anzeigename.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ChatListeLetzteNachricht:
      type: object
      description: Vorschau der neuesten sichtbaren Nachricht in der Chatliste.
      required:
        - text
        - erstelltAm
        - eigene
        - autor
      properties:
        text:
          type: string
          maxLength: 120
          description: Text der Nachricht, auf höchstens 120 Zeichen gekürzt.
        erstelltAm:
          type: string
          format: date-time
          description: Zeitpunkt der Nachricht in UTC.
        eigene:
          type: boolean
          description: "`true`, wenn die angemeldete Person die Nachricht geschrieben hat."
        autor:
          $ref: "#/components/schemas/ChatPerson"
      example:
        text: Treffpunkt ist um 14 Uhr beim Pfadiheim.
        erstelltAm: "2026-05-02T12:30:00Z"
        eigene: false
        autor:
          id: 0190a1b2-1111-7e5f-8a9b-0c1d2e3f4a5b
          name: Beispiel Leitung
    ChatListeneintrag:
      type: object
      required:
        - id
        - typ
        - stufe
        - eltern
        - stufenleitung
        - ungelesen
        - letzteNachricht
      properties:
        id:
          type: string
          format: uuid
        letzteNachricht:
          description: Neueste für die Person sichtbare Nachricht des Chats; `null`, solange es keine gibt. Vor dem Beitritt geschriebene Nachrichten zählen nicht.
          oneOf:
            - $ref: "#/components/schemas/ChatListeLetzteNachricht"
            - type: "null"
        ungelesen:
          type: integer
          minimum: 0
          description: Anzahl ungelesener Nachrichten anderer Personen in diesem Chat.
        typ:
          $ref: "#/components/schemas/ChatTyp"
        stufe:
          $ref: "#/components/schemas/ChatStufe"
        eltern:
          description: Das Elternteil des Einzelchats; `null` im Gruppenchat.
          oneOf:
            - $ref: "#/components/schemas/ChatPerson"
            - type: "null"
        stufenleitung:
          type: array
          description: Aktive Stufenleitungen der Stufe, sortiert nach Name; sie lesen jeden Chat der Stufe mit.
          items:
            $ref: "#/components/schemas/ChatPerson"
    ChatListe:
      type: object
      required:
        - chats
      properties:
        chats:
          type: array
          items:
            $ref: "#/components/schemas/ChatListeneintrag"
      example:
        chats:
          - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
            typ: stufe
            stufe:
              id: 0190a1b2-0000-7e5f-8a9b-0c1d2e3f4a5b
              name: Pfadi
              kuerzel: PF
            eltern: null
            ungelesen: 2
            letzteNachricht:
              text: Treffpunkt ist um 14 Uhr beim Pfadiheim.
              erstelltAm: "2026-05-02T12:30:00Z"
              eigene: false
              autor:
                id: 0190a1b2-1111-7e5f-8a9b-0c1d2e3f4a5b
                name: Beispiel Leitung
            stufenleitung:
              - id: 0190a1b2-1111-7e5f-8a9b-0c1d2e3f4a5b
                name: Beispiel Leitung
    EinzelchatAnfrage:
      type: object
      additionalProperties: false
      required:
        - stufeId
      properties:
        stufeId:
          type: string
          format: uuid
          description: Stufe des Einzelchats. Gross geschriebene UUIDs werden in Kleinbuchstaben umgewandelt.
        elternUserId:
          type: string
          format: uuid
          description: Das Elternteil. Pflicht für Stufenleitungen der Stufe; Eltern lassen es weg oder nennen sich selbst.
      example:
        stufeId: 0190a1b2-0000-7e5f-8a9b-0c1d2e3f4a5b
        elternUserId: 0190a1b2-2222-7e5f-8a9b-0c1d2e3f4a5b
    ChatKennung:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: ID des Chats.
    NachrichtKennung:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: ID der neuen Nachricht.
    ChatNachrichtAnfrage:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: Nachrichtentext. Wird vor der Prüfung an den Rändern getrimmt; nach dem Trimmen 1 bis 2000 Zeichen, ohne NUL-Zeichen (U+0000).
        programmId:
          type: string
          format: uuid
          description: Optionaler Bezug auf ein Programm der eigenen Abteilung mit Sichtbarkeit «eltern», das der Stufe des Chats zugeordnet ist.
      example:
        text: Wir bringen die Zelte am Samstag mit.
    ChatProgrammBezug:
      type: object
      required:
        - id
        - titel
      properties:
        id:
          type: string
          format: uuid
        titel:
          type: string
    ChatNachricht:
      type: object
      required:
        - id
        - text
        - erstelltAm
        - autor
        - programm
        - eigene
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          description: Nachrichtentext.
        erstelltAm:
          type: string
          format: date-time
        autor:
          $ref: "#/components/schemas/ChatNachrichtAutor"
        programm:
          description: Programm, auf das sich die Nachricht bezieht. `null` ohne Bezug und wenn das Programm für Eltern der Stufe nicht mehr sichtbar ist.
          oneOf:
            - $ref: "#/components/schemas/ChatProgrammBezug"
            - type: "null"
        eigene:
          type: boolean
          description: Die angemeldete Person ist die Autorin oder der Autor.
    ChatNachrichtAutor:
      type: object
      description: Autorin oder Autor einer Nachricht.
      required:
        - id
        - name
        - bildUrl
        - stufenleitung
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        bildUrl:
          type:
            - string
            - "null"
          description: Pfad zum Profilbild der Autorin oder des Autors (`GET /api/v1/personen/{id}/bild`, mit Sitzung), `null` ohne Bild. Das Bild sieht, wer den Namen sieht.
        stufenleitung:
          type: boolean
          description: Die Person ist Stufenleitung der Stufe dieses Chats. Es gibt keine weitere Rolle und keine Angabe für Eltern (`false`).
    ChatNachrichtenSeite:
      type: object
      required:
        - nachrichten
        - naechster
      properties:
        nachrichten:
          type: array
          maxItems: 50
          description: Höchstens 50 Nachrichten, neueste zuerst.
          items:
            $ref: "#/components/schemas/ChatNachricht"
        naechster:
          type:
            - string
            - "null"
          format: uuid
          description: Cursor für `vor`, um ältere Nachrichten zu laden; `null`, wenn es keine älteren gibt.
    AdminKonflikt:
      type: object
      description: |
        Fehler mit Statuscode 409. Gleiche Form wie `Fehler`, aber mit eigenen Codes, die der Handler setzt. Texte sind deutsch und für die Anzeige gedacht.
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - BENUTZERNAME_VERGEBEN
            - LETZTER_ADMIN
            - EIGENES_KONTO
            - EIGENER_ZWEITER_FAKTOR
            - KEIN_ZWEITER_FAKTOR
        message:
          type: string
          example: Der letzte Admin lässt sich nicht entfernen.
    AdminRolle:
      type: object
      description: Stufenrolle einer Person. «stufenleitung» erfüllt auch alles, was «leitung» darf.
      required:
        - stufeId
        - typ
      additionalProperties: false
      properties:
        stufeId:
          type: string
          format: uuid
        typ:
          type: string
          enum:
            - leitung
            - stufenleitung
    AdminPerson:
      type: object
      required:
        - id
        - name
        - benutzername
        - admin
        - zweiterFaktor
        - deaktiviert
        - mussPasswortAendern
        - startpasswortGueltigBis
        - rollen
        - elternteilVon
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: «Vorname Nachname» in einem Feld.
        benutzername:
          type:
            - string
            - "null"
          description: Kleingeschrieben gespeichert.
        admin:
          type: boolean
        zweiterFaktor:
          type: boolean
          description: Ob die Person einen zweiten Faktor eingerichtet hat.
        deaktiviert:
          type: boolean
        mussPasswortAendern:
          type: boolean
          description: Ob die Person das Passwort noch ändern muss (nach Startpasswort).
        startpasswortGueltigBis:
          type:
            - string
            - "null"
          format: date-time
          description: Ende der Gültigkeit des Startpassworts; null, wenn keines gesetzt ist.
        rollen:
          type: array
          description: Stufenrollen, nach Reihenfolge der Stufe.
          items:
            $ref: "#/components/schemas/AdminRolle"
        elternteilVon:
          type: array
          description: IDs der Kinder, deren Elternteil die Person ist.
          items:
            type: string
            format: uuid
    AdminStufe:
      type: object
      description: Stufe in der Verwaltungsübersicht.
      required:
        - id
        - name
        - kuerzel
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kuerzel:
          type: string
    AdminKindKurz:
      type: object
      description: Kind in der Personenübersicht (ohne Elternteile).
      required:
        - id
        - vorname
        - nachname
        - stufeId
        - inaktivSeit
      properties:
        id:
          type: string
          format: uuid
        vorname:
          type: string
        nachname:
          type: string
        stufeId:
          type: string
          format: uuid
        inaktivSeit:
          type:
            - string
            - "null"
          format: date-time
          description: Zeitpunkt der Deaktivierung; null bei einem aktiven Kind.
    AdminPersonenListe:
      type: object
      required:
        - personen
        - stufen
        - kinder
      properties:
        personen:
          type: array
          description: Nach Name sortiert.
          items:
            $ref: "#/components/schemas/AdminPerson"
        stufen:
          type: array
          description: Nach Reihenfolge sortiert.
          items:
            $ref: "#/components/schemas/AdminStufe"
        kinder:
          type: array
          description: Nach Nachname, Vorname sortiert.
          items:
            $ref: "#/components/schemas/AdminKindKurz"
    AdminPersonAnlegen:
      type: object
      required:
        - vorname
        - nachname
        - benutzername
        - admin
        - rollen
        - elternteilVon
      additionalProperties: false
      properties:
        vorname:
          type: string
          minLength: 1
          maxLength: 100
          description: Leerraum am Rand wird entfernt, danach mindestens 1 Zeichen.
        nachname:
          type: string
          minLength: 1
          maxLength: 100
          description: Leerraum am Rand wird entfernt, danach mindestens 1 Zeichen.
        benutzername:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]+$
          description: Gross-/Kleinschreibung wird nicht unterschieden; gespeichert wird kleingeschrieben.
          example: anna.muster
        admin:
          type: boolean
        rollen:
          type: array
          maxItems: 50
          description: Höchstens eine Rolle je Stufe (`stufeId` darf nicht doppelt vorkommen). Die Stufen müssen zur eigenen Abteilung gehören.
          items:
            $ref: "#/components/schemas/AdminRolle"
        elternteilVon:
          type: array
          maxItems: 50
          uniqueItems: true
          description: IDs von Kindern der eigenen Abteilung.
          items:
            type: string
            format: uuid
    AdminPersonAngelegt:
      type: object
      required:
        - id
        - benutzername
        - startpasswort
      properties:
        id:
          type: string
          format: uuid
        benutzername:
          type: string
          description: Kleingeschrieben, wie gespeichert.
        startpasswort:
          $ref: "#/components/schemas/AdminStartpasswortWert"
    AdminStartpasswortWert:
      type: string
      description: |
        Einmaliges Startpasswort, 12 Zeichen in drei Gruppen zu je 4, getrennt durch Bindestriche. Die Zeichen stammen aus `23456789ACDEFGHJKMNPQRTUVWXY` (ohne leicht verwechselbare). Beim Anmelden zählen Bindestriche, Leerzeichen und Gross-/Kleinschreibung nicht. Gültig 7 Tage, danach Passwortwechsel Pflicht. Wird nur in der Antwort geliefert und nicht gespeichert.
      pattern: ^[2-9ACDEFGHJKMNPQRTUVWXY]{4}-[2-9ACDEFGHJKMNPQRTUVWXY]{4}-[2-9ACDEFGHJKMNPQRTUVWXY]{4}$
      example: ACDE-FGHJ-KMNP
    AdminStartpasswort:
      type: object
      required:
        - startpasswort
      properties:
        startpasswort:
          $ref: "#/components/schemas/AdminStartpasswortWert"
    AdminPersonAendern:
      type: object
      description: Alle Felder optional; ein leeres Objekt ist erlaubt (No-op).
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 201
          description: «Vorname Nachname» in einem Feld. Leerraum am Rand wird entfernt, danach mindestens 1 Zeichen.
        admin:
          type: boolean
          description: "`false` für den letzten aktiven Admin ergibt 409 `LETZTER_ADMIN`."
        rollen:
          type: array
          maxItems: 50
          description: Ersetzt alle Stufenrollen der Person. Höchstens eine Rolle je Stufe (`stufeId` darf nicht doppelt vorkommen). Die Stufen müssen zur eigenen Abteilung gehören.
          items:
            $ref: "#/components/schemas/AdminRolle"
        elternteilVon:
          type: array
          maxItems: 50
          uniqueItems: true
          description: Ersetzt die Liste der Kinder der Person. IDs von Kindern der eigenen Abteilung.
          items:
            type: string
            format: uuid
    AdminAbteilungAendern:
      type: object
      required:
        - vertrauenspersonen
      additionalProperties: false
      properties:
        vertrauenspersonen:
          type: string
          maxLength: 2000
          description: Text für die Hilfe-Seite. Leerraum am Rand wird entfernt; ein leerer Text löscht den Eintrag.
    AdminAngelegt:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
    AdminStufeAnlegen:
      type: object
      required:
        - name
        - kuerzel
        - reihenfolge
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Leerraum am Rand wird entfernt, danach mindestens 1 Zeichen.
        kuerzel:
          type: string
          minLength: 1
          maxLength: 20
          description: Leerraum am Rand wird entfernt, danach mindestens 1 Zeichen.
        reihenfolge:
          type: integer
          minimum: 1
          maximum: 999
    AdminStufeAendern:
      type: object
      description: Alle Felder optional; ein leeres Objekt ist erlaubt (No-op).
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kuerzel:
          type: string
          minLength: 1
          maxLength: 20
        reihenfolge:
          type: integer
          minimum: 1
          maximum: 999
    AdminKind:
      type: object
      required:
        - id
        - vorname
        - nachname
        - stufeId
        - aktiv
        - eltern
      properties:
        id:
          type: string
          format: uuid
        vorname:
          type: string
        nachname:
          type: string
        stufeId:
          type: string
          format: uuid
        aktiv:
          type: boolean
          description: "`false`, sobald das Kind deaktiviert ist (hat dann `inaktivSeit` gesetzt)."
        eltern:
          type: array
          description: IDs der verknüpften Elternteile, nach ID sortiert.
          items:
            type: string
            format: uuid
    AdminKinderListe:
      type: object
      required:
        - kinder
      properties:
        kinder:
          type: array
          description: Nach Nachname, Vorname sortiert.
          items:
            $ref: "#/components/schemas/AdminKind"
    AdminSystem:
      type: object
      additionalProperties: false
      required: [prozess, datenbank, bestand, kalender, umgebung]
      properties:
        prozess:
          type: object
          additionalProperties: false
          required:
            [
              node,
              gestartetAm,
              laufzeitSekunden,
              rssMb,
              heapGenutztMb,
              heapGesamtMb,
              schleifeP99Ms,
              commit,
            ]
          properties:
            node:
              type: string
              example: v24.15.0
            gestartetAm:
              type: string
              format: date-time
            laufzeitSekunden:
              type: integer
            rssMb:
              type: number
            heapGenutztMb:
              type: number
            heapGesamtMb:
              type: number
            schleifeP99Ms:
              type: [number, "null"]
              description: 99. Perzentil der Verzögerung der Ereignisschleife seit dem letzten Abruf; `null` ohne Messwerte.
            commit:
              type: [string, "null"]
              description: Commit-Hash des Builds, nur wenn die Umgebung ihn setzt (`COMMIT_SHA`, 7 bis 40 Hex-Zeichen).
        datenbank:
          type: object
          additionalProperties: false
          required: [erreichbar, pingMs, verbindungen, poolMaximum]
          properties:
            erreichbar:
              type: boolean
            pingMs:
              type: [integer, "null"]
            verbindungen:
              type: [integer, "null"]
              description: Offene Verbindungen zur Datenbank, aller Anwendungen (API, Jobs).
            poolMaximum:
              type: integer
              description: Grösse des Pools der API.
        bestand:
          type: object
          additionalProperties: false
          required: [aktivePersonen, aktiveKinder, pushTokens]
          properties:
            aktivePersonen:
              type: integer
            aktiveKinder:
              type: integer
            pushTokens:
              type: integer
        kalender:
          type: object
          additionalProperties: false
          required: [eingerichtet, letzterErfolgAm, fehler]
          properties:
            eingerichtet:
              type: boolean
            letzterErfolgAm:
              type: [string, "null"]
              format: date-time
            fehler:
              type: [string, "null"]
              description: Einer der festen Fehlertexte des Syncs.
        umgebung:
          type: object
          additionalProperties: false
          required: [https, produktion, kalenderSchluessel]
          properties:
            https:
              type: boolean
              description: "`BETTER_AUTH_URL` beginnt mit https."
            produktion:
              type: boolean
            kalenderSchluessel:
              type: boolean
              description: Eine Schlüsseldatei für Google ist konfiguriert (nur ob, nicht welche).
    AdminSystemPunkt:
      type: object
      additionalProperties: false
      required: [ab, anzahl, fehler4xx, fehler5xx]
      properties:
        ab:
          type: string
          format: date-time
          description: Beginn des Zeitraums.
        anzahl:
          type: integer
        fehler4xx:
          type: integer
        fehler5xx:
          type: integer
    AdminSystemRequests:
      type: object
      additionalProperties: false
      required:
        [
          seit,
          gesamt,
          letzteMinute,
          letzteStunde,
          statusklassen,
          quote5xx,
          quote4xx,
          p50Ms,
          p95Ms,
          stunden,
          minuten,
          routen,
          letzteFehler,
        ]
      properties:
        seit:
          type: string
          format: date-time
          description: Start der API; davor gibt es keine Zahlen.
        gesamt:
          type: integer
          description: Anfragen der letzten 24 Stunden bzw. seit dem Start.
        letzteMinute:
          type: integer
        letzteStunde:
          type: integer
        statusklassen:
          type: object
          additionalProperties: false
          required: ["1xx", "2xx", "3xx", "4xx", "5xx"]
          properties:
            "1xx":
              type: integer
            "2xx":
              type: integer
            "3xx":
              type: integer
            "4xx":
              type: integer
            "5xx":
              type: integer
        quote5xx:
          type: number
          description: Anteil der Antworten mit 5xx an allen (0 bis 1).
        quote4xx:
          type: number
        p50Ms:
          type: [integer, "null"]
        p95Ms:
          type: [integer, "null"]
        stunden:
          type: array
          description: 24 Stunden bis jetzt, ältester Zeitraum zuerst.
          items:
            $ref: "#/components/schemas/AdminSystemPunkt"
        minuten:
          type: array
          description: 60 Minuten bis jetzt, älteste zuerst.
          items:
