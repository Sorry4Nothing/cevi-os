  /api/v1/lager/{id}/anwesenheit:
    get:
      operationId: holeLagerAnwesenheit
      summary: Anwesenheits-Matrix des Lagers lesen
      description: |
        Braucht das Recht `anwesenheit.lesen_alle` (Standard: Lagerleitung, Leitung und Lesen; das Team liest über `/anwesenheit/eigene`; die Rechte lassen sich je Lager einstellen).

        Die Matrix ist Person (Leitende als Konto, Teilnehmende als `teilnehmerId`) mal Lagertag mal Tagesabschnitt mit den Werten `A` (anwesend), `F` (abwesend) und `O` (offen). Eine Zeile gibt es nur für eingetragene Felder; wer fehlt, ist offen (`O`). Eine Abfrage je Seite für alle Personen; `lagertagIds` (kommagetrennt, höchstens 40) schränkt auf Lagertage ein, `nach` und `limit` blättern (nach ID geordnet). `frist` ist die Frist, bis zu der das Team direkt einträgt, oder `null`. Die Namen löst die App über die Listen der Mitglieder und Teilnehmenden auf.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID oder Abfrage. 401 ohne Anmeldung. 403 ohne das Recht (Team im Standard). 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
        - name: lagertagIds
          in: query
          required: false
          description: Lagertage, kommagetrennt (UUIDs, höchstens 40); ohne Angabe alle.
          schema:
            type: string
        - name: nach
          in: query
          required: false
          description: Cursor, die Angabe `naechster` der vorigen Seite.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Höchstens so viele Einträge je Seite.
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
      responses:
        "200":
          description: Eine Seite der Matrix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerAnwesenheitSeite"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    put:
      operationId: setzeLagerAnwesenheit
      summary: Anwesenheit für Personen eintragen (Lagerleitung)
      description: |
        Braucht das Recht `anwesenheit.bearbeiten` (Standard: nur die Lagerleitung; die Abteilungsleitung gilt als Lagerleitung). Schreibt über den Sync-Kern: Jede Änderung zählt die Version des Feldes hoch und kommt in den Änderungsfeed.

        Sammeloperation: höchstens 100 Felder in einem Aufruf, in einer Transaktion (alles oder nichts); ein ganzer Tag ist ein Aufruf mit allen Abschnitten. Jedes Feld nennt genau eine von `personId` (Mitglied des Lagers) und `teilnehmerId`, `lagertagId`, `tagesabschnittId` und den Wert. Die Lagerleitung überschreibt jedes Feld, auch eingetragene, und ignoriert die Frist. Für ein bestehendes Feld mit anderem Wert gehört die zuletzt gesehene `version` dazu; ohne Angabe gilt das Feld als leer (409 `VERSION_KONFLIKT` mit dem aktuellen Stand, wenn es schon eingetragen ist). Der Wert, der schon dasteht, ist kein Fehler. `O` öffnet ein eingetragenes Feld wieder (das Team trägt dann wieder direkt ein); auf ein leeres Feld schreibt `O` nichts. Lagertag, Tagesabschnitt und Teilnehmende werden erst mit den Tabellen dazu (Zeitplan, Teilnehmende) gegen das Lager geprüft.

        Datenbanklast: Je Aufruf eine Abfrage für die Mitgliedschaft und eine für die bestehenden Felder, dazu je geändertes Feld die Schreibvorgänge des Sync-Kerns.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 200 bei Erfolg, mit den geschriebenen Feldern. 400 bei ungültiger Eingabe oder `KEIN_MITGLIED` (eine Person ist kein Mitglied des Lagers). 401 ohne Anmeldung. 403 ohne das Recht. 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft. 409 bei abgeschlossenem Lager oder `VERSION_KONFLIKT`.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LagerAnwesenheitLeitungSetzen"
      responses:
        "200":
          description: Die geschriebenen Felder. Felder mit `O` ohne bestehende Zeile fehlen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerAnwesenheitEintraege"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: |
            Das Lager ist abgeschlossen (`LAGER_GESCHLOSSEN`) oder die `version` eines Feldes ist veraltet (`VERSION_KONFLIKT`, mit dem aktuellen Stand und den abweichenden Feldern); dann ist nichts geschrieben.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/lager/{id}/anwesenheit/eigene:
    get:
      operationId: holeLagerAnwesenheitEigene
      summary: Eigene Anwesenheit und eigene Anfragen lesen
      description: |
        Braucht das Recht `anwesenheit.eigene` (Standard: Lagerleitung, Leitung und Team). Liefert nur die Felder und Anfragen der angemeldeten Person und die Frist, bis zu der das Team direkt einträgt. Zwei gebündelte Abfragen: die eigenen Felder (höchstens Tage mal Abschnitte) und die letzten 200 Anfragen, neueste zuerst. `lagertagIds` schränkt die Felder auf Lagertage ein.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID oder Abfrage. 401 ohne Anmeldung. 403 ohne das Recht (Rolle Lesen im Standard). 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
        - name: lagertagIds
          in: query
          required: false
          description: Lagertage, kommagetrennt (UUIDs, höchstens 40); ohne Angabe alle.
          schema:
            type: string
      responses:
        "200":
          description: Eigene Felder, eigene Anfragen und Frist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerAnwesenheitEigene"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    put:
      operationId: setzeLagerAnwesenheitEigene
      summary: Eigene offene Felder eintragen
      description: |
        Braucht das Recht `anwesenheit.eigene` (Standard: Lagerleitung, Leitung und Team) und die Mitgliedschaft im Lager (die Abteilungsleitung ohne Mitgliedschaft trägt über `PUT /anwesenheit` ein). Der Weg nimmt keine Person entgegen: Geschrieben wird immer für die angemeldete Person, ein fremdes Feld ist nicht möglich. Es gibt keinen Weg, einen Eintrag zu löschen.

        Sammeloperation: höchstens 100 Felder in einem Aufruf, alles oder nichts; ein ganzer Tag ist ein Aufruf mit allen Abschnitten. Nur offene Felder (keine Zeile oder `O`) werden gesetzt, und nur bis zur Frist. Ist ein Feld mit einem anderen Wert eingetragen (`A` oder `F`) oder die Frist abgelaufen, schreibt der Aufruf nichts und antwortet 409 `ANFRAGE_NOETIG` mit den gesperrten Feldern und dem Grund (`eingetragen` oder `frist`); die App stellt dafür eine Anfrage (`POST /anwesenheit/anfragen`). Der Wert, der schon dasteht, und `O` auf ein offenes Feld sind kein Fehler und schreiben nichts (die Wiederholung aus der Warteschlange bleibt folgenlos).

        Datenbanklast: Eine Abfrage für die bestehenden Felder, dazu je geschriebenes Feld die Schreibvorgänge des Sync-Kerns.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 200 bei Erfolg, mit den eigenen Feldern. 400 bei ungültiger Eingabe (auch bei `personId` oder `version`). 401 ohne Anmeldung. 403 ohne das Recht oder ohne Mitgliedschaft (`KEIN_MITGLIED`). 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft. 409 bei abgeschlossenem Lager oder `ANFRAGE_NOETIG`.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LagerAnwesenheitEigeneSetzen"
      responses:
        "200":
          description: Die eigenen Felder, die jetzt eingetragen sind (nicht die mit `O` ohne Zeile).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerAnwesenheitEintraege"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: |
            Das Lager ist abgeschlossen (`LAGER_GESCHLOSSEN`) oder mindestens ein Feld braucht eine Anfrage (`ANFRAGE_NOETIG`, mit `gesperrt`); dann ist nichts geschrieben.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerAnwesenheitAnfrageNoetig"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/lager/{id}/anwesenheit/zusammenfassung:
    get:
      operationId: holeLagerAnwesenheitZusammenfassung
      summary: Zusammenfassung der Anwesenheit
      description: |
        Braucht das Recht `anwesenheit.lesen_alle` (Standard: Lagerleitung, Leitung und Lesen). Zählt je Lagertag, Tagesabschnitt und Wert (`A`, `F`, `O`), wie viele Leitende und wie viele Teilnehmende eingetragen sind. Eine Abfrage, unabhängig von der Zahl der Personen. «Offen» ergibt sich aus der Zahl der Anwesenden des Lagers minus `A` und `F`. Die Aufteilung nach Stufe folgt, sobald die Teilnehmenden mit ihrer Stufe im Lager stehen.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID. 401 ohne Anmeldung. 403 ohne das Recht (Team im Standard). 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
      responses:
