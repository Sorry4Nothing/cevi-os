      additionalProperties: false
      properties:
        stufeId:
          type:
            - string
            - "null"
          format: uuid
        wochentag:
          type: integer
          minimum: 1
          maximum: 7
        uhrzeit:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        text:
          type: string
          minLength: 1
          maxLength: 150
        beschreibung:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 300
          description: "`null` entfernt die Beschreibung."
        aktiv:
          type: boolean
    AdminZeitregel:
