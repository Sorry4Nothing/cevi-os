      required:
        - leitung
        - team
        - lesen
      properties:
        leitung:
          type: boolean
        team:
          type: boolean
        lesen:
          type: boolean
    LagerRechteAenderung:
      type: object
      additionalProperties: false
      required:
        - rechte
      properties:
        rechte:
          type: array
          minItems: 1
