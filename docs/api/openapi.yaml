openapi: 3.1.0
info:
  title: Cevi OS API
  version: 1.0.0
  description: Schnittstelle des Backends für die nativen Apps (Android, iOS). Sie beschreibt, was der Code in apps/api tatsächlich liefert; test/openapi.test.ts vergleicht Pfade und Methoden mit den Routen der App.
servers:
  - url: https://api.example.org
    description: Platzhalter; die echte Adresse steht in der Konfiguration der App
security:
  - sitzung: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Gesundheitsprüfung
      tags:
        - Allgemein
      security: []
      description: |
        Öffentlich, ohne Anmeldung, ausserhalb der Versionsprüfung (kein `X-App-Version` nötig).
        Antwortet «ok» (200), wenn die Datenbank erreichbar ist und der Kalender-Abgleich jeder
        Abteilung mit Google-Kalender nicht älter als 30 Minuten ist. Sonst «fehler» mit 503
        (Datenbank nicht erreichbar oder Abgleich veraltet). Für Überwachung, nicht für die App.
      responses:
        "200":
          description: Alles in Ordnung.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - ok
        "503":
          description: Datenbank nicht erreichbar oder Kalender-Abgleich älter als 30 Minuten.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - fehler
  /datenschutz:
    get:
      operationId: getDatenschutzSeite
      summary: Datenschutzerklärung als HTML-Seite
      tags:
        - Allgemein
      security: []
      description: |
        Öffentliche Seite für die App-Stores, ohne Anmeldung und ausserhalb der Versionsprüfung.
        Alle Personen (auch deaktivierte und nicht angemeldete) erhalten 200.
        Die Seite nennt die Datenkategorien, Empfänger, Fristen und Rechte; die verantwortliche Stelle
        und ihre E-Mail-Adresse setzt der Server aus `VERANTWORTLICHE_STELLE` und `KONTAKT_EMAIL` ein.
      responses:
        "200":
          description: HTML-Seite (`text/html; charset=UTF-8`).
          content:
            text/html:
              schema:
                type: string
  /konto-loeschen:
    get:
      operationId: getKontoLoeschenSeite
      summary: Hinweis zum Löschen des Kontos als HTML-Seite
      tags:
        - Allgemein
      security: []
      description: |
        Öffentliche Seite für die App-Stores, ohne Anmeldung und ausserhalb der Versionsprüfung.
        Die Person löscht ihr Konto nicht selbst; die App bietet keine Löschung an und die API hat keine Route dafür.
        Die Seite nennt den Weg über die Leitung: Auf Anfrage löscht die Leitung Daten, die Anfrage geht an die
        E-Mail-Adresse der Abteilung (`KONTAKT_EMAIL`). Die Leitung löscht das Konto in der Verwaltung
        (`DELETE /api/v1/admin/personen/{id}`).
      responses:
        "200":
          description: HTML-Seite (`text/html; charset=UTF-8`).
          content:
            text/html:
              schema:
                type: string
  /support:
    get:
      operationId: getSupportSeite
      summary: Support-Seite als HTML-Seite
      tags:
        - Allgemein
      security: []
      description: |
        Öffentliche Seite für die App-Stores, ohne Anmeldung und ausserhalb der Versionsprüfung.
        Nennt die Kontaktadresse der Abteilung (`KONTAKT_EMAIL`) und wer bei was hilft.
      responses:
        "200":
          description: HTML-Seite (`text/html; charset=UTF-8`).
          content:
            text/html:
              schema:
                type: string
  /admin:
    get:
      operationId: getAdminSeite
      summary: Verwaltung im Browser als HTML-Seite
      tags:
        - Allgemein
      security: []
      description: |
        Statische Hülle der Web-Verwaltung, ohne Anmeldung und ausserhalb der Versionsprüfung. Sie enthält keine Daten:
        Die Seite meldet sich über `/api/auth/*` an und ruft danach `/api/v1/admin/*` auf, mit dem Session-Cookie
        und dem zweiten Faktor wie in der App. Alle Personen (auch nicht angemeldete) erhalten 200.

        Die Antwort trägt eine strenge `Content-Security-Policy` (`script-src 'self'`, `style-src 'self'`,
        `frame-ancestors 'none'`), `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`,
        `X-Frame-Options: DENY` und `Cache-Control: no-store`. Skripte und Stilvorlage liegen unter
        `/admin/<Datei>` und tragen dieselben Kopfzeilen (mit `Cache-Control: no-cache`).
      responses:
        "200":
          description: HTML-Seite (`text/html; charset=UTF-8`).
          content:
            text/html:
              schema:
                type: string
  /admin/abteilung.js:
    get:
      operationId: getAdminAbteilungSkript
      summary: Skript der Verwaltung – Bereich Abteilung
      tags:
        - Allgemein
      security: []
      description: Statische Datei der Verwaltung (siehe `GET /admin`), ohne Anmeldung.
      responses:
        "200":
          description: Datei (`text/javascript; charset=UTF-8`).
          content:
            text/javascript:
              schema:
                type: string
  /admin/admin.css:
    get:
      operationId: getAdminStilvorlage
      summary: Stilvorlage der Verwaltung
      tags:
        - Allgemein
      security: []
      description: Statische Datei der Verwaltung (siehe `GET /admin`), ohne Anmeldung.
      responses:
        "200":
          description: Datei (`text/css; charset=UTF-8`).
          content:
            text/css:
              schema:
                type: string
  /admin/admin.js:
    get:
      operationId: getAdminSkript
      summary: Hauptskript der Verwaltung (Anmeldung und Navigation)
      tags:
        - Allgemein
      security: []
      description: Statische Datei der Verwaltung (siehe `GET /admin`), ohne Anmeldung.
      responses:
        "200":
          description: Datei (`text/javascript; charset=UTF-8`).
          content:
            text/javascript:
              schema:
                type: string
  /admin/api.js:
    get:
      operationId: getAdminApiSkript
      summary: Skript der Verwaltung – Aufrufe gegen die API
      tags:
        - Allgemein
      security: []
      description: Statische Datei der Verwaltung (siehe `GET /admin`), ohne Anmeldung.
      responses:
        "200":
          description: Datei (`text/javascript; charset=UTF-8`).
          content:
            text/javascript:
              schema:
                type: string
  /admin/dom.js:
    get:
      operationId: getAdminDomSkript
      summary: Skript der Verwaltung – Bausteine der Oberfläche
      tags:
        - Allgemein
      security: []
      description: Statische Datei der Verwaltung (siehe `GET /admin`), ohne Anmeldung.
      responses:
        "200":
          description: Datei (`text/javascript; charset=UTF-8`).
          content:
            text/javascript:
              schema:
                type: string
  /admin/kinder.js:
    get:
      operationId: getAdminKinderSkript
      summary: Skript der Verwaltung – Bereich Kinder
      tags:
        - Allgemein
      security: []
      description: Statische Datei der Verwaltung (siehe `GET /admin`), ohne Anmeldung.
      responses:
        "200":
          description: Datei (`text/javascript; charset=UTF-8`).
          content:
            text/javascript:
              schema:
                type: string
  /admin/personen.js:
    get:
      operationId: getAdminPersonenSkript
      summary: Skript der Verwaltung – Bereich Personen
      tags:
        - Allgemein
      security: []
      description: Statische Datei der Verwaltung (siehe `GET /admin`), ohne Anmeldung.
      responses:
        "200":
          description: Datei (`text/javascript; charset=UTF-8`).
          content:
            text/javascript:
              schema:
                type: string
  /admin/stufen.js:
    get:
      operationId: getAdminStufenSkript
      summary: Skript der Verwaltung – Bereich Stufen
      tags:
        - Allgemein
      security: []
      description: Statische Datei der Verwaltung (siehe `GET /admin`), ohne Anmeldung.
      responses:
        "200":
          description: Datei (`text/javascript; charset=UTF-8`).
          content:
            text/javascript:
              schema:
                type: string
  /admin/system.js:
    get:
      operationId: getAdminSystemSkript
      summary: Skript der Verwaltung – Bereich System
      tags:
        - Allgemein
      security: []
      description: Statische Datei der Verwaltung (siehe `GET /admin`), ohne Anmeldung.
      responses:
        "200":
          description: Datei (`text/javascript; charset=UTF-8`).
          content:
            text/javascript:
              schema:
                type: string
  /admin/uebersicht.js:
    get:
      operationId: getAdminUebersichtSkript
      summary: Skript der Verwaltung – Bereich Übersicht
      tags:
        - Allgemein
      security: []
      description: Statische Datei der Verwaltung (siehe `GET /admin`), ohne Anmeldung.
      responses:
        "200":
          description: Datei (`text/javascript; charset=UTF-8`).
          content:
            text/javascript:
              schema:
                type: string
  /.well-known/apple-app-site-association:
    get:
      operationId: getAppleAppSiteAssociation
      summary: Apple App Site Association (noch leer)
      tags:
        - Allgemein
      security: []
      description: |
        Öffentlich, ohne Anmeldung und ausserhalb der Versionsprüfung. Antwortet heute mit einem
        leeren JSON-Objekt `{}`; der Inhalt wird erst später ergänzt.
      responses:
        "200":
          description: Leeres JSON-Objekt.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                maxProperties: 0
                example: {}
  /.well-known/assetlinks.json:
    get:
      operationId: getAssetlinks
      summary: Android Digital Asset Links (noch leer)
      tags:
        - Allgemein
      security: []
      description: |
        Öffentlich, ohne Anmeldung und ausserhalb der Versionsprüfung. Antwortet heute mit einer
        leeren JSON-Liste `[]`; der Inhalt wird erst später ergänzt.
      responses:
        "200":
          description: Leere JSON-Liste.
          content:
            application/json:
              schema:
                type: array
                maxItems: 0
                items: {}
                example: []
  /api/auth/sign-in/username:
    post:
      operationId: anmeldenMitBenutzername
      summary: Mit Benutzername und Passwort anmelden
      tags:
        - Authentifizierung
      security: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Öffentlich. Einziger Weg zur Anmeldung (E-Mail-Anmeldung und Registrierung gibt es nicht).

        **Sitzung.** Bei Erfolg setzt die Antwort ein Session-Cookie (siehe Sicherheitsschema `sitzung`).
        Das Cookie ist 90 Tage gültig (`Max-Age=7776000`). Alle weiteren Aufrufe tragen es als `Cookie`-Header.

        **Zweiter Faktor.** Hat die Person den zweiten Faktor eingerichtet (heute nur Admins), setzt die
        Antwort noch *keine* Sitzung. Sie gibt `twoFactorRedirect: true` zurück und setzt ein Zwischen-Cookie
        (`two_factor`). Die App schickt es mit dem Code an `POST /api/auth/two-factor/verify-totp` oder
        `POST /api/auth/two-factor/verify-backup-code`; erst dann entsteht die Sitzung.

        **Startpasswort.** Hat die Person noch ein Startpasswort (`mussPasswortAendern` in
        `GET /api/auth/get-session` und `GET /api/v1/ich`), zählen bei der Eingabe Gross-/Kleinschreibung,
        Bindestriche und Leerzeichen nicht. Ist das Startpasswort abgelaufen (7 Tage), ist keine Anmeldung möglich.
        Solange der Pflichtwechsel offen ist, antwortet jede Route unter `/api/v1` ausser `GET /api/v1/ich`
        mit 403; die App führt zu `POST /api/auth/change-password`.

        **Fehler.** Jeder Fehlschlag mit Status 4xx (ausser 429) antwortet mit demselben 401 und demselben Text
        `ANMELDUNG_FEHLGESCHLAGEN`: falsches Passwort, unbekannter Name, Wartezeit, abgelaufenes Startpasswort,
        deaktiviertes Konto, ungültiger Name, ungültige Herkunft, fehlerhafter Body. Es wird kein Cookie gesetzt.
        Die App kann die Fälle nicht unterscheiden.

        **Bremse.** Ab dem 5. Fehlversuch in Folge gilt pro Benutzername eine Wartezeit: 1 Minute, dann 5, dann
        15 Minuten, ohne Dauersperre. Während der Wartezeit antwortet die Route auch bei richtigem Passwort mit 401.
        Zusätzlich gilt ein Limit von 30 Anfragen je 15 Minuten und Client-IP (429 `ZU_VIELE_ANFRAGEN`, Header
        `X-Retry-After` in Sekunden).

        **Rollen.** Alle Personen mit Konto; deaktivierte Konten und unbekannte Namen bekommen 401.
        Statuscodes: 200, 401, 426, 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthAnmeldungAnfrage"
      responses:
        "200":
          description: |
            Angemeldet (mit `Set-Cookie`) oder zweiter Faktor verlangt (ohne Sitzungs-Cookie).
          headers:
            Set-Cookie:
              description: Session-Cookie bei `AuthAnmeldungErfolg`, Zwischen-Cookie `two_factor` bei `AuthZweiterFaktorAufforderung`.
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthAnmeldungErfolg"
                  - $ref: "#/components/schemas/AuthZweiterFaktorAufforderung"
        "401":
          description: Anmeldung fehlgeschlagen (jeder Grund, immer derselbe Text), ohne Cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
              example:
                code: ANMELDUNG_FEHLGESCHLAGEN
                message: Anmeldung nicht möglich. Bitte Benutzername und Passwort prüfen oder später nochmals versuchen. Sonst hilft ein Admin.
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/sign-out:
    post:
      operationId: abmelden
      summary: Abmelden (aktuelle Sitzung beenden)
      tags:
        - Authentifizierung
      security:
        - {}
        - sitzung: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Beendet die Sitzung des mitgeschickten Cookies und löscht es (`Set-Cookie` mit `Max-Age=0`).
        Antwortet auch ohne oder mit abgelaufener Sitzung mit 200. Der Body darf leer sein oder `{}`.

        Wer offline ist, kann die Sitzung lokal verwerfen; die Server-Sitzung endet dann mit ihrem Ablauf.

        **Rollen.** Alle, auch ohne Sitzung. Statuscodes: 200, 426, 429.
        Ohne vertraute Herkunft (siehe Parameter `Origin`) antwortet die Route bei mitgeschicktem Cookie mit 403
        (`INVALID_ORIGIN` oder `MISSING_OR_NULL_ORIGIN`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Sitzung beendet (oder keine vorhanden).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAbmeldenAntwort"
        "403":
          description: Herkunft nicht vertraut oder fehlt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/get-session:
    get:
      operationId: sitzungAbfragen
      summary: Aktuelle Sitzung und Person lesen
      tags:
        - Authentifizierung
      security:
        - {}
        - sitzung: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      description: |
        Gibt die Sitzung und die angemeldete Person zurück, oder `null` ohne gültige Sitzung (dann 200, nicht 401).
        Die Antwort trägt `Cache-Control: no-store`.

        Hier erfährt die App, ob der Pflichtwechsel des Passworts offen ist (`user.mussPasswortAendern`)
        und ob der zweite Faktor eingerichtet ist (`user.twoFactorEnabled`). Das vollständige Profil mit Rollen,
        Stufen und Kindern liefert `GET /api/v1/ich`.

        **Verlängerung.** Diese Route verlängert die Sitzung um 90 Tage, sobald seit der letzten Verlängerung
        mehr als 1 Tag vergangen ist, und schickt dann ein neues `Set-Cookie`. Das Cookie ersetzt das alte.
        Die Routen unter `/api/v1` verlängern nicht.

        **Rollen.** Alle, auch ohne Sitzung. Statuscodes: 200, 426, 429.
      responses:
        "200":
          description: Sitzung mit Person, oder `null`.
          headers:
            Set-Cookie:
              description: Nur bei einer fälligen Verlängerung oder einer ungültigen Sitzung (dann wird das Cookie gelöscht).
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - type: "null"
                  - $ref: "#/components/schemas/AuthSitzungAntwort"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/change-password:
    post:
      operationId: passwortAendern
      summary: Eigenes Passwort ändern
      tags:
        - Authentifizierung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Ändert das Passwort der angemeldeten Person. Dient auch dem Pflichtwechsel nach einem Startpasswort.

        Der Server beendet dabei immer alle anderen Sitzungen der Person (die Anfrage wird so behandelt, als stünde
        `revokeOtherSessions: true` darin) und stellt für das aufrufende Gerät eine neue Sitzung aus: Die Antwort
        trägt ein neues `Set-Cookie`, das das alte ersetzt. Nach Erfolg ist der Pflichtwechsel erledigt
        (`mussPasswortAendern` wird `false`).

        Bei offenem Pflichtwechsel zählen in `currentPassword` (und beim Vergleich mit `newPassword`) Gross-/Kleinschreibung,
        Bindestriche und Leerzeichen des Startpassworts nicht.

        **Grenzen.** `newPassword`: mindestens 12, höchstens 128 Zeichen, keine Zeichenregeln. Das neue Passwort darf
        nicht aus einem bekannten Datenleck stammen (HaveIBeenPwned) und muss sich vom bisherigen unterscheiden.
        Limit: 5 Anfragen je 15 Minuten und Client-IP (429).

        **Rollen.** Alle angemeldeten Personen, auch bei offenem Pflichtwechsel. Statuscodes: 200, 400, 401, 426, 429.
        Bekannte Fehlercodes bei 400: `PASSWORD_TOO_SHORT`, `PASSWORD_TOO_LONG`, `INVALID_PASSWORD` (aktuelles Passwort
        falsch), `PASSWORT_UNVERAENDERT`, `PASSWORD_COMPROMISED`. Der Fehlerkörper ist `{code, message}`; `message`
        von better-auth-Codes (englische Grossbuchstaben) ist englisch und nicht zur Anzeige gedacht.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswortAendernAnfrage"
      responses:
        "200":
          description: Passwort geändert; neues Session-Cookie im `Set-Cookie`.
          headers:
            Set-Cookie:
              description: Neues Session-Cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPasswortAendernAntwort"
        "400":
          description: |
            Eingabe abgelehnt. Codes: `PASSWORD_TOO_SHORT`, `PASSWORD_TOO_LONG`, `INVALID_PASSWORD`,
            `PASSWORT_UNVERAENDERT`, `PASSWORD_COMPROMISED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
              example:
                code: PASSWORT_UNVERAENDERT
                message: Das neue Passwort muss sich vom bisherigen unterscheiden.
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/revoke-sessions:
    post:
      operationId: alleSitzungenBeenden
      summary: Überall abmelden (alle Sitzungen beenden)
      tags:
        - Authentifizierung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Beendet alle Sitzungen der angemeldeten Person, auch die aufrufende. Danach antwortet jede Route mit 401;
        die App verwirft ihr Cookie. Sitzungen anderer Personen bleiben unberührt. Der Body darf leer sein oder `{}`.

        **Rollen.** Alle angemeldeten Personen. Statuscodes: 200, 401 (ohne Sitzung oder deaktiviert), 426, 429.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Alle Sitzungen beendet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAlleSitzungenBeendenAntwort"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/two-factor/enable:
    post:
      operationId: zweitenFaktorEinrichten
      summary: Zweiten Faktor (TOTP) einrichten
      tags:
        - Authentifizierung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Erster von zwei Schritten: Erzeugt das Geheimnis und die Ersatzcodes. Der zweite Faktor ist erst nach
        `POST /api/auth/two-factor/verify-totp` mit dem ersten Code aktiv (`twoFactorEnabled` wird erst dann `true`).
        Ein Aufruf allein schaltet nichts ein und entsperrt die Admin-Routen nicht.

        Nur Admins richten den zweiten Faktor ein. Für alle anderen Personen (auch ohne Sitzung) antwortet der Pfad
        mit 404 `NICHT_GEFUNDEN`, als gäbe es ihn nicht. Admins brauchen den Faktor für alle Routen unter
        `/api/v1/admin`; ohne ihn antworten diese mit 403 `ZWEITER_FAKTOR_FEHLT`.

        Der Link `totpURI` (`otpauth://`) trägt «Cevi OS» als Aussteller und den Benutzernamen als Kontonamen,
        6 Stellen und 30 Sekunden. Er enthält das Geheimnis und wird nur einmal gezeigt. Die zehn Ersatzcodes
        haben das Format `xxxxx-xxxxx` (je 5 Zeichen `a-z`, `A-Z`, `0-9`) und gelten je einmal.

        Bei bereits aktivem Faktor antwortet die Route mit 400 `TOTP_ALREADY_ENABLED`, mit `method: otp` mit
        400 `OTP_NOT_CONFIGURED`. Ein falsches Passwort ergibt 400 `INVALID_PASSWORD`. Bei offenem Startpasswort zählen
        Gross-/Kleinschreibung, Bindestriche und Leerzeichen nicht.

        Wird der Faktor mit dem ersten Code bestätigt, beendet der Server alle anderen Sitzungen der Person
        und stellt ein neues Session-Cookie aus.

        **Rollen.** Nur Admins (auch ohne bisherigen zweiten Faktor). Statuscodes: 200, 400, 404 (kein Admin oder
        keine Sitzung), 426, 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthZweiterFaktorEinrichtenAnfrage"
      responses:
        "200":
          description: Geheimnis und Ersatzcodes erzeugt, noch nicht bestätigt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthZweiterFaktorEinrichtenAntwort"
        "400":
          description: |
            Codes: `INVALID_PASSWORD`, `TOTP_ALREADY_ENABLED`, `OTP_NOT_CONFIGURED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/two-factor/verify-totp:
    post:
      operationId: totpBestaetigen
      summary: TOTP-Code prüfen (Anmeldung oder Einrichtung)
      tags:
        - Authentifizierung
      security:
        - zweiterFaktorZwischenschritt: []
        - sitzung: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Zwei Verwendungen:

        1. **Anmeldung.** Nach `POST /api/auth/sign-in/username` mit `twoFactorRedirect: true` schickt die App das
           Zwischen-Cookie `two_factor` und den Code. Bei einem richtigen Code entsteht die Sitzung (`Set-Cookie`),
           das Zwischen-Cookie wird gelöscht. Pro Zwischen-Cookie sind 5 Versuche erlaubt, danach 400
           `TOO_MANY_ATTEMPTS_REQUEST_NEW_CODE` und die App meldet sich neu an. Wiederholte Fehlversuche sperren
           das Konto vorübergehend (429).
        2. **Einrichtung.** In einer laufenden Sitzung nach `POST /api/auth/two-factor/enable` bestätigt der erste
           richtige Code den Faktor. Der Server beendet alle anderen Sitzungen der Person und stellt ein neues
           Session-Cookie aus, das das alte ersetzt. In dieser Verwendung zählt der Server keine Fehlversuche.

        «Gerät vertrauen» (`trustDevice`) gibt es nicht: Der Server ignoriert das Feld, jede Anmeldung auf einem
        neuen Gerät fragt nach dem Code.

        Limit: 5 Anfragen je 15 Minuten und Client-IP (429).

        **Rollen.** Alle mit Zwischen-Cookie oder Sitzung; im Betrieb Admins. Statuscodes: 200, 400, 401, 426, 429.
        Bekannte Fehlercodes: 401 `INVALID_CODE` (falscher Code), 401 `INVALID_TWO_FACTOR_COOKIE` (weder Sitzung noch
        gültiges Zwischen-Cookie), 400 `TOTP_NOT_ENABLED` (kein Faktor eingerichtet),
        400 `TOO_MANY_ATTEMPTS_REQUEST_NEW_CODE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCodeAnfrage"
      responses:
        "200":
          description: Code richtig.
          headers:
            Set-Cookie:
              description: Neues Session-Cookie (bei Anmeldung und Einrichtung); das Zwischen-Cookie wird gelöscht.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthZweiterFaktorAnmeldeAntwort"
        "400":
          description: |
            Codes: `TOTP_NOT_ENABLED`, `TOO_MANY_ATTEMPTS_REQUEST_NEW_CODE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "401":
          description: |
            Codes: `INVALID_CODE`, `INVALID_TWO_FACTOR_COOKIE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/two-factor/verify-backup-code:
    post:
      operationId: ersatzcodeVerwenden
      summary: Ersatzcode prüfen (Anmeldung ohne Authenticator)
      tags:
        - Authentifizierung
      security:
        - zweiterFaktorZwischenschritt: []
        - sitzung: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Wie `POST /api/auth/two-factor/verify-totp` in der Anmeldung, aber mit einem der zehn Ersatzcodes
        (Format `xxxxx-xxxxx`). Jeder Ersatzcode gilt einmal; derselbe nochmals ergibt 401 `INVALID_BACKUP_CODE`.
        Bei Erfolg entsteht die Sitzung (`Set-Cookie`). `trustDevice` ignoriert der Server.
        Limit: 5 Anfragen je 15 Minuten und Client-IP (429).

        **Rollen.** Alle mit Zwischen-Cookie oder Sitzung; im Betrieb Admins. Statuscodes: 200, 400, 401, 426, 429.
        Bekannte Fehlercodes: 401 `INVALID_BACKUP_CODE`, 401 `INVALID_TWO_FACTOR_COOKIE`,
        400 `BACKUP_CODES_NOT_ENABLED`, 400 `TOO_MANY_ATTEMPTS_REQUEST_NEW_CODE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCodeAnfrage"
      responses:
        "200":
          description: Ersatzcode richtig, Sitzung ausgestellt.
          headers:
            Set-Cookie:
              description: Neues Session-Cookie; das Zwischen-Cookie wird gelöscht.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthZweiterFaktorAnmeldeAntwort"
        "400":
          description: |
            Codes: `BACKUP_CODES_NOT_ENABLED`, `TOO_MANY_ATTEMPTS_REQUEST_NEW_CODE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "401":
          description: |
            Codes: `INVALID_BACKUP_CODE`, `INVALID_TWO_FACTOR_COOKIE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/ich:
    get:
      operationId: ichLesen
      summary: Eigenes Profil mit Rollen, Stufen und Kindern lesen
      tags:
        - Profil
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      description: |
        Das Profil der angemeldeten Person: Anzeigename, Benutzername, Schalter, Admin-Kennzeichen,
        Stand des zweiten Faktors, Stufenrollen, die zugehörigen Stufen und die aktiven Kinder (nur Eltern haben welche).
        Nie enthalten sind E-Mail, Bremsfelder, Sperrstatus, Ablauf des Startpassworts sowie Geheimnisse
        und Codes des zweiten Faktors.

        `stufen` enthält die Stufen der Rollen und der aktiven Kinder (ohne Doppelte), nach Reihenfolge.
        Inaktive Kinder und Kinder anderer Abteilungen fehlen.

        **Einzige Route unter `/api/v1`, die bei offenem Pflichtwechsel des Passworts (`mussPasswortAendern: true`)
        erreichbar bleibt.** Alle anderen antworten dann mit 403.

        **Rollen.** Alle angemeldeten Personen (Eltern, Leitende, Stufenleitung, Admins), auch ohne zweiten Faktor.
        Statuscodes: 200, 401 (ohne Sitzung, deaktiviert, Konto gelöscht), 426.
      responses:
        "200":
          description: Das eigene Profil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IchProfil"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
    patch:
      operationId: ichAendern
      summary: Eigene Push-Schalter und Telefonnummer ändern
      tags:
        - Profil
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      description: |
        Ändert nur die eigenen Schalter «Push für Chats» und «Push für Programme» und die eigene Telefonnummer; die
        Person kommt immer aus der Sitzung. Mindestens ein Feld muss im Body stehen. Der Body ist strikt: Jedes
        andere Feld (auch `abteilungId`) ergibt 400, ebenso ein leerer Body oder ein Schalter, der kein Boolean ist.

        **Push-Schalter.** `pushChat` (Pushes für neue Chat-Nachrichten) und `pushProgramme` (Pushes bei verschobenen, geänderten oder abgesagten Programmen) sind je ein Boolean und standardmässig an. Die API wertet sie bei jedem Versand aus; das Push-Token bleibt dabei bestehen. Ein Push trägt als Daten `typ` (`chat` oder `programm`) und `id` (Chat- oder Programm-ID), woraus die App das Ziel öffnet.

        **Telefonnummer.** Freiwillig, nur für SL. `telefon` ist ein Text mit Ziffern und den Zeichen
        `+ ( ) / . -` sowie Leerzeichen (6 bis 30 Zeichen, nach dem Trimmen); sonst 400. Ein leerer Text oder `null`
        entfernt die Nummer. Eine Nummer speichern darf nur, wer SL einer Stufe ist (sonst 403); entfernen darf sie
        jede Person, auch eine, die die Rolle verloren hat. Die Nummer sehen danach nur Eltern mit einem aktiven Kind
        in der Stufe der SL, siehe `GET /api/v1/programme/{id}/kontakte` und `GET /api/v1/stufen/{id}/kontakte`; die
        App weist vor dem Speichern darauf hin.

        **Rollen.** Alle angemeldeten Personen ausser bei offenem Pflichtwechsel des Passworts (403); die Nummer nur
        SL. Statuscodes: 204, 400, 401, 403, 426.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IchEinstellungen"
      responses:
        "204":
          description: Gespeichert; kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/ich/bild:
    put:
      operationId: ichBildSetzen
      summary: Eigenes Profilbild hochladen
      tags:
        - Profil
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      description: |
        Setzt das Profilbild der angemeldeten Person; ein vorhandenes Bild wird ersetzt. Jede Person lädt nur ihr
        eigenes hoch. Kinder haben kein Konto und nie ein Bild.

        **Body.** Das Bild selbst als Bytes, kein JSON und kein Multipart. Erlaubt sind JPEG, PNG und WebP; der Typ
        ergibt sich aus den ersten Bytes der Datei, nie aus Dateiendung oder `Content-Type`. Höchstens 5 MiB
        (5 242 880 Bytes) und höchstens 50 Millionen Pixel; grössere Bilder verkleinert die App vor dem Senden.
        Wählt die App vorher einen quadratischen Ausschnitt, schneidet der Server nicht noch einmal die Mitte zu.

        **Verarbeitung.** Der Server liest das Bild, dreht es nach der EXIF-Angabe, schneidet es quadratisch aus der
        Mitte zu, skaliert es auf 256 × 256 Pixel und speichert es als JPEG. Dabei gehen alle Metadaten verloren
        (EXIF, Aufnahmeort, Farbprofil); das Original wird nicht gespeichert. Transparenz wird weiss.

        **Begrenzung.** Höchstens 10 Uploads je Person in 10 Minuten, fehlgeschlagene eingeschlossen; der Zähler liegt
        im Arbeitsspeicher des Servers.

        Danach liefert `GET /api/v1/ich` unter `bildUrl` den neuen Pfad.

        **Barrierefreiheit.** Das Bild trägt keinen Text. Die App zeigt es als Zierde neben dem Namen (leerer
        Alternativtext) und nennt in der Bedienung nur den Namen; ein Bild darf nie allein die Information tragen.

        **Rollen.** Alle angemeldeten Personen ausser bei offenem Pflichtwechsel des Passworts (403).
        Statuscodes: 204, 401, 403, 413, 415, 426, 429.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Gespeichert; kein Body.
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "413":
          description: Das Bild ist grösser als 5 MiB (code `ZU_GROSS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "415":
          description: Kein JPEG, PNG oder WebP, kein lesbares Bild oder zu viele Pixel (code `BILD_FORMAT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: ichBildLoeschen
      summary: Eigenes Profilbild löschen
      tags:
        - Profil
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      description: |
        Löscht das Profilbild der angemeldeten Person, jederzeit. Ohne Bild ebenfalls 204. Mit dem Konto verschwindet
        das Bild von selbst, auch wenn ein Admin die Person löscht. Deaktiviert ein Admin die Person
        (`POST /api/v1/admin/personen/{id}/deaktivieren`), löscht der Server das Bild ebenfalls; Aktivieren bringt es nicht
        zurück, die Person lädt dann ein neues hoch.

        **Rollen.** Alle angemeldeten Personen ausser bei offenem Pflichtwechsel des Passworts (403).
        Statuscodes: 204, 401, 403, 426.
      responses:
        "204":
          description: Gelöscht oder nie vorhanden; kein Body.
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/personen/{id}/bild:
    get:
      operationId: personBildLesen
      summary: Profilbild einer Person lesen
      tags:
        - Profil
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID der Person (`autor.id` einer Nachricht, `id` eines Kontakts oder die eigene).
          schema:
            type: string
            format: uuid
      description: |
        Liefert das Profilbild als JPEG, 256 × 256 Pixel. Die Adresse steht als `bildUrl` bei `autor` einer Nachricht,
        bei den Kontakten und in `GET /api/v1/ich`; die App ruft sie mit der Sitzung auf und baut sie nicht selbst.
        Das Bild ist nie öffentlich: ohne Sitzung 401.

        **Cache.** Die Antwort trägt `Cache-Control: private, no-store` (auch die Ablehnung) und
        `X-Content-Type-Options: nosniff`. Das Bild gehört nicht in einen Zwischenspeicher auf der Platte; die App
        hält es höchstens im Arbeitsspeicher der laufenden Ansicht. Der Wert `v` in `bildUrl` ändert sich mit
        jedem neuen Bild, ändert aber nichts an der Antwort.

        **Rollen.** Wer eine Person mit Namen sieht, sieht auch ihr Bild, sonst niemand: die Person selbst, wer eine
        Nachricht von ihr im Chat sieht, die SL im Einzelchat mit einem Elternteil, die Kontakte einer Stufe (Admins,
        Leitende und SL der Stufe sowie Eltern mit aktivem Kind darin sehen die SL) und die Kontakte eines Programms
        (die SL mit Status «ja», für alle, die das Programm sehen). Für alle anderen, für Personen ohne Bild, für
        unbekannte Personen und für andere Abteilungen ist die Antwort 404, ohne Unterschied.
        Statuscodes: 200, 400, 401, 403, 404, 426.
      responses:
        "200":
          description: Das Bild.
          headers:
            Cache-Control:
              description: Immer `private, no-store`.
              schema:
                type: string
                const: private, no-store
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/ich/datenschutz:
    post:
