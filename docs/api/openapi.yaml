      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/RedaktionSeiteId"
      responses:
        "204":
          description: Zurückgezogen.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Die Seite ist nicht veröffentlicht (code `NICHT_VEROEFFENTLICHT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/redaktion/seiten/{id}/versionen:
    get:
      operationId: listeRedaktionVersionen
      summary: Versionen einer Seite
      description: |
        Die jüngsten 100 Versionen, neueste zuerst, ohne Inhalt (den liefert `versionen/{nr}`). Keine Seitenwechsel: Ältere Versionen sind über ihre Nummer erreichbar.

        Statuscodes: 200, 400, 403, 404.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/RedaktionSeiteId"
      responses:
        "200":
          description: Versionen, neueste zuerst.
          content:
            application/json:
              schema:
                type: object
                required:
                  - versionen
                properties:
                  versionen:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/RedaktionVersion"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/redaktion/seiten/{id}/versionen/{nr}:
    get:
      operationId: leseRedaktionVersion
      summary: Eine Version mit ihrem Dokument
      description: |
        Eine veröffentlichte Version mit ihrem Dokument. Versionen sind unveränderlich: Es gibt keine Route, die eine ändert oder löscht (der API-Rolle der Datenbank ist `UPDATE` entzogen). `nr` ist eine ganze Zahl ab 1.

        Statuscodes: 200, 400 (ungültige Nummer), 403, 404 (Seite oder Version unbekannt).
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/RedaktionSeiteId"
        - $ref: "#/components/parameters/RedaktionVersionNr"
      responses:
        "200":
          description: Die Version.
          content:
            application/json:
              schema:
                allOf:
