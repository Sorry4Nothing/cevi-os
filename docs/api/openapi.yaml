        Nur Admins. Setzt einzelne Rechte von Leitung, Team und Lesen. Nur Rechte des Katalogs und nur diese drei Rollen sind zulässig (400 sonst, auch für `lagerleitung`); jedes Paar aus Rolle und Recht höchstens einmal; nicht genannte Rechte bleiben. Die Änderung gilt ab der nächsten Anfrage, nur in diesem Lager. Jeder Wert, der sich ändert, steht im Audit-Log (`lager_recht_geaendert`: Rolle, Recht, Wert, nie Inhalte). Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Admin-Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`).

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger Eingabe. 401 ohne Anmeldung. 403 für Nicht-Admins. 404, wenn das Lager unbekannt ist, zu einer anderen Abteilung gehört oder (Lager-Route) die Person kein Mitglied ist. 409 bei `LAGER_GESCHLOSSEN`.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LagerRechteAenderung"
      responses:
        "204":
          description: Rechte gespeichert.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/LagerKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/lager/{id}/rechte/zuruecksetzen:
    post:
      operationId: setzeZurueckAdminLagerRechte
      summary: Rechte auf den Standard zurücksetzen
      description: |
        Nur Admins. Setzt die Rechte von Leitung, Team und Lesen auf die Standardwerte des Katalogs zurück. Die Lagerleitung hat nie Einstellungen. Jeder Wert, der sich dadurch ändert, steht im Audit-Log (`lager_recht_geaendert`: Rolle, Recht, Wert, nie Inhalte). Die Änderung gilt ab der nächsten Anfrage. Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Admin-Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`).

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger ID. 401 ohne Anmeldung. 403 für Nicht-Admins. 404, wenn das Lager unbekannt ist, zu einer anderen Abteilung gehört oder (Lager-Route) die Person kein Mitglied ist. 409 bei `LAGER_GESCHLOSSEN`.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Rechte zurückgesetzt.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/LagerKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/lager/{id}/benachrichtigungen:
    get:
      operationId: listeLagerBenachrichtigungen
      summary: Meine Benachrichtigungen in einem Lager
      description: |
        Liefert die eigenen Benachrichtigungen der Person in diesem Lager, neueste zuerst (die Glocke). Andere Personen sehen nie fremde Einträge. Jede Rolle liest ihre eigenen; ein eigenes Recht gibt es nicht. Die Zeile trägt Art, Ziel (`objektTyp`, `objektId`) und den Lesestatus, keinen Text: Das Ziel liest die App über die Route des Moduls, die ihre Rechte prüft.

        Seiten: `limit` (1 bis 100, Standard 50) und `nach` (die `naechster`-ID der vorigen Seite). Wer die Art abgeschaltet hat (`PUT /api/v1/ich/lager-benachrichtigungen`), bekommt weder Eintrag noch Push; gelesene Einträge löscht der Server nach 90 Tagen.

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID, ungültigem `nach` oder `limit`. 401 ohne Anmeldung. 404, wenn das Lager unbekannt ist, zu einer anderen Abteilung gehört oder die Person kein Mitglied ist.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
        - name: nach
          in: query
          required: false
          description: Cursor, die `naechster`-ID der vorigen Seite.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Eine Seite der Benachrichtigungen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerBenachrichtigungenSeite"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/lager/{id}/benachrichtigungen/ungelesen:
    get:
      operationId: zaehleLagerBenachrichtigungenUngelesen
      summary: Ungelesene Benachrichtigungen zählen
      description: |
        Zählt die ungelesenen eigenen Benachrichtigungen der Person in diesem Lager (für das Zeichen an der Glocke).

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID. 401 ohne Anmeldung. 404, wenn das Lager unbekannt ist, zu einer anderen Abteilung gehört oder die Person kein Mitglied ist.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Die Anzahl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerBenachrichtigungenUngelesen"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/lager/{id}/benachrichtigungen/gelesen:
    post:
      operationId: markiereLagerBenachrichtigungenGelesen
      summary: Benachrichtigungen als gelesen markieren
      description: |
        Markiert eigene ungelesene Benachrichtigungen dieses Lagers als gelesen: die genannten `ids`, ohne `ids` alle. Fremde und unbekannte IDs ändern nichts (kein Fehler). Die Route gilt auch in einem abgeschlossenen Lager, weil sie keine Lagerdaten ändert. Der Body ist strikt: `{}` oder `{ "ids": [...] }` mit höchstens 100 IDs.

        Statuscodes: 204 bei Erfolg, ohne Body. 400 bei ungültiger ID oder ungültigem Body. 401 ohne Anmeldung. 404, wenn das Lager unbekannt ist, zu einer anderen Abteilung gehört oder die Person kein Mitglied ist.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LagerBenachrichtigungenGelesenAnfrage"
      responses:
        "204":
          description: Markiert; kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/lager/aufloesen/{typ}/{id}:
    get:
      operationId: loeseLagerPushZielAuf
      summary: Ziel eines Lager-Pushes auflösen
      description: |
        Löst den Deep Link eines Lager-Pushes auf. Der Push trägt als Daten nur `typ` (ein Wert von `LagerPushTyp`) und `id` (die ID des Objekts, etwa einer Aufgabe), nie eine Lager-ID. Die App fragt hier, in welchem Lager das Objekt liegt, und öffnet es dann über die Route des Moduls (die ihre Rechte selbst prüft).

        Die Antwort gibt es nur, wenn die Person für dieses Objekt benachrichtigt wurde und noch Mitglied des Lagers ist. In jedem anderen Fall, auch bei unbekannter ID, fremdem Lager, fremder Abteilung oder entferntem Mitglied, antwortet der Server gleich mit 404 und verrät weder das Objekt noch das Lager.

        Statuscodes: 200 bei Erfolg. 400 bei ungültigem `typ` oder ungültiger ID. 401 ohne Anmeldung. 404 wie beschrieben.
      tags:
        - Lager
        - Push
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: typ
          in: path
          required: true
          description: Der `typ` aus den Daten des Pushes.
          schema:
            $ref: "#/components/schemas/LagerPushTyp"
        - name: id
          in: path
          required: true
          description: Die `id` aus den Daten des Pushes (ID des Objekts, UUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lager und Ziel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerAufloesung"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/ich/lager-benachrichtigungen:
    get:
      operationId: holeLagerBenachrichtigungEinstellungen
      summary: Meine Schalter für Lager-Benachrichtigungen
      description: |
        Liefert je Art, ob die Person sie bekommt. Standard ist an; die Liste nennt immer alle Arten. Die Schalter gelten für alle Lager der Person und für Liste und Push zugleich. Eine abgeschaltete Art erzeugt weder Eintrag noch Push. Die Person ändert nur ihre eigenen Schalter.

        Statuscodes: 200 bei Erfolg. 401 ohne Anmeldung.
      tags:
        - Lager
        - Push
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Die Schalter aller Arten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerBenachrichtigungEinstellungen"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    put:
      operationId: setzeLagerBenachrichtigungEinstellungen
      summary: Schalter für Lager-Benachrichtigungen setzen
      description: |
        Setzt die genannten Arten; die übrigen bleiben unverändert. Der Body ist strikt: Jede Art höchstens einmal, nur bekannte Arten, nur `art` und `aktiv`.

        Statuscodes: 204 bei Erfolg, ohne Body. 400 bei ungültigem Body. 401 ohne Anmeldung.
      tags:
        - Lager
        - Push
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LagerBenachrichtigungEinstellungenAnfrage"
      responses:
        "204":
          description: Gesetzt; kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/redaktion/ich:
    get:
      operationId: leseRedaktionIch
      summary: Zugang zur Redaktion und sichtbare Bereiche
      description: |
        Nur lesen, nie eine Rechteausweitung: Das Panel fragt, welche Bereiche es der Person zeigt. Antwortet jeder Person mit Sitzung, auch ohne Zugang (`redigieren: false`, keine Bereiche). Die Routen selbst prüfen jedes Recht neu.

        Statuscodes: 200. 403 für Admins ohne zweiten Faktor (`ZWEITER_FAKTOR_FEHLT`) und bei offenem Pflichtwechsel des Passworts.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Zugang und Bereiche.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedaktionIch"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/redaktion/medien:
    get:
      operationId: listeRedaktionMedien
      summary: Medien der Abteilung auflisten
      description: |
        Für Abteilungsleitung, Stufenleitung und Personen mit einem Recht auf Seiten (dasselbe wie `/api/v1/redaktion/seiten`). Die Medien einer Abteilung sind eine gemeinsame Bibliothek: Die jüngsten 200 Medien der eigenen Abteilung, neueste zuerst; ohne Seitenwechsel. Gleiche Antwort wie `/api/v1/admin/medien`.

        Statuscodes: 200, 401, 403, 426.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Die Medien.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedienListe"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
    post:
      operationId: legeRedaktionMediumAn
      summary: Bild hochladen
      description: |
        Für Abteilungsleitung, Stufenleitung und Personen mit einem Recht auf Seiten. Derselbe Handler wie `POST /api/v1/admin/medien` (gleiche Regeln für Typ, Grösse, Alt-Text, Verarbeitung und Begrenzung: 10 Uploads in 10 Minuten je Person, gezählt über beide Routen); nur der Zugang ist ein anderer. Die Prüfung des Zugangs kommt vor der Prüfung der Eingabe.

        Statuscodes: 201, 400 (code `ALT_TEXT` bei fehlendem Alt-Text), 401, 403, 413, 415 (code `MEDIEN_FORMAT`), 426, 429, 500, 501 (ohne eingerichteten Medienspeicher).
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: sichtbarkeit
          in: query
          required: true
          description: Wer das Medium sehen darf, `oeffentlich` (jeder, ohne Anmeldung) oder `angemeldet` (die Abteilung).
          schema:
            type: string
            enum:
              - oeffentlich
              - angemeldet
        - name: altText
          in: query
          required: false
          description: Alternativtext, 1 bis 500 Zeichen nach dem Entfernen von Leerraum am Rand. Bei Bildern Pflicht, ausser bei `dekorativ=true`.
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: dekorativ
          in: query
          required: false
          description: Nur bei Bildern, ausdrückliche Markierung «dekorativ»; dann ohne `altText`.
          schema:
            type: string
            enum:
              - "true"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Gespeichert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medium"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "413":
          description: Ein Bild ist grösser als 10 MiB.
        "415":
          description: Kein JPEG, PNG oder WebP (auch kein PDF), kein lesbares Bild oder zu viele Pixel (code `MEDIEN_FORMAT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
        "500":
          description: Der Medienspeicher oder die Datenbank hat versagt; ohne Details (code `INTERNER_FEHLER`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "501":
          description: Der Server hat keinen Medienspeicher eingerichtet.
  /api/v1/redaktion/medien/{id}:
    patch:
      operationId: aendereRedaktionMedium
      summary: Alt-Text nachtragen oder ändern
      description: |
        Setzt einen Alt-Text (`altText`) oder markiert ein Bild als dekorativ (`dekorativ: true`), genau eines von beiden; so lässt sich eine fehlende Beschreibung nachtragen. Die Sichtbarkeit und die Datei ändern sich nie.

        Wer darf: die Person, die das Medium hochgeladen hat, sowie die Abteilungsleitung und die Redaktion (Recht auf alle Seiten). Eine Stufenleitung beschreibt also nur ihre eigenen Uploads.

        Reihenfolge der Prüfungen: Pfad und Body (400), Medium in der eigenen Abteilung (404, auch für Medien anderer Abteilungen), Zugang und Recht am Medium (403). Das Audit-Log hält `medium_beschrieben` fest, ohne den Text.

        Statuscodes: 200, 400, 401, 403, 404, 426.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/MediumId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediumAendern"
      responses:
        "200":
          description: Das Medium mit dem neuen Alt-Text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medium"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
    delete:
      operationId: loescheRedaktionMedium
      summary: Medium löschen
      description: |
        Nur Abteilungsleitung und Redaktion (Recht auf alle Seiten); eine Stufenleitung hat Zugang, darf aber nicht löschen (403). Derselbe Handler wie `DELETE /api/v1/admin/medien/{id}`: erst die Zeile, dann die Datei im Medienspeicher.

        Reihenfolge der Prüfungen: Pfad (400), Medium in der eigenen Abteilung (404), Recht (403).

        Steht das Medium noch im Entwurf oder in einer Version einer Seite der Abteilung (auch einer zurückgezogenen), antwortet die Route mit 409 `MEDIUM_VERWENDET` und der Zahl der Seiten in `seiten`; nichts wird gelöscht (wie beim Admin-Weg).

        Statuscodes: 204, 400, 401, 403, 404, 409, 426, 501.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/MediumId"
      responses:
        "204":
          description: Gelöscht; kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Das Medium steht noch in Seiten (code `MEDIUM_VERWENDET`, `seiten` zählt sie).
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - seiten
                properties:
                  code:
                    type: string
                    enum:
                      - MEDIUM_VERWENDET
                  message:
                    type: string
                  seiten:
                    type: integer
                    minimum: 1
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "501":
          description: Der Server hat keinen Medienspeicher eingerichtet.
  /api/v1/redaktion/tags:
    get:
      operationId: listeRedaktionTags
      summary: Tags der Abteilung für die Auswahl im Editor
      description: |
        Auswahlliste für Abteilungsleitung, Stufenleitung und Personen mit einem Recht auf Seiten: alle Tags der eigenen Abteilung mit Id, Name und Typ, sortiert nach Typ und Name. Ohne Kürzel, ohne Zahl der Personen und ohne Personen.

        Statuscodes: 200, 401, 403, 426.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Die Tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedaktionTagListe"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/redaktion/personen:
    get:
      operationId: listeRedaktionPersonen
      summary: Personen mit einem Tag für die Auswahl im Editor
      description: |
        Auswahlliste für Abteilungsleitung, Stufenleitung und Personen mit einem Recht auf Seiten: die aktiven Konten, die den Tag tragen. Nur Id, Anzeigename (Cevi-Name, sonst der Name des Kontos) und Funktion (die Rolle am Tag). Nie Telefon, E-Mail, Benutzername oder die Rollen des Kontos. Sortiert nach der Reihenfolge im Tag, dann nach Name.

        Reihenfolge der Prüfungen: Zugang (403), Query (400), Tag in der eigenen Abteilung (404, auch für Tags anderer Abteilungen).

        Statuscodes: 200, 400, 401, 403, 404, 426.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: tag
          in: query
          required: true
          description: Der Tag, dessen Personen gesucht sind (UUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Die Personen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedaktionPersonenListe"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/redaktion/vorlagen:
    get:
      operationId: listeRedaktionVorlagen
      summary: Vorlagen für neue Seiten
      description: |
        Die Startvorlagen, aus denen eine neue Seite entsteht: `stufenseite`, `anlass`, `textseite` und `leer`. Die Vorlagen stehen im Code, nicht in der Datenbank. Die Liste nennt nur Schlüssel, Name, Beschreibung und ob die Vorlage eine Gruppe (`tagId`) braucht, nie den Inhalt der Dokumente. Zugang wie bei `GET /api/v1/redaktion/seiten`.

        Statuscodes: 200 bei Erfolg. 403 ohne Zugang.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Vorlagen in fester Reihenfolge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedaktionVorlagenListe"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/redaktion/seiten/aus-vorlage:
    post:
      operationId: legeRedaktionSeiteAusVorlageAn
      summary: Seite aus einer Vorlage anlegen
      description: |
        Wie `POST /api/v1/redaktion/seiten` (nur Abteilungsleitung und Redaktion), aber der Inhalt ist die Vorlage: ein vorbefüllter, gültiger Entwurf mit Platzhaltertexten. Die Seite ist nie veröffentlicht; die Adresse fehlt im Body und wird aus dem Titel gebildet (Kleinbuchstaben, Umlaute ausgeschrieben); gibt es sie unter der Elternseite schon, hängt die Antwort `-2`, `-3` an. Eine reservierte Adresse auf der obersten Ebene bekommt ebenso einen Zusatz. Ohne `elternId` entsteht die Seite auf der obersten Ebene, ans Ende der Geschwister. `sichtbarkeit` ist Pflicht und gilt erst beim Veröffentlichen.

        Die Vorlage `stufenseite` braucht `tagId` (Leitungsteam und Termine hängen daran). Eine Gruppe hat höchstens eine Seite: Gibt es zu `tagId` schon eine, antwortet die Route mit 409. Die Rechte der Verantwortlichen folgen aus `tagId`: Die Stufenleitung der Stufe und die Verantwortlichen eines Teams (Rolle `verantwortlich` am Tag, Typ `team`) bearbeiten die Seite.

        Reihenfolge der Prüfungen: Zugang (403), Body (400), Recht zum Anlegen (403), Tags der Sichtbarkeit (400), Vorlage braucht Gruppe (400), Gruppe und Elternseite in der eigenen Abteilung (404), Tiefe (400), Gruppe schon vergeben (409). Audit-Log: `seite_angelegt` (Kennungen, Art der Sichtbarkeit und Vorlage, nie der Titel).

        Statuscodes: 201 bei Erfolg, mit `id` und `adresse`. 400 bei ungültiger Eingabe, `TAG_ERFORDERLICH` oder `SEITE_ZU_TIEF`. 403 ohne Recht. 404 für unbekannte Elternseite oder Gruppe. 409 mit `TAG_VERGEBEN`.
      tags:
        - Redaktion
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedaktionSeiteAusVorlage"
      responses:
        "201":
          description: Seite als Entwurf angelegt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedaktionSeiteAusVorlageAngelegt"
        "400":
          $ref: "#/components/responses/RedaktionSeite400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/RedaktionSeite409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  # lager-pfade: lager (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
  /api/v1/lager/{id}/aenderungen:
    get:
      operationId: holeLagerAenderungen
      summary: Änderungsfeed des Lagers
      description: |
        Meldet, welche Einträge des Lagers seit einer Folgenummer neu, geändert oder gelöscht sind. Der Feed nennt nur Objekttyp, ID, Art, Version und Zeitpunkt, nie Inhalte; die App holt den Inhalt über die Route des Moduls. So gelten die Rechte der Rolle dort, und der Feed verrät höchstens, dass es einen Eintrag gibt, den die Rolle lesen darf.

        Filter: Es erscheinen nur Objekttypen, deren Leserecht die Rolle hat, und davon nur die Zeilen, die der Zeilenfilter der Rolle zulässt (auch für gelöschte). Eine Seite, deren Einträge alle herausfallen, kommt leer zurück, `bis` rückt trotzdem vor.

        Ablauf der App: Ohne `seit` liefert die Route die aktuelle Folgenummer `seq` und die lesbaren Objekttypen; die App lädt die Listen der Module und fragt dann mit `seit=seq`. Danach fragt sie mit `seit=<bis>` weiter, solange `weitere` wahr ist, und speichert das letzte `bis`. Jeder Schreibvorgang im Lager hat eine eigene Folgenummer; sie steigt ohne Lücke. Es gibt einen Eintrag je Schreibvorgang: Dieselbe Zeile kann mehrfach vorkommen, der letzte Eintrag gilt.

        Einträge entfallen nach 30 Tagen. Ist `seit` älter als der Feed oder grösser als die aktuelle Folgenummer (zum Beispiel nach dem Zurückspielen des Lagers), antwortet die Route mit 410 `FEED_NEU_LADEN`, und die App lädt die Listen neu.

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID oder Abfrage (auch bei unbekanntem Parameter). 401 ohne Anmeldung. 404, wenn das Lager unbekannt ist, zu einer anderen Abteilung gehört oder die Person kein Mitglied ist. 410 bei zu altem oder unbekanntem Stand. Die Route ist auch in einem abgeschlossenen Lager lesbar.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
        - name: seit
          in: query
          required: false
          description: Folgenummer, ab der der Feed liefert (ausschliesslich). Ohne Angabe liefert die Route den Stand.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Höchstens so viele Einträge je Seite.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Eine Seite des Feeds oder, ohne `seit`, der Stand.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LagerFeedSeite"
                  - $ref: "#/components/schemas/LagerFeedStand"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "410":
          description: Der Stand ist zu alt für den Feed (`FEED_NEU_LADEN`). Die App lädt die Listen neu und fragt mit `seit=seq` weiter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerFeedNeuLaden"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    post:
      operationId: sendeLagerWarteschlange
      summary: Offline gesammelte Änderungen des Lagers senden
      description: |
        Nimmt die Änderungen an, die die App offline gesammelt hat, gebündelt und idempotent. Jede Operation hat eine `clientOpId` (UUID, von der App einmal erzeugt und bei jeder Wiederholung beibehalten), einen `typ` (zum Beispiel `aufgabe.aendern`; die Module des Lagers melden ihre Operationen an) und eine `nutzlast`. Höchstens 100 Operationen je Anfrage, höchstens 256 KB, höchstens 20 Anfragen je Konto und Minute.

        Jede Operation läuft in einer eigenen Transaktion, der Reihe nach, und bekommt ein eigenes Ergebnis in derselben Reihenfolge: `ok` (mit IDs und Versionen der geschriebenen Zeilen, keine Inhalte), `konflikt` (die Zeile hat inzwischen eine andere Version, mit `aktuell` in der Ansicht der Rolle und den abweichenden Feldern) oder `abgelehnt` (mit Code: `OPERATION_UNBEKANNT`, `UNGUELTIGE_EINGABE`, `KEINE_BERECHTIGUNG`, `NICHT_GEFUNDEN`, `KONFLIKT`). Eine Ablehnung oder ein Konflikt bricht die anderen Operationen nicht ab und nimmt nur die Schreibvorgänge dieser Operation zurück. Das Recht jeder Operation gilt gegen die Rolle der Person im Lager, nie gegen Angaben der Nutzlast.

        Idempotenz: Ein `ok` wird je Lager, Person und `clientOpId` 30 Tage gespeichert. Eine Wiederholung derselben `clientOpId` liefert dieses Ergebnis, auch wenn sich Rechte seither geändert haben, und schreibt nichts noch einmal; gleichzeitige Wiederholungen schreiben einmal. `konflikt` und `abgelehnt` werden nicht gespeichert: Sie haben nichts geschrieben und kommen bei einer Wiederholung zum selben Ergebnis. Bei einem Konflikt holt die App den Stand (in `aktuell`) und schickt die Änderung mit einer neuen `clientOpId` und der aktuellen `version` noch einmal.

        Statuscodes: 200 mit den Ergebnissen (auch wenn einzelne Operationen abgelehnt wurden). 400 bei ungültiger Anfrage (keine oder mehr als 100 Operationen, `clientOpId` keine UUID, unbekannte Felder). 401 ohne Anmeldung. 404, wenn das Lager unbekannt ist, zu einer anderen Abteilung gehört oder die Person kein Mitglied ist. 409 `LAGER_GESCHLOSSEN`, wenn das Lager abgeschlossen oder archiviert ist: Die ganze Anfrage wird abgelehnt. 413 über 256 KB. 429 bei zu vielen Anfragen. 500 bei einem Fehler des Servers: Die App schickt dieselbe Anfrage noch einmal; erledigte Operationen kommen aus dem Speicher.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LagerWarteschlangeAnfrage"
      responses:
        "200":
          description: Ein Ergebnis je Operation, in der Reihenfolge der Anfrage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerWarteschlangeAntwort"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Das Lager ist abgeschlossen oder archiviert (`LAGER_GESCHLOSSEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "413":
          description: Die Anfrage ist grösser als 256 KB (`ZU_GROSS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  # lager-pfade: ereignisse (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
  /api/v1/lager/{id}/ereignisse:
    get:
      operationId: oeffneLagerEreignisse
      summary: Ereignisse des Lagers (Server-Sent Events)
      description: |
        Offener Event-Stream (`text/event-stream`), über den eine offene Ansicht erfährt, dass es im Lager Neues gibt, statt in einem Takt zu fragen. Die Meldung nennt nur die Folgenummer und die Objekttypen, die die Rolle lesen darf; nie IDs, Namen oder Inhalte. Den Inhalt holt die App danach über den Änderungsfeed (`GET /api/v1/lager/{id}/aenderungen?seit=`), wo auch der Zeilenfilter der Rolle gilt.

        Nachrichten (`event`, `id` ist die Folgenummer, `data` ist JSON, siehe `LagerEreignis`):
        - `bereit`: erste Nachricht; `{ "bis": N }` ist der Stand des Lagers.
        - `aenderung`: `{ "bis": N, "objekttypen": ["aufgabe", ...] }`. Schreibvorgänge in kurzer Zeit ergeben eine Meldung. Hat nichts Lesbares geändert, kommt keine. Beim Verbinden mit `Last-Event-ID` (oder `seit`), das kleiner ist als der Stand, kommt sie sofort mit allen lesbaren Objekttypen.
        - `neu-laden`: `{ "bis": N }`; die Folgenummer der App liegt in der Zukunft (Lager zurückgespielt), die App lädt neu.
        - `ende`: `{ "grund": "neu-verbinden" }`; der Server beendet die Verbindung, weil sich Rolle oder Rechte geändert haben oder eine Obergrenze der Verbindungen erreicht ist. Die App verbindet neu und bekommt dabei ihre aktuellen Rechte (oder 401 und 404, wenn sie keinen Zugang mehr hat).
        - Kommentarzeile `: herzschlag` alle 25 Sekunden, ohne Datenbankzugriff.

        Wiederverbinden: Die App merkt sich die letzte `id` und sendet sie als `Last-Event-ID` (Browser tun das selbst; wer keinen Kopf setzen kann, nimmt `seit`). Danach fragt sie den Feed ab dieser Folgenummer ab. Die Verbindung gilt für die Sitzung, die sie geöffnet hat: Endet die Sitzung, wird das Konto gesperrt oder ändert sich die Rolle im Lager, endet die Verbindung spätestens nach fünf Minuten, bei Änderungen in der Verwaltung (Mitglieder, Rechte) sofort.

        Obergrenzen: höchstens 3 gleichzeitige Verbindungen je Konto (eine vierte beendet die älteste), 100 je Lager und 200 je Instanz; darüber antwortet die Route mit 429 `ZU_VIELE_VERBINDUNGEN` und `Retry-After: 30`. Ein Client, der Nachrichten nicht abholt, verliert die Verbindung.

        Die Route ist lesend und darum auch in einem abgeschlossenen Lager offen. Proxys dürfen die Antwort nicht puffern (siehe docs/betrieb.md). Statuscodes: 200 (Stream). 400 bei ungültiger ID oder Abfrage. 401 ohne Anmeldung. 404, wenn das Lager unbekannt ist, zu einer anderen Abteilung gehört oder die Person kein Mitglied ist. 429 bei erreichter Obergrenze.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          required: false
          description: Folgenummer der letzten Meldung, die die App erhalten hat.
          schema:
            type: integer
            minimum: 0
        - name: seit
          in: query
          required: false
          description: Wie `Last-Event-ID`, für Clients, die keinen Kopf setzen können. Der Kopf geht vor.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Ein Event-Stream. Die Verbindung bleibt offen, bis eine Seite sie beendet.
          content:
            text/event-stream:
              schema:
                type: string
                description: Nachrichten im Format von Server-Sent Events; `data` ist ein `LagerEreignis`.
              example: |
                retry: 5000
                id: 42
                event: bereit
                data: {"bis":42}

                id: 43
                event: aenderung
                data: {"bis":43,"objekttypen":["aufgabe"]}
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          description: Obergrenze der Verbindungen erreicht (`ZU_VIELE_VERBINDUNGEN`), Kopf `Retry-After` mit 30 Sekunden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
  # lager-pfade: papierkorb (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
  # lager-pfade: benachrichtigungen (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
  # lager-pfade: dateien (die Einträge dieses Moduls stehen unter dieser Zeile, vor dem nächsten Marker)
  /api/v1/lager/{id}/dateien:
    post:
      operationId: legeLagerDateiAn
      summary: Datei als Verknüpfung hinzufügen
      description: |
        Speichert die Verknüpfung auf eine Datei, die im SharePoint (Microsoft 365) der Abteilung liegt. Cevi OS speichert nur den Link, den Anzeigenamen und, falls bekannt, Typ (MIME) und Grösse (Bytes), nie den Inhalt, und ruft den Link nie ab. Wer die Datei öffnen darf, regelt der Ablageort. Offline-Kopien legt nur die App an, nur wenn die Person die Option in den Einstellungen der App einschaltet; im Web gibt es keine.

        Der Link wird streng geprüft: nur `https:`, keine protokoll-relative Adresse, kein `javascript:` oder `data:`, keine Zugangsdaten und kein Port in der Adresse, ein Host mit Punkt und kein IP-Literal, höchstens 2048 Zeichen, ohne Leer-, Steuer- und Formatzeichen. Hat die Abteilung erlaubte Hosts festgelegt (`/api/v1/admin/lager-dateien/hosts`), muss der Host einer davon sein oder eine Subdomain davon. Der Link wird in der Schreibweise der URL-Norm gespeichert (Schema und Host klein).

        Wer den Eintrag sieht: die Person, die ihn hinzugefügt hat, 24 Stunden lang, und wer einen Datensatz lesen darf, der ihn einbindet (Pinnwand, Dokumente, Protokolle, Infos). Ein Eintrag, den innerhalb von 24 bis 48 Stunden kein Datensatz einbindet, wird aufgeräumt. Recht: Pinnwand, Dokumente, Protokolle oder Infos bearbeiten (eines genügt). Rate-Limit: 30 Einträge je Konto in 10 Minuten (429). Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`), Eingabe (400), Rate-Limit (429).

        Statuscodes: 201 bei Erfolg. 400 bei ungültiger Eingabe: `LINK_UNGUELTIG` oder `LINK_HOST_NICHT_ERLAUBT` für den Link, sonst ohne Details. 401 ohne Anmeldung. 403 ohne Recht. 404, wenn das Lager unbekannt ist, zu einer anderen Abteilung gehört oder die Person kein Mitglied ist. 409 bei `LAGER_GESCHLOSSEN`.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LagerDateiAnlegen"
      responses:
        "201":
          description: Die Verknüpfung (Version 1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerDatei"
        "400":
          description: Ungültige Eingabe. Beim Link `LINK_UNGUELTIG` oder `LINK_HOST_NICHT_ERLAUBT`, sonst `UNGUELTIGE_EINGABE` ohne Details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/LagerKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/lager/{id}/dateien/{dateiId}:
    get:
      operationId: holeLagerDatei
      summary: Verknüpfung lesen
      description: |
        Liefert Link, Anzeigename, Typ und Grösse einer Verknüpfung. Sichtbar ist der Eintrag für die Person, die ihn in den letzten 24 Stunden hinzugefügt hat, und für jede Person, die einen Datensatz lesen darf, der ihn einbindet; für alle anderen gibt es ihn nicht (404). Der Server liefert nie den Inhalt der Datei: Öffnen und Herunterladen gehen über den Link direkt zum Ablageort, der selbst regelt, wer die Datei öffnen darf. Eine Liste gibt es nicht; die Routen der Module, die Dateien einbinden, liefern die Einträge ihrer Datensätze.

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID. 401 ohne Anmeldung. 404, wenn das Lager oder der Eintrag unbekannt ist, zu einer anderen Abteilung oder einem anderen Lager gehört, gelöscht oder für die Person nicht sichtbar ist, oder die Person kein Mitglied ist.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
        - name: dateiId
          in: path
          required: true
          description: ID der Verknüpfung (UUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Die Verknüpfung.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagerDatei"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: loescheLagerDatei
      summary: Verknüpfung löschen
      description: |
        Entfernt nur die Verknüpfung in Cevi OS (Soft-Delete über den Sync-Kern, der Änderungsfeed meldet `geloescht`), nie die Datei am Ablageort. Die Anfrage nennt die zuletzt gesehene `version`; stimmt sie nicht, antwortet der Server 409 `VERSION_KONFLIKT` mit dem aktuellen Stand. Gleiches Recht wie beim Anlegen. Reihenfolge der Prüfungen: Pfad (400), Lager (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`), Eintrag (404), Version (409).

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger ID oder fehlender Version. 401 ohne Anmeldung. 403 ohne Recht. 404, wenn Lager oder Eintrag für die Person nicht existieren. 409 bei `LAGER_GESCHLOSSEN` und `VERSION_KONFLIKT`.
      tags:
        - Lager
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID des Lagers (UUID).
          schema:
            type: string
            format: uuid
        - name: dateiId
          in: path
          required: true
          description: ID der Verknüpfung (UUID).
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: true
          description: Die zuletzt gesehene Version der Verknüpfung.
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Verknüpfung gelöscht.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Das Lager ist abgeschlossen (`LAGER_GESCHLOSSEN`) oder die Version stimmt nicht (`VERSION_KONFLIKT`, mit aktuellem Stand und abweichenden Feldern).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LagerKonflikt"
                  - $ref: "#/components/schemas/LagerVersionKonflikt"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/lager-dateien/hosts:
