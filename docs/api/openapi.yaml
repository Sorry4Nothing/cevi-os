  /api/v1/chats:
    get:
      operationId: listeChats
      summary: Eigene Chats auflisten
      tags:
        - Chat
      description: |
        Liefert alle Chats, in denen die angemeldete Person Mitglied ist. Die Mitgliedschaft wird bei jeder Anfrage aus Rollen und Kindern abgeleitet:
        Stufenleitungen (SL) sind Mitglied im Gruppenchat und in allen Einzelchats ihrer Stufe (aktive Konten),
        Eltern mit mindestens einem aktiven Kind in der Stufe im Gruppenchat der Stufe und im eigenen Einzelchat.
        Admins und Leitende ohne SL-Rolle sind keine Mitglieder; für sie ist die Liste leer (200, `chats: []`).
        Wer in einer Stufe SL ist, nimmt dort nur als SL teil.

        Sortierung: Gruppenchats («stufe») vor Einzelchats («direkt»), dann nach Reihenfolge der Stufe, dann nach Name des Elternteils.
        Es gibt keine Paginierung; die Antwort enthält alle Chats.

        `ungelesen` zählt die Nachrichten anderer Personen, die die Person im Chat sieht und die nach ihrem Gelesen-Stand (`PUT /api/v1/chats/{id}/gelesen`) eingegangen sind; ohne Stand sind es alle sichtbaren fremden Nachrichten. Eigene und für die Person nicht sichtbare (vor dem Beitritt geschriebene) Nachrichten zählen nicht.
        `letzteNachricht` ist die neueste Nachricht, die die Person im Chat sieht, oder `null`, wenn es noch keine gibt. Es gilt dieselbe Sichtbarkeitsregel wie bei `ungelesen`, ausser dass auch eigene Nachrichten zählen; vor dem Beitritt geschriebene zählen nicht. Eltern sehen die letzte Nachricht nur in ihren eigenen Chats.
        Der `text` ist auf höchstens 120 Zeichen gekürzt (ohne Auslassungszeichen); Anhänge und Programmverweise der Nachricht gehören nicht dazu. Den vollständigen Text liefert `GET /api/v1/chats/{id}/nachrichten`.
        Die App fragt die Liste per Polling ab (Liste alle 30 Sekunden, offener Chat alle 5 Sekunden); eine Echtzeit-Verbindung gibt es nicht.

        Statuscodes: 200 Erfolg; 401 nicht angemeldet oder Konto deaktiviert; 403 Konto muss zuerst das Passwort ändern; 426 App zu alt.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Chats der Person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatListe"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/chats/direkt:
    post:
      operationId: erstelleEinzelchat
      summary: Einzelchat Eltern und Stufenleitung öffnen
      tags:
        - Chat
      description: |
        Legt den Einzelchat eines Elternteils in einer Stufe an oder liefert den bestehenden. Idempotent: Ein zweiter Aufruf mit denselben Angaben gibt dieselbe Chat-ID zurück (200, nie 201).

        Wer darf aufrufen:
        - Eine Stufenleitung der Stufe `stufeId` muss zusätzlich `elternUserId` nennen. Fehlt das Feld, kommt 400.
        - Ein Elternteil mit aktivem Kind in der Stufe nennt nur `stufeId`. Nennt es `elternUserId` einer anderen Person, kommt 404 (ein fremder Name ist wie ein fremder Chat). Die eigene ID ist erlaubt.
        - Alle anderen (Leitende, Admins, Eltern ohne aktives Kind in der Stufe, Personen anderer Abteilungen) bekommen 404.

        Weitere 404-Fälle: Stufe gehört nicht zur Abteilung der Person oder existiert nicht; das genannte Elternteil existiert nicht in der Abteilung; das genannte Elternteil ist selbst Stufenleitung dieser Stufe; das Elternteil hat kein aktives Kind in der Stufe (es entsteht dann kein Chat).

        Statuscodes: 200 Chat-ID; 400 ungültige Eingabe (unbekannte Felder, keine UUIDs, `elternUserId` fehlt bei SL); 401 nicht angemeldet; 403 Passwortwechsel offen; 404 siehe oben; 426 App zu alt.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EinzelchatAnfrage"
      responses:
        "200":
          description: ID des (neuen oder bestehenden) Einzelchats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatKennung"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/chats/{id}/nachrichten:
    get:
      operationId: listeChatNachrichten
      summary: Nachrichten eines Chats lesen
      tags:
        - Chat
      description: |
        Liefert Nachrichten des Chats, neueste zuerst, in Seiten zu 50.

        Paginierung: Der Query-Parameter `vor` ist die ID der ältesten bereits bekannten Nachricht; geliefert werden nur Nachrichten mit kleinerer ID (UUIDv7, ordnet nach Zeit). Ohne `vor` kommt die neueste Seite. `naechster` in der Antwort ist der Wert für `vor` der nächsten (älteren) Seite; `null`, wenn der Verlauf zu Ende ist (auch bei genau 50 Nachrichten). Ein Limit-Parameter existiert nicht, die Seitengrösse ist fest 50.

        Sichtbarkeit: Stufenleitungen sehen den ganzen Verlauf. Eltern sehen im Gruppenchat nur Nachrichten ab ihrem Beitritt (frühestes aktives Kind der Stufe bzw. Verknüpfung mit dem Kind), im eigenen Einzelchat den ganzen Verlauf.

        Nicht-Mitglieder (andere Stufen, andere Abteilungen, Admins, Leitende ohne SL-Rolle, unbekannte ID) bekommen 404; ein 403 gibt es hier nicht.

        Statuscodes: 200 Seite; 400 `id` oder `vor` keine UUID oder unbekannte Query-Parameter; 401; 403 Passwortwechsel offen; 404 kein Mitglied oder Chat unbekannt; 426.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/ChatPfadId"
        - $ref: "#/components/parameters/NachrichtenCursorVor"
      responses:
        "200":
          description: Eine Seite Nachrichten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatNachrichtenSeite"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
    post:
      operationId: sendeChatNachricht
      summary: Nachricht in einen Chat senden
      tags:
        - Chat
      description: |
        Schreibt eine Nachricht in den Chat. Erlaubt ist, wer Mitglied des Chats ist (siehe «Eigene Chats auflisten»): Stufenleitungen der Stufe und Eltern mit aktivem Kind in der Stufe.

        Optional verweist die Nachricht auf ein Programm (`programmId`). Erlaubt sind nur Programme der eigenen Abteilung mit Sichtbarkeit «eltern», die der Stufe des Chats zugeordnet sind; sonst kommt 400 (so landet kein interner Titel im Chat).

        Begrenzung: höchstens 20 Nachrichten pro Person und Minute, gezählt über alle Chats der Person. Die 21. Nachricht innerhalb einer Minute ergibt 429.

        Push: Die anderen Mitglieder des Chats mit eingeschaltetem Chat-Push (`pushChat`) bekommen einen Push mit Titel «Neue Nachricht im Chat <Stufe>» (im Einzelchat «Neue Nachricht im Einzelchat <Stufe>») und `data: { typ: "chat", id: <Chat-ID> }`, nie mit Nachrichtentext oder Namen. Kein Push geht an den Absender und an Konten, die nicht (mehr) Mitglied oder deaktiviert sind. Ein Fehler beim Pushen ändert das Ergebnis nicht.

        Statuscodes: 201 Nachricht angelegt; 400 ungültige Eingabe (Text leer nach dem Trimmen, länger als 2000 Zeichen, enthält NUL, unbekannte Felder, `programmId` nicht zulässig); 401; 403 Passwortwechsel offen; 404 kein Mitglied oder Chat unbekannt; 426; 429 Limit überschritten.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/ChatPfadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatNachrichtAnfrage"
      responses:
        "201":
          description: Nachricht angelegt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NachrichtKennung"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/chats/{id}/gelesen:
    put:
      operationId: markiereChatGelesen
      summary: Chat als gelesen markieren
      tags:
        - Chat
      description: |
        Setzt den Gelesen-Stand der angemeldeten Person im Chat auf die aktuelle Serverzeit. Danach zählt `ungelesen` in der Chatliste nur Nachrichten, die später eingehen. Der Stand geht nie zurück; ein wiederholter Aufruf ist unschädlich. Die Anfrage hat keinen Body. Andere Personen sehen den Stand nicht (keine Lesebestätigungen in V1).

        Nicht-Mitglieder (andere Stufen, andere Abteilungen, Admins, Leitende ohne SL-Rolle, unbekannte ID) bekommen 404.

        Statuscodes: 204 gespeichert; 400 `id` keine UUID; 401; 403 Passwortwechsel offen; 404 kein Mitglied oder Chat unbekannt; 426.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/ChatPfadId"
      responses:
        "204":
          description: Gelesen-Stand gespeichert. Kein Inhalt.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/admin/personen:
    get:
      operationId: listeAdminPersonen
      summary: Personen, Stufen und Kinder der Abteilung für die Verwaltung
      description: |
        Nur Admins. Liefert alle Personen der eigenen Abteilung (sortiert nach Name), dazu alle Stufen (nach Reihenfolge) und alle Kinder (nach Nachname, Vorname) für den Rollen-Editor.
        Enthält nie E-Mail, Telefon, Sperrgrund, Bremsfelder oder Geheimnisse und Codes des zweiten Faktors.

        Statuscodes: 200 bei Erfolg. 403, wenn die Person kein Admin ist, wenn ein Admin noch keinen zweiten Faktor eingerichtet hat (Code `ZWEITER_FAKTOR_FEHLT`, gilt für alle Admin-Routen) oder wenn noch ein Passwortwechsel aussteht. 401 ohne gültige Sitzung oder bei deaktiviertem Konto.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Verwaltungsübersicht der Abteilung.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPersonenListe"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    post:
      operationId: legeAdminPersonAn
      summary: Person anlegen und Startpasswort erhalten
      description: |
        Nur Admins. Legt ein Konto in der eigenen Abteilung an, mit den angegebenen Stufenrollen und Verknüpfungen zu Kindern. Das Konto muss das Startpasswort beim ersten Login ändern und es ist 7 Tage gültig.

        Das Startpasswort steht nur in dieser 201-Antwort. Es wird nicht gespeichert und lässt sich nicht erneut abrufen; ein neues erzeugt `POST /api/v1/admin/personen/{id}/startpasswort`. Die Antwort kommt erst nach dem Commit; scheitert das Anlegen, gibt es kein Startpasswort. Ein Admin-Anlegen oder eine vergebene Rolle «stufenleitung» löst einen Push an die anderen Admins aus.

        Statuscodes: 201 bei Erfolg. 400 bei ungültiger Eingabe (unbekannte Felder, Längen, Muster, doppelte Stufen oder Kinder) sowie wenn eine Stufe oder ein Kind nicht zur eigenen Abteilung gehört oder unbekannt ist. 403 für Nicht-Admins. 409 mit Code `BENUTZERNAME_VERGEBEN`, wenn der Benutzername schon vergeben ist (Gross-/Kleinschreibung zählt nicht).
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPersonAnlegen"
      responses:
        "201":
          description: Person angelegt; enthält das Startpasswort (einmalig).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPersonAngelegt"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "409":
          description: Der Benutzername ist schon vergeben (`BENUTZERNAME_VERGEBEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKonflikt"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/personen/{id}:
    patch:
      operationId: aendereAdminPerson
      summary: Name, Admin-Recht, Stufenrollen und Kinder einer Person ändern
      description: |
        Nur Admins, nur Personen der eigenen Abteilung. Alle Felder sind optional; ein leeres Objekt ist ein No-op und liefert 204. `rollen` und `elternteilVon` ersetzen die bisherige Liste vollständig (nicht angegeben bleibt unverändert).

        Reihenfolge der Prüfungen: Pfad und Body (400), dann Ziel in der eigenen Abteilung (404), dann Admin-Recht (403), dann Stufen- und Kind-IDs (400).

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger Eingabe oder fremden bzw. unbekannten Stufen- und Kind-IDs. 403 für Nicht-Admins. 404, wenn die Person unbekannt ist oder zu einer anderen Abteilung gehört. 409 mit Code `LETZTER_ADMIN`, wenn `admin: false` den letzten aktiven Admin der Abteilung entfernen würde.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AdminPersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPersonAendern"
      responses:
        "204":
          description: Geändert (auch bei einem No-op).
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Der letzte aktive Admin lässt sich nicht entfernen (`LETZTER_ADMIN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKonflikt"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: loescheAdminPerson
      summary: Person löschen
      description: |
        Nur Admins, nur Personen der eigenen Abteilung. Löscht das Konto samt Rollen, Verknüpfungen zu Kindern, Sitzungen und Push-Tokens sowie die Nachrichten der Person und bei Eltern den Einzelchat. Die Person löscht ihr Konto nicht selbst; das tut auf Anfrage die Leitung über diese Route.

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger ID. 403 für Nicht-Admins. 404, wenn die Person unbekannt ist oder zu einer anderen Abteilung gehört. 409 mit Code `EIGENES_KONTO` für das eigene Konto oder `LETZTER_ADMIN` für den letzten aktiven Admin.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AdminPersonId"
      responses:
        "204":
          description: Gelöscht.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Eigenes Konto (`EIGENES_KONTO`) oder letzter Admin (`LETZTER_ADMIN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKonflikt"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/personen/{id}/startpasswort:
    post:
      operationId: setzeAdminStartpasswortNeu
      summary: Neues Startpasswort für eine Person erzeugen
      description: |
        Nur Admins, nur Personen der eigenen Abteilung. Setzt ein neues Startpasswort, beendet alle Sitzungen der Person (Push-Tokens enden mit ihnen), verlangt beim nächsten Login einen Passwortwechsel, gilt 7 Tage und setzt die Bremse für Fehlversuche zurück. Kein Request-Body.

        Das Startpasswort steht nur in dieser 200-Antwort und lässt sich nicht erneut abrufen.

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID. 403 für Nicht-Admins. 404, wenn die Person unbekannt ist oder zu einer anderen Abteilung gehört. 409 mit Code `EIGENES_KONTO` für das eigene Konto (geprüft vor jeder Änderung).
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AdminPersonId"
      responses:
        "200":
          description: Neues Startpasswort (einmalig).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStartpasswort"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Das eigene Konto lässt sich nicht zurücksetzen (`EIGENES_KONTO`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKonflikt"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
