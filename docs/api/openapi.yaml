    RedaktionZaehler:
      type: object
      required:
        - zaehler
      properties:
        zaehler:
          type: integer
          minimum: 0
          description: Zählt jedes Speichern und jedes Zurückholen des Entwurfs.
    RedaktionEntwurf:
      type: object
      required:
        - zaehler
        - dokument
        - veroeffentlichteNr
        - unveroeffentlicht
      properties:
        zaehler:
          type: integer
          minimum: 0
        dokument:
          type:
            - object
            - "null"
          description: "Das Dokument `{ v: 1, titel, bausteine }`; `null`, solange noch nie gespeichert wurde."
        veroeffentlichteNr:
          type:
            - integer
            - "null"
          description: Nummer der veröffentlichten Version; `null`, wenn die Seite nicht veröffentlicht ist.
        unveroeffentlicht:
          type: boolean
          description: Der Entwurf weicht von der veröffentlichten Version ab (oder es gibt keine).
    RedaktionEntwurfSpeichern:
      type: object
      additionalProperties: false
      required:
        - zaehler
        - dokument
      properties:
        zaehler:
          type: integer
          minimum: 0
          description: Der Zähler aus dem letzten Lesen oder Speichern.
        dokument:
          type: object
          description: "Das ganze Dokument `{ v: 1, titel, bausteine }` (Bausteinkatalog Version 1)."
    RedaktionKonflikt:
      type: object
      required:
        - code
        - message
        - zaehler
        - dokument
      properties:
        code:
          type: string
          enum:
            - KONFLIKT
        message:
          type: string
        zaehler:
          type: integer
          description: Der aktuelle Zähler.
        dokument:
          type:
            - object
            - "null"
          description: Das aktuelle Dokument des Entwurfs.
    RedaktionDokumentFehler:
      type: object
      required:
        - code
        - message
        - fehler
      properties:
        code:
          type: string
          description: "`DOKUMENT_UNGUELTIG` oder bei 422 der erste Code der Verweisprüfung."
          enum:
            - DOKUMENT_UNGUELTIG
            - MEDIUM_UNBEKANNT
            - MEDIUM_FORMAT
            - MEDIUM_NICHT_OEFFENTLICH
            - TAG_UNBEKANNT
            - PERSON_UNBEKANNT
            - SEITE_UNBEKANNT
        message:
          type: string
        fehler:
          type: array
          maxItems: 20
          items:
            type: object
            required:
              - pfad
              - code
            properties:
              pfad:
                type: string
                description: Stelle im Dokument, zum Beispiel `bausteine.2.daten.ziel` oder bei der Verweisprüfung `bausteine.2`.
              code:
                type: string
                description: Code der Prüfung (Code von zod oder der Verweisprüfung), nie ein Wert der Eingabe.
    RedaktionVersion:
      type: object
      required:
        - nr
        - autorId
        - erstelltAm
        - veroeffentlicht
      properties:
        nr:
          type: integer
          minimum: 1
        autorId:
          type:
            - string
            - "null"
          format: uuid
          description: Wer veröffentlicht hat; `null`, wenn das Konto inzwischen gelöscht ist.
        erstelltAm:
          type: string
          format: date-time
        veroeffentlicht:
          type: boolean
          description: Die Seite zeigt gerade diese Version.
    RedaktionIch:
      type: object
      required:
        - redigieren
        - bereiche
        - verwalten
      properties:
        redigieren:
          type: boolean
          description: Ob die Person Zugang zur Redaktion hat (Abteilungsleitung, Stufenleitung oder ein Recht auf Seiten in `bearbeiter`).
        bereiche:
          type: array
          description: Die Bereiche des Panels, die die Person sehen darf. Heute nur `website`; ohne Zugang leer.
          items:
            type: string
            enum:
              - website
        verwalten:
          type: boolean
          description: Ob die Person Seiten anlegen und löschen und Medien löschen darf (Abteilungsleitung und Redaktion). Nur für die Anzeige; jede Route prüft selbst.
    MediumAendern:
      type: object
      description: Genau eines von beiden, `altText` oder `dekorativ`.
      additionalProperties: false
      properties:
        altText:
          type: string
          minLength: 1
          maxLength: 500
          description: Neuer Alternativtext, 1 bis 500 Zeichen nach dem Entfernen von Leerraum am Rand. Hebt «dekorativ» auf.
        dekorativ:
          const: true
          description: Das Bild als dekorativ markieren; entfernt den Alt-Text.
    RedaktionTag:
      type: object
      required:
        - id
        - name
        - typ
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        typ:
          type: string
          enum:
            - stufe
            - funktion
            - team
            - lager
    RedaktionTagListe:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/RedaktionTag"
    RedaktionPerson:
      type: object
      required:
        - id
        - anzeigename
        - funktion
      properties:
        id:
          type: string
          format: uuid
        anzeigename:
          type: string
          description: Der Cevi-Name, sonst der Name des Kontos.
        funktion:
          type:
            - string
            - "null"
          description: Die Rolle der Person an diesem Tag (freier Text); `null` ohne Rolle.
    RedaktionPersonenListe:
      type: object
      required:
        - personen
      properties:
        personen:
          type: array
          items:
            $ref: "#/components/schemas/RedaktionPerson"
    RedaktionVorlagenListe:
      type: object
      required:
        - vorlagen
      properties:
        vorlagen:
          type: array
          items:
            type: object
            required:
              - schluessel
              - name
              - beschreibung
              - brauchtTag
            properties:
              schluessel:
                type: string
                enum:
                  - stufenseite
                  - anlass
                  - textseite
                  - leer
              name:
                type: string
              beschreibung:
                type: string
              brauchtTag:
                type: boolean
                description: Die Vorlage verlangt `tagId` (Stufenseite).
    RedaktionSeiteAusVorlage:
      type: object
      required:
        - vorlage
        - titel
        - sichtbarkeit
      additionalProperties: false
      properties:
        vorlage:
          type: string
          enum:
            - stufenseite
            - anlass
            - textseite
            - leer
        titel:
          type: string
          minLength: 1
          maxLength: 150
        elternId:
          type:
            - string
            - "null"
          format: uuid
        tagId:
          type:
            - string
            - "null"
          format: uuid
        sichtbarkeit:
          $ref: "#/components/schemas/RedaktionSichtbarkeit"
    RedaktionSeiteAusVorlageAngelegt:
      type: object
      required:
        - id
        - adresse
      properties:
        id:
          type: string
          format: uuid
        adresse:
          type: string
          description: Aus dem Titel gebildet, bei Kollision mit Zusatz (`-2`, `-3`).
    LagerFeedEintrag:
      type: object
      description: Eine Änderung. Nur Verweis auf die Zeile, kein Inhalt.
      required:
        - seq
        - objekttyp
        - id
        - art
        - version
        - zeitpunkt
      properties:
        seq:
          type: integer
          description: Folgenummer des Schreibvorgangs im Lager.
        objekttyp:
          type: string
          description: Name der Tabelle des Moduls (zum Beispiel `aufgabe`).
        id:
          type: string
          format: uuid
        art:
          type: string
          enum:
            - neu
            - geaendert
            - geloescht
        version:
          type: integer
          description: Version der Zeile nach der Änderung.
        zeitpunkt:
          type: string
          format: date-time
    LagerFeedSeite:
      type: object
      required:
        - eintraege
        - bis
        - weitere
      properties:
        eintraege:
          type: array
          description: Nach `seq` aufsteigend, gefiltert nach Leserecht und Zeilenfilter der Rolle.
          items:
            $ref: "#/components/schemas/LagerFeedEintrag"
        bis:
          type: integer
          description: Die App fragt mit `seit=<bis>` weiter. Auf der letzten Seite die Folgenummer des Lagers zu Beginn der Anfrage.
        weitere:
          type: boolean
          description: Wahr, wenn es noch Einträge nach `bis` gibt.
    LagerFeedStand:
      type: object
      description: Antwort ohne `seit`.
      required:
        - seq
        - objekttypen
      properties:
        seq:
          type: integer
          description: Aktuelle Folgenummer des Lagers.
        objekttypen:
          type: array
          description: Die Objekttypen, die die Rolle lesen darf.
          items:
            type: string
    LagerFeedNeuLaden:
      type: object
      description: Fehler mit Statuscode 410. Gleiche Form wie `Fehler`, dazu die aktuelle Folgenummer.
      required:
        - code
        - message
        - seq
      properties:
        code:
          type: string
          enum:
            - FEED_NEU_LADEN
        message:
          type: string
        seq:
          type: integer
    LagerVersionKonflikt:
      type: object
      description: |
        Fehler mit Statuscode 409 für jede Lager-Route, die eine Zeile ändert oder löscht. Die Anfrage trug nicht die aktuelle `version`. `aktuell` ist der Stand der Zeile in der Form, die die Rolle auch beim Lesen bekommt (nie mehr). `abweichend` nennt die Felder der Anfrage, die jetzt anders stehen (ohne Felder, die die Rolle nicht sieht); ist die Liste leer, kann die App die Anfrage mit der neuen Version wiederholen.
      required:
        - code
        - message
        - aktuell
        - abweichend
      properties:
        code:
          type: string
          enum:
            - VERSION_KONFLIKT
        message:
          type: string
        aktuell:
          type: object
          additionalProperties: true
        abweichend:
          type: array
          items:
            type: string
