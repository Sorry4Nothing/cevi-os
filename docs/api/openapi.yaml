  /api/v1/lager/{id}/anwesenheit/anfragen:
    get:
      operationId: holeLagerAnwesenheitAnfragen
      summary: Anfragen des Teams auflisten
      description: |
        Braucht das Recht `anwesenheit.bearbeiten` (Standard: nur die Lagerleitung; die Abteilungsleitung gilt als Lagerleitung). Alle Anfragen des Lagers, die ältesten zuerst; `status` filtert, `nach` und `limit` blättern. Eine Abfrage je Seite. Das Team liest seine eigenen Anfragen über `/anwesenheit/eigene`.

        Reihenfolge der Prüfungen: Pfad (400), Lager in der eigenen Abteilung (404), Mitgliedschaft (404), Recht (403), Schreibschutz (409 `LAGER_GESCHLOSSEN`, nur schreibend), Eingabe (400).

        Statuscodes: 200 bei Erfolg. 400 bei ungültiger ID oder Abfrage. 401 ohne Anmeldung. 403 ohne das Recht. 404 bei unbekanntem Lager, fremder Abteilung oder ohne Mitgliedschaft.
      tags:
