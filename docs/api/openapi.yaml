  /api/v1/programme/{id}:
    get:
      operationId: programmLesen
      summary: Ein Programm mit Teilnahmen der eigenen Kinder lesen
      tags:
        - Programme
      description: |
        Liefert die Felder des Listeneintrags (mit `kinder`) und zusätzlich `teilnahmeOffen` und
        (nur für anmeldeberechtigte Leitende) `eigeneAnmeldung`.

        Wer aufrufen darf: jede angemeldete Person, für die das Programm sichtbar ist (Regeln wie bei der Liste).
        Ein Programm, das die Person nicht sieht oder das es nicht gibt, ist 404; das gilt auch für Programme
        einer anderen Abteilung.

        - `kinder`: nur die eigenen, aktiven Kinder der Person aus Stufen, denen das Programm zugeordnet ist,
          sortiert nach Vorname, dann `id`. Leitende und SL sehen hier nicht die Kinder ihrer Stufe, sondern nur
          eigene Kinder; ihre Übersicht liefert `GET /api/v1/programme/{id}/teilnahmen`, eine Antwort korrigieren sie über
          `PUT /api/v1/programme/{id}/teilnahmen/{kindId}`.
        - `eigeneAnmeldung`: nur vorhanden, wenn die Person Leitung oder SL einer zugeordneten Stufe ist.
          Administratorinnen und Administratoren ohne solche Stufenrolle sowie Eltern bekommen den Schlüssel nie.
          Ohne gespeicherte Antwort steht «offen».

        Statuscodes: 200 Erfolg; 400 `id` ist keine UUID; 401 keine gültige Sitzung; 403 Konto muss zuerst das
        Passwort ändern; 404 Programm unbekannt oder nicht sichtbar; 426 App-Version zu alt; 429 zu viele Anfragen.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/ProgrammIdPfad"
      responses:
        "200":
          description: Das Programm mit Zusatzangaben für die angemeldete Person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgrammDetail"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/programme/{id}/kontakte:
    get:
      operationId: programmKontakteLesen
      summary: Kontaktpersonen eines Programms lesen
      tags:
        - Programme
      description: |
        Kontaktpersonen sind die SL der zugeordneten Stufen, die sich für das Programm mit Status «ja» angemeldet
        haben (`PUT /api/v1/programme/{id}/leitung`) und deren Konto aktiv ist. Wer sich abmeldet oder noch nicht
        geantwortet hat, fehlt sofort. Ist keine SL angemeldet, ist `kontakte` leer; die App zeigt dann
        «Stufenleitung», und der Einzelchat mit der SL der Stufe geht trotzdem.

        **Telefonnummer.** `telefon` ist nur für Eltern mit einem aktiven Kind in einer Stufe dieser SL gefüllt,
        sonst `null`. Das gilt auch für Admins, Leitende und SL, auch für die der eigenen Stufe. Sortiert nach `name`,
        dann `id`.

        Die Antwort trägt `Cache-Control: no-store`.

        **Rollen.** Jede angemeldete Person, für die das Programm sichtbar ist (Regeln wie bei
        `GET /api/v1/programme/{id}`); sonst 404. Statuscodes: 200, 400, 401, 403, 404, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/ProgrammIdPfad"
      responses:
        "200":
          description: Die Kontaktpersonen des Programms.
          headers:
            Cache-Control:
              description: Immer `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KontakteAntwort"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/programme/{id}/zuordnung:
    put:
      operationId: programmZuordnen
      summary: Stufen und Sichtbarkeit eines Programms setzen
      tags:
        - Programme
      description: |
        Ersetzt die Stufenzuordnung und die Sichtbarkeit des Programms durch den übergebenen Stand (kein
        Hinzufügen oder Entfernen einzelner Einträge). Ein Aufruf ohne tatsächliche Änderung gibt ebenfalls 204.
        Jede Änderung wird im Audit-Log vermerkt.

        Wer aufrufen darf:
        - Administratorinnen und Administratoren: alles.
        - Stufenleitungen (SL): nur Änderungen, die ausschliesslich Stufen betreffen, in denen sie selbst SL sind.
          Eine hinzugefügte oder entfernte Stufe muss eine eigene SL-Stufe sein; ändert sich die Sichtbarkeit,
          müssen alle bisherigen und neuen Stufen eigene SL-Stufen sein.
        - Leitende und Eltern nie, auch nicht bei einem Aufruf ohne Änderung (403).

        Regeln für den Body: `stufen` enthält nur Stufen der eigenen Abteilung (fremde oder unbekannte IDs sind
        400, nicht 404; eine SL bekommt dafür 403, weil die Rechteprüfung zuerst läuft). Ohne Stufen ist nur die
        Sichtbarkeit «intern» erlaubt, sonst 400.

        Reihenfolge der Prüfung: Eingabeform (400), Sichtbarkeit des Programms (404), Recht (403), Stufen der
        Abteilung und Regel «ohne Stufe nur intern» (400).
        Statuscodes: 204 gespeichert, kein Body; 400 ungültige Eingabe; 401 keine gültige Sitzung; 403 kein Recht
        zur Zuordnung oder Konto muss zuerst das Passwort ändern; 404 Programm unbekannt oder nicht sichtbar;
        426 App-Version zu alt; 429 zu viele Anfragen.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/ProgrammIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgrammZuordnung"
      responses:
        "204":
          description: Zuordnung gespeichert. Kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/programme/{id}/teilnahmen:
    get:
      operationId: programmTeilnahmenLesen
      summary: Übersicht der Teilnahmen eines Programms lesen
      tags:
        - Programme
      description: |
        Liefert die Zahlen (Anzahl «ja», «nein» und «offen») sowie die Liste der Kinder und die Liste der Leitenden.
        «offen» heisst: noch keine Antwort gespeichert. Es zählen nur aktive Kinder und aktive Konten, jeweils in
        den Stufen, denen das Programm zugeordnet ist. Die Antwort ist nicht seitenweise: Sie ist durch die Grösse
        der Stufen begrenzt.

        **Was wer sieht.**
        - Administratorinnen und Administratoren: alle Kinder und Leitenden aller zugeordneten Stufen.
        - Leitende und SL: alle Kinder und alle Leitenden und SL der zugeordneten Stufen, in denen sie selbst
          Leitung oder SL sind.
        - Eltern: nur die eigenen Kinder in zugeordneten Stufen. `leitende` ist leer.
        - Wer beides ist (Leitung einer Stufe und Elternteil in einer anderen), bekommt die Vereinigung.
        Die `zahlen` zählen genau die gelieferten Listen.

        Sortiert: Kinder nach Vorname, Nachname, `id`; Leitende nach Name, `id`.

        **Reihenfolge der Prüfung.** Eingabe (400), Sichtbarkeit des Programms (404), Recht (403). 403 bekommt, wer
        das Programm sieht, aber weder Admin noch Leitung einer zugeordneten Stufe noch Elternteil eines Kindes
        darin ist, zum Beispiel die SL einer anderen Stufe.
        Statuscodes: 200 Erfolg; 400 `id` keine UUID; 401 keine gültige Sitzung; 403 kein Recht auf die Übersicht
        oder Konto muss zuerst das Passwort ändern; 404 Programm unbekannt oder nicht sichtbar; 426 App-Version
        zu alt; 429 zu viele Anfragen.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/ProgrammIdPfad"
      responses:
        "200":
          description: Die Übersicht der Teilnahmen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeilnahmenUebersicht"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/programme/{id}/teilnahmen/{kindId}:
    put:
      operationId: teilnahmeSetzen
      summary: Teilnahme eines Kindes melden oder ändern
      tags:
        - Programme
      description: |
        Setzt die Antwort «ja» oder «nein» für ein Kind an einem Programm; eine bestehende Antwort wird
        überschrieben. Ohne gespeicherte Antwort gilt «offen» (siehe `ProgrammKind.status` = `null`). Es gibt kein
        Zurücksetzen auf «offen».

        Wer aufrufen darf: Eltern des Kindes, Leitende und SL der Stufe des Kindes sowie Administratorinnen und
        Administratoren. Das Programm muss der Stufe des Kindes zugeordnet und das Kind aktiv sein. Leitende oder
        SL einer anderen Stufe und Eltern fremder Kinder bekommen 403.

        Reihenfolge der Prüfung: Eingabe (400); Programm nicht sichtbar oder Kind nicht in der eigenen Abteilung
        (404, ohne Unterscheidung); Zuständigkeit, Stufenzuordnung und aktives Kind (403); Programm noch offen (409).
        Statuscodes: 204 gespeichert, kein Body; 400 ungültige Eingabe (unbekanntes oder fehlendes Feld, `status`
        weder «ja» noch «nein», `id` oder `kindId` keine UUID); 401 keine gültige Sitzung; 403 nicht zuständig,
        Programm nicht der Stufe des Kindes zugeordnet, Kind inaktiv oder Konto muss zuerst das Passwort ändern;
        404 Programm unbekannt oder nicht sichtbar, Kind unbekannt oder aus anderer Abteilung;
        409 Programm abgesagt oder schon begonnen (Code `PROGRAMM_GESCHLOSSEN`); 426 App-Version zu alt;
        429 zu viele Anfragen.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/ProgrammIdPfad"
        - $ref: "#/components/parameters/ProgrammKindIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgrammAntwort"
      responses:
        "204":
          description: Teilnahme gespeichert. Kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: |
            Das Programm ist abgesagt (Status nicht «aktiv») oder hat schon begonnen. Die Teilnahme lässt sich nicht
            mehr ändern. Der Fehlercode ist `PROGRAMM_GESCHLOSSEN`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
              example:
                code: PROGRAMM_GESCHLOSSEN
                message: Das Programm ist abgesagt oder hat schon begonnen. Die Teilnahme lässt sich nicht mehr ändern.
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/programme/{id}/leitung:
    put:
      operationId: leitungAnmelden
