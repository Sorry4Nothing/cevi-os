  /api/v1/admin/import:
    post:
      operationId: fuehreAdminImportAus
      summary: Kinder und Leitende importieren
      description: |
        Nur Admins. Legt alle Zeilen mit Status `neu` in einer Transaktion an: Kinder wie `POST /api/v1/admin/kinder`, Leitende wie `POST /api/v1/admin/personen` (kein Admin, Rolle `leitung` oder `stufenleitung` in der gewählten Stufe, keine Elternverknüpfung) mit je eigenem Startpasswort und einem Audit-Eintrag `person_angelegt` pro Konto. Der Server berechnet die Zeilenstatus neu und vertraut dem Browser nicht; alles ausser `neu` wird übersprungen. Ein zweiter Import derselben Datei legt daher nichts doppelt an.

        Die Startpasswörter stehen nur in dieser 201-Antwort. Sie werden nicht gespeichert und lassen sich nicht erneut abrufen. Die Antwort kommt erst nach dem Commit; scheitert irgendein Konto, wird alles zurückgenommen und es gibt keine Passwörter. Das Anlegen von 500 Konten dauert wegen der Passwortprüfung je Konto entsprechend lange.

        `uebersprungen` zählt alle Zeilen, die nicht `neu` waren (vorhanden, doppelt, ungültig, ausgelassen).

        Statuscodes: 201 bei Erfolg. 400 wie bei der Vorschau. 403 für Nicht-Admins. 409 mit Code `BENUTZERNAME_VERGEBEN`, wenn ein Benutzername zwischen Berechnung und Anlegen vergeben wurde.
