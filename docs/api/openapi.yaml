  parameters:
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: |
        Version der App im Format `x.y.z` (drei Zahlen, z. B. `1.2.0`). Gilt für alle Pfade unter `/api/*`
        (nicht für `/health`, die Seiten und `/.well-known`). Ist die Version älter als der Mindeststand des
        Servers, antwortet er mit 426 `APP_VERALTET`. Eine Angabe in anderem Format gilt als zu alt (426).
        Ohne den Header läuft die Anfrage weiter. Die App schickt den Header immer.
      schema:
        type: string
        pattern: ^\d+\.\d+\.\d+$
        example: 1.2.0
    AppHerkunft:
      name: Origin
      in: header
      required: false
      description: |
        Herkunft der App für die Schutzprüfung von better-auth. Jeder POST an `/api/auth/*`, der ein
        `Cookie` mitschickt, braucht eine vertraute Herkunft, sonst 403 (`MISSING_OR_NULL_ORIGIN` oder
        `INVALID_ORIGIN`). Vertraut ist das App-Schema `cevi-os://` (auch mit Host und Port, z. B.
        `cevi-os://192.0.2.1:8081` für Entwicklungs-Builds). Statt `Origin` genügt `expo-origin` mit demselben
        Wert: Der Server übernimmt ihn als `Origin`, wenn `Origin` fehlt. Reine Anmeldungen ohne Cookie
        brauchen keine Herkunft.
      schema:
        type: string
        example: cevi-os://
    ProgrammIdPfad:
      name: id
      in: path
      required: true
      description: ID des Programms.
      schema:
        type: string
        format: uuid
    ProgrammKindIdPfad:
      name: kindId
      in: path
      required: true
      description: ID des Kindes.
      schema:
        type: string
        format: uuid
    ChatPfadId:
      name: id
      in: path
      required: true
      description: ID des Chats.
      schema:
        type: string
        format: uuid
    NachrichtenCursorVor:
      name: vor
      in: query
      required: false
      description: Cursor. ID der ältesten bereits bekannten Nachricht; geliefert werden ältere. Wert aus `naechster` der vorherigen Antwort.
      schema:
        type: string
        format: uuid
    AdminPersonId:
      name: id
      in: path
      required: true
      description: ID der Person (UUID).
      schema:
        type: string
        format: uuid
    AdminStufeId:
      name: id
      in: path
      required: true
      description: ID der Stufe (UUID).
      schema:
        type: string
        format: uuid
    AdminKindId:
      name: id
      in: path
      required: true
      description: ID des Kindes (UUID).
      schema:
        type: string
        format: uuid
  securitySchemes:
    sitzung:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: |
        Die Sitzung hängt an einem signierten Cookie, das `POST /api/auth/sign-in/username` (oder der Abschluss des
        zweiten Faktors) per `Set-Cookie` setzt. Es gibt weder Bearer-Token noch API-Schlüssel: Ein `Authorization`-Header
        wird nicht ausgewertet, und das Feld `token` in Antworten ist nicht als Bearer-Token verwendbar.

        **Name.** Unter HTTPS (Betrieb) heisst das Cookie `__Secure-better-auth.session_token`; ohne HTTPS
        `better-auth.session_token`. Der Name enthält immer `session_token`.

        **Speichern und senden.** Die App speichert die `name=wert`-Paare aus allen `Set-Cookie`-Headern unverändert
        (ohne Attribute wie `Path`, `Max-Age`) im sicheren Speicher des Geräts und schickt sie bei jedem Aufruf als
        `Cookie`-Header (mehrere Paare mit `; ` getrennt). Cookies mit `Max-Age=0` löscht sie aus dem Speicher.
        Ersetzt eine Antwort das Cookie (Verlängerung, Passwortwechsel, Einrichtung des zweiten Faktors), gilt das neue.

        **Lebensdauer.** 90 Tage, verlängert bei Nutzung durch `GET /api/auth/get-session` (einmal pro Tag höchstens).
        Die Routen unter `/api/v1` verlängern nicht. Kein Cookie-Cache: Eine beendete Sitzung (Abmelden, «Überall
        abmelden», Passwortwechsel auf einem anderen Gerät, Löschen oder Deaktivieren des Kontos) endet sofort mit 401.

        **Herkunft.** Jeder POST mit Cookie braucht eine vertraute Herkunft (siehe Parameter `Origin`).
    zweiterFaktorZwischenschritt:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.two_factor
      description: |
        Zwischen-Cookie, das `POST /api/auth/sign-in/username` bei eingerichtetem zweitem Faktor setzt
        (`twoFactorRedirect: true`). Es gilt nur für `POST /api/auth/two-factor/verify-totp` und
        `POST /api/auth/two-factor/verify-backup-code`. Gespeichert und gesendet wird es wie das Session-Cookie.
        Unter HTTPS trägt es den Präfix `__Secure-`, ohne HTTPS heisst es `better-auth.two_factor`; der Name endet
        immer auf `two_factor`.
  responses:
    UngueltigeEingabe400:
      description: Ungültige Eingabe (code UNGUELTIGE_EINGABE), ohne Details
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    NichtAngemeldet401:
      description: Keine oder ungültige Sitzung (code NICHT_ANGEMELDET)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    KeineBerechtigung403:
      description: Keine Berechtigung (code KEINE_BERECHTIGUNG)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    NichtGefunden404:
      description: Nicht gefunden (code NICHT_GEFUNDEN); auch für Objekte einer anderen Abteilung
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    AppVeraltet426:
      description: App-Version unter dem Minimum (code APP_VERALTET)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    ZuVieleAnfragen429:
      description: Zu viele Anfragen (code ZU_VIELE_ANFRAGEN)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
