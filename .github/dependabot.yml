version: 2
updates:
  # npm-Workspaces: Die Lock-Datei im Wurzelverzeichnis deckt apps/api ab
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint unterstützt nur TypeScript unter 6.1
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  # Versionen der Actions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
